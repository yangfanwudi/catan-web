  var replay = null;         // { cfg, actions, idx, total, state, baseJson, baseIdx } | null

  /* ==================== 对局记录 journal（v1.24 契约 B） ==================== */

  // 旧档/损坏输入兜底：只保留 { i, turn, actor, a.type 字符串, vps 数组 } 形态完整的条目
  function sanitizeJournal(arr) {
    if (!Array.isArray(arr)) return [];
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var e = arr[i];
      if (!e || typeof e !== 'object') continue;
      if (!e.a || typeof e.a.type !== 'string') continue;
      if (!Array.isArray(e.vps)) continue;
      out.push(e);
    }
    return out;
  }

  // 依据引擎状态重建开局配置（读档后「再来一局」与时光机锚点共用）；
  // seed 由调用方决定是否带上（重放必须带，「再来一局」不带以获得新地图）
  function cfgFromState(st, withSeed) {
    if (!st || !st.players || !st.players.length) return null;
    var players = [];
    for (var i = 0; i < st.players.length; i++) {
      var q = st.players[i];
      players.push({
        name: q.name,
        color: q.color,
        isAI: !!q.isAI,
        difficulty: (q.difficulty === 'easy' || q.difficulty === 'hard') ? q.difficulty : 'normal'
      });
    }
    var hr = (st.config && st.config.houseRules) || {};
    var cfg = {
      players: players,
      targetVP: (st.config && st.config.targetVP) || 10,
      randomBoard: !!(st.config && st.config.randomBoard),
      houseRules: { balancedDice: !!hr.balancedDice, friendlyRobber: !!hr.friendlyRobber }
    };
    if (withSeed && typeof gameSeed === 'number') cfg.seed = gameSeed;
    return cfg;
  }

  // 各玩家 VP 总分快照（computeVP 缺失/异常时按 0 计，只影响折线精度）
  function vpTotalsSafe() {
    var eng = getEngine();
    return state.players.map(function (p) {
      var tot = 0;
      if (eng && typeof eng.computeVP === 'function') {
        try {
          var v = eng.computeVP(state, p.idx);
          if (v && typeof v.total === 'number') tot = v.total;
        } catch (e) { /* 忽略，按 0 计 */ }
      }
      return tot;
    });
  }

  // 动作执行前抓取 journal 需要的前置信息（applyAction 会原地改 state，事后无法补取）：
  // 行动者/阶段恒取；pendingTrade 对账（玩家交易付出方）、垄断/偷窃的手牌差值按需取。
  function journalPreCapture(action) {
    if (!state || state.phase === 'gameover') return null;
    var pre = { actor: currentActor(), phase: state.phase, pt: null, hands: null, monRes: null, stealFrom: -1 };
    if (state.pendingTrade) {
      pre.pt = {
        from: state.pendingTrade.from,
        give: cloneRes(state.pendingTrade.give),
        get: cloneRes(state.pendingTrade.get)
      };
    }
    var t = action ? action.type : '';
    if (t === 'playDevCard' && action.card === 'monopoly' && RES_KEYS.indexOf(action.resource) >= 0) {
      pre.monRes = action.resource;
      pre.hands = state.players.map(function (p) { return p.resources ? (p.resources[action.resource] || 0) : 0; });
    }
    if (t === 'steal' && typeof action.target === 'number' && action.target >= 0) {
      pre.stealFrom = action.target;
      pre.hands = state.players.map(function (p) { return cloneRes(p.resources); });
    }
    return pre;
  }

  // 动作成功后写入一条 journal（applyAndDrive 专用；引擎拒绝不记录）。
  // flow 记录资源漏斗增量（按玩家分组、只记触碰到键，保持存档精简）：
  //   prod = 掷骰/初始产出；got = 交易/银行/卡效收入；spent = 建造/买卡/交易付出/流失。
  function journalRecord(action, events, pre) {
    if (!state || !state.players || !pre) return;
    var ev = [];
    var flow = {};
    function bucket(p) {
      var k = String(p);
      return flow[k] || (flow[k] = { prod: {}, got: {}, spent: {} });
    }
    function addTo(slot, gains) {
      if (!gains) return;
      for (var key in gains) {
        if (!Object.prototype.hasOwnProperty.call(gains, key)) continue;
        var n = gains[key];
        if (typeof n === 'number' && n !== 0 && isFinite(n)) slot[key] = (slot[key] || 0) + n;
      }
    }
    var rollSum = null;
    var actName = { road: '修路', settlement: '建村', city: '建城' };
    var devName = { knight: '骑士', roadBuilding: '路修', yearOfPlenty: '丰收', monopoly: '垄断' };
    var gainTag = { roll: '产出', setup: '初始', trade: '交易', bankTrade: '银行', yearOfPlenty: '丰收', monopoly: '垄断' };

    for (var i = 0; i < events.length; i++) {
      var e = events[i] || {};
      switch (e.type) {
        case 'roll':
          rollSum = (e.d1 || 0) + (e.d2 || 0);
          ev.push('掷骰 ' + e.d1 + '+' + e.d2 + '=' + rollSum);
          break;
        case 'gain': {
          var b = bucket(e.player);
          var isProd = e.reason === 'roll' || e.reason === 'setup';
          addTo(isProd ? b.prod : b.got, e.gains);
          var gtxt = [];
          for (var rk in (e.gains || {})) { if (e.gains[rk] > 0) gtxt.push(RES_NAMES[rk] + e.gains[rk]); }
          ev.push((gainTag[e.reason] || '获得') + ' ' + (gtxt.join('') || '0'));
          break;
        }
        case 'build':
          if (!e.free && pre.phase !== 'setup1' && pre.phase !== 'setup2') {
            var cost = (getEngine() && getEngine().BUILD_COSTS && getEngine().BUILD_COSTS[e.kind]) || null;
            if (cost) addTo(bucket(e.player).spent, cost);
          }
          ev.push((actName[e.kind] || e.kind) + ' #' + e.id + (e.free ? '（免费）' : ''));
          break;
        case 'devCard':
          var devCost = (getEngine() && getEngine().BUILD_COSTS && getEngine().BUILD_COSTS.devCard) || null;
          if (devCost) addTo(bucket(e.player).spent, devCost);
          ev.push('买发展卡');
          break;
        case 'playDevCard':
          ev.push('打出' + (devName[e.card] || e.card));
          break;
        case 'robber':
          ev.push('移强盗 #' + e.hexId);
          break;
        case 'steal':
          ev.push(e.from != null && e.from >= 0 ? '偷窃 1 张' : '无可偷');
          break;
        case 'discard':
          if (action && action.type === 'discard') addTo(bucket(e.player).spent, action.cards);
          ev.push('弃牌 ' + (e.count || 0) + ' 张');
          break;
        case 'gameover':
          ev.push('对局结束');
          break;
      }
    }

    // 玩家交易成交：挂单对账（应答者付 get 得 give；发起者付 give 得 get）
    if (action && action.type === 'respondTrade' && pre.pt) {
      var traded = false;
      for (var g = 0; g < events.length; g++) {
        if (events[g] && events[g].type === 'gain' && events[g].reason === 'trade') { traded = true; break; }
      }
      if (traded) {
        // 找出两个方向的收款人：按资源构成逐键匹配（总额相等时总额匹配会认错方向，
        // 例如 1 木 ⇄ 1 砖的等额交易）。两向都对不上时按引擎事件顺序兜底（先应答者后发起者）。
        var seenFrom = false;
        for (var g2 = 0; g2 < events.length; g2++) {
          var ge = events[g2];
          if (!ge || ge.type !== 'gain' || ge.reason !== 'trade') continue;
          var isResponder;
          if (resEqKeys(ge.gains, pre.pt.give)) isResponder = true;        // 收 give 的是应答者
          else if (resEqKeys(ge.gains, pre.pt.get)) isResponder = false;   // 收 get 的是发起者
          else isResponder = !seenFrom;                                    // 兜底：第一条视为应答者
          if (!isResponder) seenFrom = true;
          var payer = isResponder ? pre.pt.get : pre.pt.give; // 应答者付 get，发起者付 give
          addTo(bucket(ge.player).spent, payer);
        }
        ev.push('交易成交');
      }
    }
    // 银行/港口交易：收入走 gain(bankTrade)，付出侧从动作参数取
    if (action && action.type === 'bankTrade' && action.give) {
      addTo(bucket(pre.actor).spent, action.give);
    }
    // 偷窃：被偷者手牌差值（随机资源，事后对账出具体键）
    if (action && action.type === 'steal' && pre.stealFrom >= 0 && pre.hands) {
      var victim = state.players[pre.stealFrom];
      var thief = state.players[pre.actor];
      if (victim && thief) {
        for (var sk = 0; sk < RES_KEYS.length; sk++) {
          var key2 = RES_KEYS[sk];
          var before = pre.hands[pre.stealFrom][key2] || 0;
          var after = victim.resources ? (victim.resources[key2] || 0) : 0;
          if (after < before) {
            addTo(bucket(pre.stealFrom).spent, (function () { var o = {}; o[key2] = before - after; return o; })());
            addTo(bucket(pre.actor).got, (function () { var o = {}; o[key2] = before - after; return o; })());
          }
        }
      }
    }
    // 垄断：各受害者手牌差值（被动流失计入 spent）
    if (action && action.type === 'playDevCard' && action.card === 'monopoly' && pre.monRes && pre.hands) {
      for (var mi = 0; mi < state.players.length; mi++) {
        if (mi === pre.actor) continue;
        var mb = pre.hands[mi] || 0;
        var ma = state.players[mi].resources ? (state.players[mi].resources[pre.monRes] || 0) : 0;
        if (ma < mb) addTo(bucket(mi).spent, (function (r, n) { var o = {}; o[r] = n; return o; })(pre.monRes, mb - ma));
      }
    }

    // 动作原文深拷贝（防 UI/AI 复用对象被后续修改；JSON 不安全字段被静默丢弃）
    var actionCopy = null;
    try { actionCopy = JSON.parse(JSON.stringify(action)); } catch (e2) { actionCopy = { type: action && action.type }; }
    var sum = ev.join('；');
    if (sum.length > 160) sum = sum.slice(0, 157) + '…';
    journal.push({
      i: journal.length,
      turn: state.turnCount,
      actor: pre.actor,
      a: actionCopy,
      sum: sum,
      roll: rollSum,
      vps: vpTotalsSafe(),
      flow: flow
    });
  }

  function sumResOf(res) {
    var t = 0;
    if (res) for (var k in res) { if (Object.prototype.hasOwnProperty.call(res, k) && typeof res[k] === 'number') t += res[k]; }
    return t;
  }

  // 两个资源包逐键相等（0 值与缺失键等价；用于交易方向识别）
  function resEqKeys(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < RES_KEYS.length; i++) {
      var k = RES_KEYS[i];
      if ((a[k] || 0) !== (b[k] || 0)) return false;
    }
    return true;
  }

  // 进入新对局/读档/弃局：清空本局过程记录（进入联机对局同样清空——服务器权威，
  // 本地 journal 不再追加，避免与服务器事件流错位）
  function journalReset() { journal = []; }

  // 回放期间把界面切回真实局面的收尾（startNewGame/loadGame/backToMenu 共用）
  function replayAbort() {
    if (!replay) return;
    replay = null;
    savedRealState = null;
    var ui = getUI();
    if (ui && typeof ui.setReplayBar === 'function') {
      try { ui.setReplayBar({ active: false }); } catch (e) { /* 忽略 */ }
    }
  }

  /* ==================== 依赖获取 ==================== */
  function getEngine() {
    if (typeof CatanEngine !== 'undefined') return CatanEngine;
    if (typeof window !== 'undefined' && window.CatanEngine) return window.CatanEngine;
    return null;
  }
  function getAI() {
    if (typeof CatanAI !== 'undefined') return CatanAI;
    if (typeof window !== 'undefined' && window.CatanAI) return window.CatanAI;
    return null;
  }
  function getUI() {
    if (typeof CatanUI !== 'undefined') return CatanUI;
    if (typeof window !== 'undefined' && window.CatanUI) return window.CatanUI;
    return null;
  }
  // 重置 AI 模块的跨局内部记忆（模块级变量，如「每人每回合至多报价一次」哨兵）；
  // AI 本体不修改引擎状态，这里只调它暴露的公开重置口
  function resetAIMemo() {
    var ai = getAI();
    if (ai && typeof ai.resetOfferMemo === 'function') {
      try { ai.resetOfferMemo(); } catch (e) { /* 忽略 */ }
    }
  }

  /* ==================== 小工具 ==================== */
  function pushUnique(arr, v) {
    if (arr.indexOf(v) < 0) arr.push(v);
  }
  function resTotal(res) {
    var t = 0;
    if (res) for (var i = 0; i < RES_KEYS.length; i++) t += res[RES_KEYS[i]] || 0;
    return t;
  }
  function handTotal(p) {
    return p && p.resources ? resTotal(p.resources) : 0;
  }
  function cloneRes(res) {
    var o = {};
    if (res) for (var i = 0; i < RES_KEYS.length; i++) {
      var k = RES_KEYS[i];
      if (res[k]) o[k] = res[k];
    }
    return o;
  }
  function resText(res) {
    var parts = [];
    for (var i = 0; i < RES_KEYS.length; i++) {
      var k = RES_KEYS[i];
      if (res && res[k] > 0) parts.push(RES_NAMES[k] + '×' + res[k]);
    }
    return parts.length ? parts.join('、') : '（无）';
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function formatNow() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function toast(text) {
    var now = Date.now();
    if (toastMemo.text === text && now - toastMemo.at < 700) return;
    toastMemo.text = text; toastMemo.at = now;
    var ui = getUI();
    if (ui && typeof ui.showToast === 'function') {
      try { ui.showToast(text); } catch (e) { /* UI 异常不阻断编排 */ }
    } else if (typeof console !== 'undefined' && console.warn) {
      console.warn('[App] ' + text);
    }
  }

  /* ==================== 行动者判定 ==================== */
  // 当前应该行动的玩家 idx（SPEC：行动者由 phase 决定；pendingTrade 期间是当前应答者）
  function currentActor() {
    if (!state || state.phase === 'gameover') return -1;
    var pt = state.pendingTrade;
    if (pt && pt.targets && pt.targets.length &&
        typeof pt.cursor === 'number' && pt.cursor >= 0 && pt.cursor < pt.targets.length) {
      return pt.targets[pt.cursor];
    }
    if (state.phase === 'setup1' || state.phase === 'setup2') {
      return state.setupQueue && state.setupQueue.length ? state.setupQueue[0] : -1;
    }
    if (state.phase === 'discard') {
      return state.discardQueue && state.discardQueue.length ? state.discardQueue[0] : -1;
    }
    return typeof state.currentPlayer === 'number' ? state.currentPlayer : -1;
  }

  function safeValidActions() {
    var eng = getEngine();
    if (!eng || !state || typeof eng.getValidActions !== 'function') return [];
    try { return eng.getValidActions(state) || []; }
    catch (e) { return []; }
  }

  /* ==================== 撤回（v1.20 契约 A：undoStack） ==================== */
  // 正确性要点（BGA 式确定性撤回）：只有「结果完全由执行者决定」的动作可撤——
  // 建造（位置自选）与银行/港口交易（汇率公开、数量自选）。一旦出现
  // 随机性（roll 掷骰 / buyDevCard 抽卡 / steal 偷牌）、跨玩家隐藏信息
  // （respondTrade 接受=成交）或回合边界（endTurn），历史不再可确定复算，必须清栈。
  // 压栈只认真人行动者：AI 的建造绝不入栈，撤销永远不会回退 AI 的落子。

  function serializeStateSafe() {
    var eng = getEngine();
    if (!eng || typeof eng.serializeState !== 'function' || !state) return null;
    try { return eng.serializeState(state); } catch (e) { return null; }
  }

  function undoReset() { undoStack.length = 0; }

  // 该动作执行成功后是否必须清栈（契约 A 清单：roll / buyDevCard / steal /
  // respondTrade(accept:true) / playDevCard(knight) / endTurn）
  function undoIsClearAction(a) {
    if (!a || typeof a.type !== 'string') return false;
    if (a.type === 'respondTrade') return a.accept === true; // 拒绝/还价不动栈
    if (a.type === 'playDevCard') return a.card === 'knight'; // 路修/丰收/垄断不动栈
    return a.type === 'roll' || a.type === 'buyDevCard' ||
           a.type === 'steal' || a.type === 'endTurn';
  }

  // 压栈条件：压栈白名单动作 + 当前行动者是真人 + 非联机 + 对局进行中。
  // 返回执行前的状态快照（serializeState 串）；不满足条件返回 null（不压栈）。
  // 注意在 applyAction 之前调用（快照必须是动作发生前的局面）。
  function undoSnapshotBefore(action) {
    if (net.active || !state || state.phase === 'gameover') return null;
    if (!action || !UNDO_PUSH_TYPES[action.type]) return null;
    var actor = currentActor();
    var p = actor >= 0 ? state.players[actor] : null;
    if (!p || p.isAI) return null; // AI 落子不可被玩家撤回
    return serializeStateSafe();
  }

  // 入栈项 = { snap, jLen }：snap 为动作前局面快照；jLen 为动作前的 journal 长度
  // （v1.24 契约 B 接口——撤销时把 journal 一并截回该长度，否则被撤动作仍留在
  // 过程记录里，时光机会重放出「幽灵动作」、复盘漏斗/折线会失真）。
  function undoPush(snapshot, jLen) {
    if (snapshot == null) return;
    undoStack.push({ snap: snapshot, jLen: (typeof jLen === 'number' && jLen >= 0) ? jLen : null });
    if (undoStack.length > UNDO_STACK_LIMIT) undoStack.shift(); // 上限 20，丢最旧
  }

  // 撤回可用性（UI 按钮启停的权威来源，随 opts 下发）：栈非空且非联机且对局进行中
  function undoCan() {
    return !net.active && !!state && state.phase !== 'gameover' && undoStack.length > 0;
  }

  // 供 render opts 携带的撤回信息：canUndo 控制按钮禁用，online 供 UI 隐藏按钮
  function undoInfo() {
    return { canUndo: undoCan(), size: undoStack.length, online: net.active };
  }

  // 撤销入口：弹栈 → deserializeState 恢复 → 同步 lastActorSeen/buildMode → 完整渲染。
  // v1.24 契约 B 接口：被撤动作与其后追加的 journal 条目一并截断（jLen 锚点），
  // 保证过程记录与真实局面一致、时光机重放与复盘统计不失真。
  // 通过 onAction({type:'undo'})（ui.js 键盘 Z / 撤销按钮）或 App.undo() 调用。
  function undo() {
    if (net.active) { toast('联机模式不支持撤销'); return { ok: false, error: '联机模式不支持撤销' }; }
    if (!state) { toast('当前没有进行中的对局'); return { ok: false, error: '当前没有进行中的对局' }; }
    if (state.phase === 'gameover') { toast('游戏已结束'); return { ok: false, error: '游戏已结束' }; }
    if (!undoStack.length) { toast('没有可撤销的操作'); return { ok: false, error: '没有可撤销的操作' }; }
    var eng = getEngine();
    if (!eng || typeof eng.deserializeState !== 'function') { toast('引擎未加载'); return { ok: false, error: '引擎未加载' }; }
    var entry = undoStack.pop();
    var snap = entry ? entry.snap : null;
    var st = null;
    try { st = eng.deserializeState(snap); } catch (e) { st = null; }
    if (!st || !st.players || !st.players.length) {
      toast('撤销失败：快照损坏');
      return { ok: false, error: '撤销失败：快照损坏' };
    }
    clearTimer(); // 丢弃挂起的 AI/便利调度，避免旧调度作用于回退后的局面
    // journal 截回动作前长度（v1.24）：防御非法/缺失锚点（旧格式或手工入栈）不动 journal
    if (entry && typeof entry.jLen === 'number' && entry.jLen >= 0 && entry.jLen <= journal.length) {
      journal = journal.slice(0, entry.jLen);
    }
    state = st;
    lastActorSeen = currentActor(); // 同步行动者基线（adjustBuildModeAfterAction 依赖它）
    buildMode = null;               // 同步建造模式：撤回后退出建造模式，由完整渲染重算高亮
    aiActionKey = '';
    aiActionCount = 0;
    renderAndDrive([]); // 完整渲染 + 自动存档（撤销落盘）+ 续驱动，与读档同款路径
    return { ok: true };
  }

  /* ==================== opts 计算 ==================== */
  // 手动建造模式仍在合法动作里时保留之；否则仅在“被迫建造”的场景自动推断，
  // 让 UI 能对合法点做呼吸高亮。selectable 恒为当前全部合法目标（超集），
  // 进入明确建造模式时收窄到该类目标，避免误点。
  function autoBuildMode(buildTypes) {
    if (!state) return null;
    if (state.phase === 'setup1' || state.phase === 'setup2') {
      if (buildTypes.buildSettlement) return 'settlement';
      if (buildTypes.buildRoad) return 'road';
      return null;
    }
    if (state.phase === 'main' && state.roadBuildingPending > 0 &&
        buildTypes.buildRoad && !buildTypes.buildSettlement && !buildTypes.buildCity) {
      return 'road';
    }
    return null;
  }

  function buildHint(actor, flags, mode) {
    if (!state) return '';
    var p = actor >= 0 ? state.players[actor] : null;
    var who = p ? p.name : '';
    var pt = state.pendingTrade;
    if (pt) {
      var fromP = state.players[pt.from] || { name: '玩家' };
      if (p && !p.isAI) {
        if (actor === pt.from) return '等待其他玩家应答你的交易…（底部交易抽屉可查看看板）';
        if ((pt.depth || 0) >= 1) {
          return '【' + fromP.name + '】还价：给你 ' + resText(pt.give) +
                 '，想要你的 ' + resText(pt.get) + ' —— 只能接受或拒绝';
        }
        return '【' + fromP.name + '】提议交易：给你 ' + resText(pt.give) +
               '，想要你的 ' + resText(pt.get) + ' —— 可在底部交易抽屉接受、拒绝或还价';
      }
      return '等待 ' + (p ? '【' + who + '】' : '') + '应答交易…';
    }
    switch (state.phase) {
      case 'setup1':
        if (flags.settlement) return '【' + who + '】初始布置：点击高亮交叉点放置定居点';
        if (flags.road) return '【' + who + '】初始布置：为新建的定居点选择一条道路';
        return '初始布置中…';
      case 'setup2':
        if (flags.settlement) return '【' + who + '】第二轮布置：放置定居点（立即获得相邻格各 1 资源）';
        if (flags.road) return '【' + who + '】第二轮布置：为新建的定居点选择一条道路';
        return '第二轮布置中…';
      case 'discard': {
        var total = p ? handTotal(p) : 0;
        var need = p ? Math.floor(total / 2) : 0;
        return '【' + who + '】手牌 ' + total + ' 张超过上限 7：请弃置 ' + need + ' 张';
      }
      case 'robber':
        return '掷出 7！【' + who + '】请点击一个格子移动强盗（强盗格不生产）';
      case 'steal':
        if (flags.steal) return '【' + who + '】点击一名对手，偷取其 1 张随机资源';
        return '周围没有可偷窃的对手，即将自动跳过…';
      case 'main':
        if (p && p.isAI) return '【' + who + '】回合中…';
        if (state.dice == null) return '轮到你了（' + who + '）：按「掷骰」开始回合';
        if (state.roadBuildingPending > 0) return '路修卡生效：还可免费建造 ' + state.roadBuildingPending + ' 条道路';
        if (mode) return '建造模式：点击高亮位置放置' +
          (mode === 'road' ? '道路' : mode === 'settlement' ? '村庄' : '城市') + '（可取消）';
        return '轮到你了（' + who + '）：可交易、建造、使用发展卡，或结束回合';
    }
    return '';
  }

  function computeOpts() {
    var opts = {
      buildMode: null,
      selectable: { hexes: [], edges: [], vertices: [], players: [] },
      activePlayer: -1,
      canRoll: false,     // 当前合法动作是否包含 roll（供 UI 掷骰按钮判断，读档后也正确）
      canEndTurn: false,  // 当前合法动作是否包含 endTurn（供悬浮操作簇启停；掷骰前/免费路未放完时为 false）
      playableDev: { knight: false, roadBuilding: false, yearOfPlenty: false, monopoly: false }, // 各发展卡当前是否可打（依 getValidActions，UI 据此点亮，不读引擎内部字段）
      undo: undoInfo(),   // v1.20 撤回状态：{ canUndo, size, online }（UI 按钮启停/隐藏依据）
      review: journal,    // v1.24 契约 B/C：本局过程记录（胜利画面「复盘统计」数据源，引用透传）
      hint: ''
    };
    if (!state) return opts;
    if (state.phase === 'gameover') {
      var w = state.winner != null && state.players[state.winner] ? state.players[state.winner].name : '';
      opts.hint = '游戏结束' + (w ? '：' + w + ' 获胜！' : '');
      return opts;
    }
    var actor = currentActor();
    opts.activePlayer = actor;
    var acts = safeValidActions();
    var sel = opts.selectable;
    var flags = { road: false, settlement: false, city: false, steal: false, robber: false };
    var buildTypes = {};
    for (var i = 0; i < acts.length; i++) {
      var a = acts[i] || {};
      switch (a.type) {
        case 'buildRoad':
          flags.road = true; buildTypes.buildRoad = true;
          pushUnique(sel.edges, a.edgeId); break;
        case 'buildSettlement':
          flags.settlement = true; buildTypes.buildSettlement = true;
          pushUnique(sel.vertices, a.vertexId); break;
        case 'buildCity':
          flags.city = true; buildTypes.buildCity = true;
          pushUnique(sel.vertices, a.vertexId); break;
        case 'roll':
          opts.canRoll = true; break;
        case 'endTurn':
          opts.canEndTurn = true; break;
        case 'moveRobber':
          flags.robber = true;
          pushUnique(sel.hexes, a.hexId); break;
        case 'steal':
          flags.steal = true;
          if (typeof a.target === 'number' && a.target >= 0) pushUnique(sel.players, a.target);
          break;
        case 'respondTrade':
          if (actor >= 0) pushUnique(sel.players, actor);
          break;
        case 'playDevCard':
          if (a.card && opts.playableDev[a.card] === false) opts.playableDev[a.card] = true;
          break;
      }
    }
    var manual = (buildMode && BUILD_KINDS[buildMode] && buildTypes[BUILD_KINDS[buildMode]]) ? buildMode : null;
    var mode = manual || autoBuildMode(buildTypes);
    opts.buildMode = mode;
    if (mode) { // 明确建造模式下只保留该类目标
      if (mode === 'road') { sel.vertices = []; sel.hexes = []; sel.players = []; }
      else { sel.edges = []; sel.hexes = []; sel.players = []; } // settlement / city
    }
    opts.hint = buildHint(actor, flags, mode);
    return opts;
  }

  /* ==================== 应用动作 / 渲染 / 驱动 ==================== */
  function clearTimer() {
    if (timer != null) { clearTimeout(timer); timer = null; }
  }
  function setTimer(fn, ms) {
    clearTimer();
    timer = setTimeout(fn, ms);
  }
  function aiDelay() { return SPEED_DELAY[speed] || SPEED_DELAY.normal; }

  function renderNow(events) {
    var ui = getUI();
    if (!ui || typeof ui.render !== 'function' || !state) return;
    try { ui.render(state, computeOpts(), events || []); }
    catch (e) {
      if (typeof console !== 'undefined' && console.error) console.error('[App] 渲染失败：', e);
    }
  }

  function applyActionSafe(action) {
    var eng = getEngine();
    if (!eng || !state) return { ok: false, error: '引擎未就绪' };
    try { return eng.applyAction(state, action) || { ok: false, error: '引擎无返回' }; }
    catch (e) {
      return { ok: false, error: '引擎异常：' + (e && e.message ? e.message : e) };
    }
  }

  // 成功应用动作 → 调整建造模式 → 渲染 + 自动存档 + 驱动后续流程
  // v1.20 撤回接线：压栈类动作在执行前取「动作前快照」，执行成功才入栈
  // （引擎拒绝不改动状态，不入栈，避免栈顶出现与当前局面相同的无效快照）；
  // v1.24 契约 B 接口：入栈同时记录动作前 journal 长度，撤销时据此截断过程记录；
  // 清栈类动作执行成功即清栈。两类动作清单互斥（见 UNDO_PUSH_TYPES / undoIsClearAction）。
  function applyAndDrive(action) {
    var jpre = journalPreCapture(action); // v1.24 契约 B：动作前抓取 journal 前置信息
    var snapshot = undoSnapshotBefore(action);
    var jLenBefore = journal.length; // 动作前过程记录长度（撤销截断锚点）
    var res = applyActionSafe(action);
    if (!res.ok) return res;
    if (snapshot != null) undoPush(snapshot, jLenBefore);
    else if (undoIsClearAction(action)) undoReset();
    journalRecord(action, res.events || [], jpre); // v1.24 契约 B：动作成功后记录
    adjustBuildModeAfterAction(action);
    renderAndDrive(res.events || []);
    return { ok: true, events: res.events || [] };
  }

  function renderAndDrive(events) {
    awardRankIfNeeded();   // 刚进入 gameover 时先结算段位，胜利画面才带段位行
    renderNow(events);
    advanceTutorial();     // 教程步骤随状态推进（含 AI 行动）
    autosave();
    driveFlow();
  }

  // 行动者切换或该类建造已无可选目标时，退出建造模式
  function adjustBuildModeAfterAction(action) {
    var actor = currentActor();
    if (actor !== lastActorSeen) { lastActorSeen = actor; buildMode = null; return; }
    if (!buildMode || !action) return;
    var t = action.type;
    if (t === 'endTurn' || t === 'roll') { buildMode = null; return; }
    var want = BUILD_KINDS[buildMode];
    if (t === want) {
      var acts = safeValidActions();
      var still = false;
      for (var i = 0; i < acts.length; i++) {
        if (acts[i] && acts[i].type === want) { still = true; break; }
      }
      if (!still) buildMode = null;
    }
  }

  // 流程总驱动：每步动作（含真人、AI、交易应答）之后都会走到这里
  function driveFlow() {
    clearTimer();
    if (!state || state.phase === 'gameover') return; // 结束：UI 依 gameover 事件显示胜利画面
    var actor = currentActor();
    var p = actor >= 0 ? state.players[actor] : null;
    if (!p) return;
    if (state.pendingTrade) {
      // 交易应答逐个推进：AI 目标自动应答，真人目标等待 UI 弹窗
      var pt = state.pendingTrade;
      var responder = (pt.targets && pt.cursor >= 0 && pt.cursor < pt.targets.length)
        ? pt.targets[pt.cursor] : -1;
      var rp = responder >= 0 ? state.players[responder] : null;
      if (rp && rp.isAI) {
        setTimer(function () { aiRespondTrade(responder); }, aiDelay());
      }
      return;
    }
    if (p.isAI) {
      // 每回合 AI 步数熔断：正常对局远达不到，防御异常模块导致的无限循环
      var key = state.turnCount + ':' + actor;
      if (key !== aiActionKey) { aiActionKey = key; aiActionCount = 0; }
      if (aiActionCount >= AI_ACTION_LIMIT) {
        toast('AI 行动步数异常，已暂停（回合 ' + state.turnCount + '）');
        return;
      }
      setTimer(aiTurnStep, aiDelay());
      return;
    }
    humanConvenience();
  }

  /* ==================== AI 调度 ==================== */
  function fallbackAction() {
    var acts = safeValidActions();
    for (var i = 0; i < acts.length; i++) {
      if (acts[i] && acts[i].type === 'endTurn') return acts[i];
    }
    return acts.length ? acts[0] : null;
  }

  function aiTurnStep() {
    if (!state || state.phase === 'gameover' || state.pendingTrade) return;
    var actor = currentActor();
    var p = actor >= 0 ? state.players[actor] : null;
    if (!p || !p.isAI) return;
    if (aiActionCount >= AI_ACTION_LIMIT) {
      toast('AI 行动步数异常，已暂停（回合 ' + state.turnCount + '）');
      return;
    }
    aiActionCount++;
    var ai = getAI();
    if (!ai || typeof ai.decide !== 'function') { toast('AI 模块未加载，无法继续'); return; }
    var action = null;
    try { action = ai.decide(state, actor, p.difficulty || 'normal'); }
    catch (e) { action = null; }
    if (!action || typeof action.type !== 'string') action = fallbackAction();
    var res = applyAndDrive(action);
    if (!res.ok) {
      // 决策结果被引擎拒绝时兜底一次，仍失败则停下并提示（避免死循环）
      var fb = fallbackAction();
      if (fb) {
        var res2 = applyAndDrive(fb);
        if (!res2.ok) toast('AI 无法行动：' + res2.error);
      } else {
        toast('AI 无法行动：' + res.error);
      }
    }
  }

  // AI 应答玩家交易（SPEC：AI 目标用 CatanAI.respondTrade）。
  // v1.19 还价协议接线：① 挂单 depth 原样传给 AI——depth 1（AI 作为原始发起者
  // 收到还价）时 AI 只接受/拒绝，绝不二次还价（契约 B3/B4）；② AI 返回 counter
  // 时构造 respondTrade{accept:false, counter} 提交引擎（旧实现只读 {accept}，
  // AI 还价会被压平为拒绝）；counter 仅 depth 0 允许，与引擎校验（A1/A4）双保险。
  function aiRespondTrade(responder) {
    if (!state || state.phase === 'gameover' || !state.pendingTrade) return;
    var pt = state.pendingTrade;
    if (!pt.targets || pt.cursor == null || pt.cursor < 0 || pt.cursor >= pt.targets.length) return;
    if (pt.targets[pt.cursor] !== responder) return; // 局面已变化，丢弃过期调度
    var p = state.players[responder];
    if (!p || !p.isAI) return;
    var ai = getAI();
    var accept = false;
    var counter = null;
    if (ai && typeof ai.respondTrade === 'function') {
      var trade = {
        from: pt.from,
        give: cloneRes(pt.give),
        get: cloneRes(pt.get),
        depth: pt.depth === 1 ? 1 : 0
      };
      try {
        var r = ai.respondTrade(state, responder, trade, p.difficulty || 'normal');
        accept = !!(r && r.accept);
        if (r && !accept && pt.depth !== 1 && r.counter && typeof r.counter === 'object') {
          var cg = cloneRes(r.counter.give), ct = cloneRes(r.counter.get);
          if (resTotal(cg) >= 1 && resTotal(ct) >= 1) counter = { give: cg, get: ct };
        }
      } catch (e) { accept = false; counter = null; }
    }
    var action = counter
      ? { type: 'respondTrade', accept: false, counter: counter }
      : { type: 'respondTrade', accept: accept };
    var res = applyAndDrive(action);
    if (!res.ok) {
      // 还价被引擎拒绝（AI 侧已自检形态，理论不可达）：退化为普通拒绝兜底，绝不卡死
      res = applyAndDrive({ type: 'respondTrade', accept: false });
      if (!res.ok) toast('交易应答失败：' + res.error);
    }
  }

  // 真人便利处理：steal 阶段唯一合法动作是 steal{-1}（无可偷对象）时自动跳过
  function humanConvenience() {
    var acts = safeValidActions();
    if (acts.length === 1 && acts[0] && acts[0].type === 'steal' && acts[0].target === -1) {
      setTimer(function () {
        if (!state || state.phase === 'gameover' || state.pendingTrade) return;
        var a = currentActor();
        if (a < 0 || !state.players[a] || state.players[a].isAI) return;
        var v = safeValidActions();
        if (v.length === 1 && v[0] && v[0].type === 'steal' && v[0].target === -1) {
          applyAndDrive({ type: 'steal', target: -1 });
        }
      }, 600);
    }
  }

  /* ==================== 时光机（v1.24 契约 D：journal 只读重放） ====================
   * 复盘模式：用开局同 seed createGame 重建初始态，逐条重放 journal 中的动作。
   * 相邻前进一步走 serialize 快照缓存（O(1)）；后退/跳转全量重建（对局规模下毫秒级）。
   * 回放期间引擎真实 state 不被触碰：渲染用 replay.state + 只读 opts，
   * handleAction 只放行 replay* 伪动作。残局接管 = 历史步 deserialize 成新对局。 */

  function replayActorOf(st) {
    if (!st || st.phase === 'gameover') return -1;
    var pt = st.pendingTrade;
    if (pt && pt.targets && pt.targets.length &&
        typeof pt.cursor === 'number' && pt.cursor >= 0 && pt.cursor < pt.targets.length) {
      return pt.targets[pt.cursor];
    }
    if (st.phase === 'setup1' || st.phase === 'setup2') {
      return st.setupQueue && st.setupQueue.length ? st.setupQueue[0] : -1;
    }
    if (st.phase === 'discard') {
      return st.discardQueue && st.discardQueue.length ? st.discardQueue[0] : -1;
    }
    return typeof st.currentPlayer === 'number' ? st.currentPlayer : -1;
  }

  function replayStart() {
    if (replay) { toast('已在时光机中'); return; }
    if (!state || state.phase !== 'gameover') { toast('对局结束后才能进入时光机'); return; }
    if (!journal.length) { toast('本局没有过程记录，无法回放'); return; }
    var eng = getEngine();
    if (!eng || typeof eng.createGame !== 'function' || typeof eng.applyAction !== 'function' ||
        typeof eng.serializeState !== 'function') {
      toast('引擎未加载，无法回放');
      return;
    }
    if (!gameCfg || typeof gameSeed !== 'number') { toast('本局缺少开局种子（旧档），无法回放'); return; }
    var actions = [];
    for (var i = 0; i < journal.length; i++) {
      var a = journal[i] && journal[i].a;
      if (a && typeof a.type === 'string') actions.push(a);
    }
    if (!actions.length) { toast('本局没有可回放的动作'); return; }
    clearTimer();
    savedRealState = serializeStateSafe();
    var cfgCopy = null;
    try { cfgCopy = JSON.parse(JSON.stringify(gameCfg)); } catch (e) { cfgCopy = null; }
    if (!cfgCopy) { toast('开局配置损坏，无法回放'); return; }
    replay = { cfg: cfgCopy, actions: actions, idx: 0, total: actions.length, state: null, baseJson: null, baseIdx: -1 };
    replayGoto(0);
    toast('时光机已开启：← → 逐步回放，Esc 退出');
  }

  // 第 idx 步的局面（idx = 已重放的动作数，0 = 开局初始态）。
  // 返回 null 表示种子/动作与引擎不一致，回放失败。
  function replayStateAt(idx) {
    var eng = getEngine();
    if (!eng || !replay) return null;
    var st = null;
    if (idx === replay.baseIdx + 1 && replay.baseJson) { // 快路径：从上一步快照前进一格
      try {
        st = eng.deserializeState(replay.baseJson);
        var r = eng.applyAction(st, replay.actions[replay.baseIdx]);
        if (!r || !r.ok) st = null;
      } catch (e) { st = null; }
    }
    if (!st) { // 慢路径：同 seed 重建初始态后逐条重放
      try { st = eng.createGame(replay.cfg); } catch (e) { return null; }
      for (var i = 0; i < idx; i++) {
        try {
          var r2 = eng.applyAction(st, replay.actions[i]);
          if (!r2 || !r2.ok) return null;
        } catch (e) { return null; }
      }
    }
    try {
      replay.baseJson = eng.serializeState(st);
      replay.baseIdx = idx;
    } catch (e) { replay.baseJson = null; replay.baseIdx = -1; }
    return st;
  }

  function replayBarInfo() {
    if (!replay || !replay.state) return { active: false };
    var last = replay.idx > 0 ? journal[replay.idx - 1] : null;
    return {
      active: true,
      idx: replay.idx,
      total: replay.total,
      canBack: replay.idx > 0,
      canFwd: replay.idx < replay.total,
      canTakeover: replay.state.phase !== 'gameover' && replay.state.winner == null,
      sum: last ? last.sum : '开局局面'
    };
  }

  function renderReplay() {
    var ui = getUI();
    if (!ui || typeof ui.render !== 'function' || !replay || !replay.state) return;
    var actor = replayActorOf(replay.state);
    var last = replay.idx > 0 ? journal[replay.idx - 1] : null;
    var opts = {
      buildMode: null,
      selectable: { hexes: [], edges: [], vertices: [], players: [] }, // 只读：无可交互目标
      activePlayer: actor,
      canRoll: false,
      canEndTurn: false,
      playableDev: { knight: false, roadBuilding: false, yearOfPlenty: false, monopoly: false },
      undo: { canUndo: false, size: 0, online: true }, // online:true → UI 隐藏撤销按钮
      review: journal,
      hint: '🕰️ 时光机回放 · 第 ' + replay.idx + ' / ' + replay.total + ' 步 · ' +
        (last ? (last.sum || '') : '开局局面'),
      replay: { idx: replay.idx, total: replay.total }
    };
    try { ui.render(replay.state, opts, []); } catch (e) {
      if (typeof console !== 'undefined' && console.error) console.error('[App] 回放渲染失败：', e);
    }
    if (typeof ui.setReplayBar === 'function') {
      try { ui.setReplayBar(replayBarInfo()); } catch (e) { /* 忽略 */ }
    }
  }

  function replayGoto(idx) {
    if (!replay) return;
    var n = Math.max(0, Math.min(replay.total, typeof idx === 'number' ? Math.floor(idx) : 0));
    var st = replayStateAt(n);
    if (!st) { toast('回放失败：动作与开局种子不一致'); return; }
    replay.idx = n;
    replay.state = st;
    renderReplay();
  }

  function replayStep(dir) {
    if (!replay) return;
    if (dir === 'start') { replayGoto(0); return; }
    if (dir === 'end') { replayGoto(replay.total); return; }
    replayGoto(replay.idx + (dir === 'back' ? -1 : 1));
  }

  function replayExit() {
    if (!replay) return;
    var eng = getEngine();
    var st = null;
    if (savedRealState && eng && typeof eng.deserializeState === 'function') {
      try { st = eng.deserializeState(savedRealState); } catch (e) { st = null; }
    }
    replay = null;
    savedRealState = null;
    var ui = getUI();
    if (ui && typeof ui.setReplayBar === 'function') {
      try { ui.setReplayBar({ active: false }); } catch (e) { /* 忽略 */ }
    }
    if (!st || !st.players || !st.players.length) {
      toast('恢复局面失败：快照损坏');
      return;
    }
    clearTimer();
    state = st;
    buildMode = null;
    lastActorSeen = currentActor(); // 与撤销同款：同步行动者基线 + 退出建造模式
    aiActionKey = '';
    aiActionCount = 0;
    renderAndDrive([]); // 完整渲染（对局已结束，不会重新调度 AI）
    toast('已退出时光机，恢复到结束局面');
  }

  // 残局接管：从当前回放步生成新对局继续打（journal 截断到该步，后续动作续记）
  function replayTakeover() {
    if (!replay || !replay.state) return;
    if (replay.state.phase === 'gameover' || replay.state.winner != null) {
      toast('该步已分出胜负，请后退到更早的历史步');
      return;
    }
    var eng = getEngine();
    if (!eng || typeof eng.serializeState !== 'function' || typeof eng.deserializeState !== 'function') {
      toast('引擎未加载');
      return;
    }
    var snap = null;
    try { snap = eng.serializeState(replay.state); } catch (e) { snap = null; }
    var st = null;
    if (snap) {
      try { st = eng.deserializeState(snap); } catch (e) { st = null; }
    }
    if (!st || !st.players || !st.players.length) { toast('残局接管失败：局面快照损坏'); return; }
    var at = replay.idx;
    journal = journal.slice(0, at); // 新对局保留接管前的记录，之后继续追加
    replay = null;
    savedRealState = null;
    var ui = getUI();
    if (ui && typeof ui.setReplayBar === 'function') {
      try { ui.setReplayBar({ active: false }); } catch (e) { /* 忽略 */ }
    }
    clearTimer();
    state = st;
    buildMode = null;
    lastActorSeen = currentActor();
    aiActionKey = '';
    aiActionCount = 0;
    undoReset();
    rankAwardedThisGame = false; // 接管生成的新对局允许重新结算段位
    resetAIMemo(); // 接管 = 进入新对局：清 AI 跨局记忆（E-20261101-8 预防措施）
    renderAndDrive([]);
    toast('残局接管：从第 ' + at + ' 步继续（第 ' + st.turnCount + ' 回合）');
  }

  /* ==================== 动作入口（UI → App） ==================== */
  function handleAction(action) {
    if (!action || typeof action !== 'object') return;
    if (tryPseudoAction(action)) return; // 界面控制类“伪动作”
    if (replay) { toast('时光机回放中为只读：请先退出（Esc 或「✕ 退出」）'); return; } // v1.24 契约 D
    if (net.active) { netSendAction(action); return; } // 联机：动作交给服务器校验
    if (!getEngine()) { toast('引擎未加载'); return; }
    if (!state) { toast('请先开始新游戏或读取存档'); return; }
    if (state.phase === 'gameover') { toast('游戏已结束，可再来一局'); return; }
    var actor = currentActor();
    var p = actor >= 0 ? state.players[actor] : null;
    if (!p) return;
    if (p.isAI) {
      var pt = state.pendingTrade;
      toast(pt ? '等待 AI 应答交易…' : 'AI 回合中，请稍候…');
      return;
    }
    var res = applyAndDrive(action);
    if (!res.ok) toast('无法执行：' + res.error);
  }

  // 识别界面控制类伪动作（开局/存读档/建造模式/速度/静音等），返回 true 表示已消费
  function tryPseudoAction(a) {
    var t = a.type;
    switch (t) {
      case 'newGame': case 'startGame': case 'restart': case 'start': case 'createGame':
        // 允许配置挂在 a.config / a.settings / a.cfg，或直接混在动作对象上；
        // 缺省时用最近配置（“再来一局”），再缺省用默认配置
        startNewGame(a.config || a.settings || a.cfg || a);
        return true;
      case 'loadGame': case 'load':
        loadGame(a.slot || null);
        return true;
      case 'startTutorial':
        startTutorial();
        return true;
      case 'skipTutorial':
        endTutorial('已跳过教程');
        return true;
      case 'netPing': case 'onlinePing':
        netPing();
        return true;
      case 'netCreate': case 'onlineCreate':
        netCreate(a);
        return true;
      case 'netJoin': case 'onlineJoin':
        netJoin(a);
        return true;
      case 'netStart': case 'onlineStart':
        netStart();
        return true;
      case 'netLeave': case 'onlineLeave':
        netLeave();
        return true;
      case 'saveGame': case 'save':
        saveGame();
        return true;
      case 'backToMenu': case 'menu': case 'quitToMenu': case 'abortGame':
        backToMenu(!!a.discard);
        return true;
      case 'buildMode': case 'setBuildMode': case 'mode':
        setBuildMode(a.mode != null ? a.mode : (a.value != null ? a.value : null));
        return true;
      case 'cancelBuild': case 'cancel': case 'cancelMode':
        setBuildMode(null);
        return true;
      case 'setSpeed': case 'speed':
        setSpeed(a.value || a.speed || a.speedLabel);
        return true;
      case 'setMuted':
        muted = !!a.value; persistSettings(); return true;
      case 'toggleMute':
        muted = !muted; persistSettings(); return true;
      case 'setFx':
        fxOn = !!a.value; persistSettings();
        try { var uFx = getUI(); if (uFx && typeof uFx.setFx === 'function') uFx.setFx(fxOn); } catch (e) { /* 忽略 */ }
        return true;
      case 'undo': case 'undoAction': // v1.20 契约 A/D：撤销按钮与键盘 Z 的 app 侧入口
        undo();
        return true;
      case 'replayStart': case 'replayOpen': // v1.24 契约 D：时光机入口（胜利画面按钮）
        replayStart();
        return true;
      case 'replayStep': case 'replayGoto': // 逐步前进/后退/跳转（dir: back|fwd|start|end）
        if (a.to != null) replayGoto(a.to);
        else replayStep(a.dir);
        return true;
      case 'replayTakeover': // 残局接管：从当前历史步生成新对局
        replayTakeover();
        return true;
      case 'replayExit': // 退出时光机并恢复结束局面（Esc 同此入口）
        replayExit();
        return true;
      case 'toggleFx':
        fxOn = !fxOn; persistSettings();
        try { var uFx2 = getUI(); if (uFx2 && typeof uFx2.setFx === 'function') uFx2.setFx(fxOn); } catch (e) { /* 忽略 */ }
        return true;
    }
    // 不带 id 的建造按钮点击 → 切换/取消建造模式（再点同一类即取消）
    if (t === 'buildRoad' && a.edgeId == null) {
      setBuildMode(buildMode === 'road' ? null : 'road'); return true;
    }
    if (t === 'buildSettlement' && a.vertexId == null) {
      setBuildMode(buildMode === 'settlement' ? null : 'settlement'); return true;
    }
    if (t === 'buildCity' && a.vertexId == null) {
      setBuildMode(buildMode === 'city' ? null : 'city'); return true;
    }
    return false;
  }

  function setBuildMode(mode) {
    if (mode !== 'road' && mode !== 'settlement' && mode !== 'city') mode = null;
    if (!state || state.phase === 'gameover') { buildMode = null; return; }
    var actor = currentActor();
    var p = actor >= 0 ? state.players[actor] : null;
    if (p && p.isAI) return; // AI 回合不允许进入建造模式
    buildMode = mode;
    renderNow([]); // 仅刷新高亮，不推进流程
  }

  function setSpeed(v) {
    var key = SPEED_ALIAS[v] || v;
    if (!SPEED_DELAY[key]) return;
    speed = key;
    persistSettings();
    var ui = getUI();
    if (ui && typeof ui.setSpeed === 'function') {
      try { ui.setSpeed(key); } catch (e) { /* 忽略 */ }
    }
    toast('AI 速度：' + (key === 'slow' ? '慢' : key === 'fast' ? '快' : '中'));
  }

  /* ==================== 开局 / 存档 / 菜单 ==================== */
  function normalizeConfig(cfg) {
    if (!cfg || typeof cfg !== 'object' || !cfg.players || !cfg.players.length) return null;
    var list = [];
    for (var i = 0; i < cfg.players.length && i < 4; i++) {
      var p = cfg.players[i] || {};
      list.push({
        name: (p.name == null || p.name === '') ? ('玩家' + (i + 1)) : String(p.name).slice(0, 12),
        color: COLORS.indexOf(p.color) >= 0 ? p.color : COLORS[i % 4],
        isAI: !!p.isAI,
        difficulty: DIFFICULTIES.indexOf(p.difficulty) >= 0 ? p.difficulty : 'normal'
      });
    }
    if (list.length < 2 || list.length > 4) return null;
    var hr = (cfg && cfg.houseRules) || {};
    var out = {
      players: list,
      targetVP: Math.max(3, Math.min(99, parseInt(cfg.targetVP, 10) || 10)),
      randomBoard: !!cfg.randomBoard,
      // v1.24 房规开关（契约 A 由引擎侧消费；缺省双 false）
      houseRules: { balancedDice: !!hr.balancedDice, friendlyRobber: !!hr.friendlyRobber }
    };
    if (typeof cfg.seed === 'number') out.seed = cfg.seed;
    return out;
  }

  function defaultConfig() {
    return {
      players: [
        { name: '玩家1', color: 'red', isAI: false, difficulty: 'normal' },
        { name: 'AI·蓝', color: 'blue', isAI: true, difficulty: 'normal' },
        { name: 'AI·橙', color: 'orange', isAI: true, difficulty: 'normal' },
        { name: 'AI·白', color: 'white', isAI: true, difficulty: 'normal' }
      ],
      targetVP: 10,
      randomBoard: true,
      houseRules: { balancedDice: false, friendlyRobber: false }
    };
  }

  function startNewGame(cfg) {
    var eng = getEngine();
    if (!eng || typeof eng.createGame !== 'function') { toast('引擎未加载'); return; }
    var config = normalizeConfig(cfg) || normalizeConfig(lastConfig) || normalizeConfig(defaultConfig());
    // v1.24 契约 D：开局必落种子（引擎未给时本地生成），时光机「同 seed 重建初始态」
    // 依赖它；随机性来源不变（引擎仍以 config.seed 驱动 mulberry32）
    if (typeof config.seed !== 'number') {
      config.seed = (Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF)) >>> 0;
    }
    replayAbort(); // 若处于时光机中，先退出（菜单/读档/再来一局都是合法出口）
    clearTimer();
    try { state = eng.createGame(config); }
    catch (e) {
      state = null;
      toast('创建游戏失败：' + (e && e.message ? e.message : e));
      return;
    }
    buildMode = null;
    lastActorSeen = -2;
    aiActionKey = '';
    aiActionCount = 0;
    undoReset(); // 新对局：撤回栈清空（跨局不残留旧局面快照）
    try { gameCfg = JSON.parse(JSON.stringify(config)); } catch (e) { gameCfg = null; }
    gameSeed = config.seed;
    journalReset(); // 新对局：过程记录清空
    lastConfig = config;
    resetAIMemo(); // 新对局：清掉 AI 的跨局记忆（如主动报价哨兵）
    rankAwardedThisGame = false; // 新对局允许结算一次段位
    if (tutorial && !tutorial.keepOnNewGame) { tutorial = null; }
    persistSettings();
    renderAndDrive([]); // 首次渲染 + 自动存档 + 驱动（若首位是 AI 则开始调度）
  }

  function makeSave() {
    var eng = getEngine();
    var names = [];
    for (var i = 0; i < state.players.length; i++) {
      var p = state.players[i];
      names.push(p.name + (p.isAI ? '(AI)' : ''));
    }
    return JSON.stringify({
      app: 'catan-island',
      v: 1,
      savedAt: Date.now(),
      savedAtText: formatNow(),
      turnCount: state.turnCount,
      phase: state.phase,
      targetVP: state.config ? state.config.targetVP : 10,
      players: names,
      // v1.24 契约 B/D：外层新增 seed（时光机重放锚点）与 journal（对局过程记录）。
      // undefined 字段会被 JSON.stringify 丢弃：旧版读档忽略未知字段，双向向后兼容。
      seed: (typeof gameSeed === 'number') ? gameSeed : undefined,
      journal: journal.length ? journal : undefined,
      state: eng.serializeState(state)
    });
  }

  // 每步动作后自动存档（覆盖“每回合至少一次”，序列化往返可无损续局）
  function autosave() {
    if (!state) return;
    var eng = getEngine();
    if (!eng || typeof eng.serializeState !== 'function') return;
    try { writeStorage(LS_KEYS.auto, makeSave()); } catch (e) { /* 存储异常忽略 */ }
  }

  function saveGame() {
    if (!state) { toast('当前没有进行中的对局'); return; }
    var eng = getEngine();
    if (!eng || typeof eng.serializeState !== 'function') { toast('引擎不支持存档'); return; }
    var ok = writeStorage(LS_KEYS.manual, makeSave());
    toast(ok ? '已保存（手动存档）' : '存档失败：浏览器存储不可用');
  }

  function readSaveRaw(slot) {
    if (slot === 'manual') return readStorage(LS_KEYS.manual);
    if (slot === 'auto') return readStorage(LS_KEYS.auto);
    // 未指定槽位：取较新的一份
    var m = readStorage(LS_KEYS.manual);
    var a = readStorage(LS_KEYS.auto);
    if (!m) return a;
    if (!a) return m;
    try {
      return JSON.parse(m).savedAt >= JSON.parse(a).savedAt ? m : a;
    } catch (e) { return m; }
  }

  function loadGame(slot) {
    var eng = getEngine();
    if (!eng || typeof eng.deserializeState !== 'function') { toast('引擎未加载'); return; }
    var raw = readSaveRaw(slot);
    if (!raw) { toast('没有找到存档'); return; }
    var st = null;
    var wrap = null;
    try {
      wrap = JSON.parse(raw);
      st = eng.deserializeState(wrap.state);
    } catch (e) { toast('读档失败：存档已损坏'); return; }
    if (!st || !st.players || !st.players.length) { toast('读档失败：存档数据不完整'); return; }
    replayAbort(); // 若处于时光机中，先退出（读档是合法出口）
    clearTimer();
    state = st;
    buildMode = null;
    lastActorSeen = -2;
    aiActionKey = '';
    aiActionCount = 0;
    undoReset(); // 读档：撤回栈清空（快照与读入局面不再同源，一律作废）
    resetAIMemo(); // 读档：清掉 AI 的跨局记忆（如主动报价哨兵），避免误抑制报价
    // v1.24 契约 B/D：恢复过程记录与开局种子（旧档缺字段 → journal=[]、seed=null，
    // 复盘统计降级为「无过程记录」，时光机提示不可用，均向后兼容）
    journal = sanitizeJournal(wrap ? wrap.journal : null);
    gameSeed = (wrap && typeof wrap.seed === 'number') ? wrap.seed : null;
    gameCfg = cfgFromState(st, true); // 带 seed（若有）：读档局打完后仍可进时光机
    try { // 依据读入的对局重建“再来一局”配置（不带 seed：新开一局换新地图）
      lastConfig = cfgFromState(st, false) || lastConfig;
      persistSettings();
    } catch (e) { /* 忽略 */ }
    renderAndDrive([]); // 渲染 + 存档 + 续跑（若当前行动者是 AI 则继续调度）
    toast('已读取存档（第 ' + st.turnCount + ' 回合）');
  }

  // 弃局回设置页：清调度与状态；自动存档保留（可在读档入口找回），
  // 开始新对局时会自动覆盖
  function backToMenu(discardSave) {
    netLeave(true); // 联机：离开房间并停止轮询
    clearTimer();
    replayAbort(); // 时光机随弃局退出（回放条一并隐藏）
    state = null;
    buildMode = null;
    lastActorSeen = -2;
    aiActionKey = '';
    aiActionCount = 0;
    undoReset(); // 弃局回菜单：撤回栈清空
    journalReset(); // 弃局：过程记录清空（自动存档若保留，其内嵌 journal 随档不丢）
    gameCfg = null;
    gameSeed = null;
    if (discardSave) removeStorage(LS_KEYS.auto);
    endTutorial(''); // 离开对局一律结束教程
    var ui = getUI();
    if (ui && typeof ui.setRank === 'function') { try { ui.setRank(rankInfo(rankData.points)); } catch (e) { /* 忽略 */ } }
  }

  /* ==================== localStorage 封装 ==================== */
  function readStorage(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function writeStorage(key, val) {
    try { window.localStorage.setItem(key, val); return true; } catch (e) { return false; }
  }
  function removeStorage(key) {
    try { window.localStorage.removeItem(key); } catch (e) { /* 忽略 */ }
  }

  function persistSettings() {
    writeStorage(LS_KEYS.settings, JSON.stringify({ speed: speed, muted: muted, fx: fxOn, lastConfig: lastConfig }));
  }
  function loadStoredSettings() {
    var raw = readStorage(LS_KEYS.settings);
    if (!raw) return;
    try {
      var s = JSON.parse(raw);
      if (s && SPEED_DELAY[s.speed]) speed = s.speed;
      if (s && typeof s.muted === 'boolean') muted = s.muted;
      if (s && typeof s.fx === 'boolean') fxOn = s.fx;
      if (s && s.lastConfig) lastConfig = s.lastConfig;
    } catch (e) { /* 忽略 */ }
  }

  /* ==================== 装配入口 ==================== */
  function failPage(root, text) {
    // 仅在 UI/引擎模块缺失或初始化失败时使用（正常路径 App 不碰 DOM）。
    // 静态错误页结构 + 样式：木纹桌面底 + 羊皮纸卡片，与全局美术主题一致；
    // 贴图之下垫纯色/渐变兜底，缺图不白屏。
    try {
      root.innerHTML = '';
      root.style.cssText =
        'background-color:#241708;' +
        'background-image:url("assets/img-6febf01ea1a1.webp");' +
        'background-size:cover;background-position:center;background-repeat:no-repeat;';
      var box = document.createElement('div');
      box.style.cssText = 'max-width:560px;margin:96px auto;padding:22px 30px;' +
        'border:2px solid #b99c62;border-radius:14px;' +
        'background-color:#f4ead0;' +
        'background-image:linear-gradient(165deg,rgba(255,252,240,.92),rgba(238,224,190,.95)),url("assets/img-f0503ecfe3a0.webp");' +
        'background-size:cover;background-position:center;background-repeat:no-repeat;' +
        'box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 5px rgba(255,250,235,.5);' +
        'color:#4a3010;font:14px/1.9 "Microsoft YaHei",sans-serif;';
      box.textContent = text + '（请检查 index.html 的引用顺序：css/style.css → js/engine.js → js/ai.js → js/ui.js → js/app.js）';
      root.appendChild(box);
    } catch (e) { /* 忽略 */ }
  }

  function init() {
    loadStoredSettings();
    if (typeof document === 'undefined') return;
    var root = document.getElementById('app');
    if (!root) {
      if (typeof console !== 'undefined' && console.error) console.error('[App] 找不到 #app 容器');
      return;
    }
    if (!getEngine()) { failPage(root, '引擎模块 js/engine.js 未加载，无法开始游戏。'); return; }
    var ui = getUI();
    if (!ui || typeof ui.init !== 'function') { failPage(root, '界面模块 js/ui.js 未加载，无法启动界面。'); return; }
    try {
      ui.init(root, {
        onAction: handleAction, // 唯一动作出口（含界面控制伪动作）
        onNewGame: function (cfg) { startNewGame(cfg); },
        onStart: function (cfg) { startNewGame(cfg); },
        onLoadGame: function (slot) { loadGame(slot || null); },
        onSaveGame: function () { saveGame(); },
        onBackToMenu: function (discard) { backToMenu(!!discard); },
        onSetSpeed: function (v) { setSpeed(v); },
        onToggleMute: function () { muted = !muted; persistSettings(); }
      });
    } catch (e) {
      failPage(root, '界面初始化失败：' + (e && e.message ? e.message : e));
      if (typeof console !== 'undefined' && console.error) console.error(e);
      return;
    }
    if (typeof ui.setSpeed === 'function') {
      try { ui.setSpeed(speed); } catch (e) { /* 忽略 */ }
    }
    // 静音偏好同样需要回放到 UI（喇叭图标与音效开关），否则重载页面后失效
    if (typeof ui.setMuted === 'function') {
      try { ui.setMuted(muted); } catch (e) { /* 忽略 */ }
    }
    // 动画开关偏好回放（顶栏「动画」按钮图标与飞行层启停）
    if (typeof ui.setFx === 'function') {
      try { ui.setFx(fxOn); } catch (e) { /* 忽略 */ }
    }
    // 用上次开局配置预填设置页（含「随机地图」开关），偏好跨对局保持
    if (lastConfig && typeof ui.applySetupConfig === 'function') {
      try { ui.applySetupConfig(lastConfig); } catch (e) { /* 忽略 */ }
    }
    // 段位徽章
    loadRank();
    if (typeof ui.setRank === 'function') {
      try { ui.setRank(rankInfo(rankData.points)); } catch (e) { /* 忽略 */ }
    }
    // 上次在联机房间里（刷新/断网）→ 自动回座
    tryResumeOnline();
  }

  /* ==================== 对外 API 与自启动 ==================== */
  var App = {
    init: init,
    newGame: startNewGame,
    startGame: startNewGame,
    loadGame: loadGame,
    saveGame: saveGame,
    backToMenu: backToMenu,
    setSpeed: setSpeed,
    getSpeed: function () { return speed; },
    isOnline: isOnline,
    toggleMute: function () { muted = !muted; persistSettings(); return muted; },
    toggleFx: function () {
      fxOn = !fxOn; persistSettings();
      var u = getUI();
      if (u && typeof u.setFx === 'function') { try { u.setFx(fxOn); } catch (e) { /* 忽略 */ } }
      return fxOn;
    },
    getState: function () { return state; },
    // v1.20 撤回（契约 A/D）：App.undo() 直接撤销；键盘 Z 也可走 onAction({type:'undo'})。
    // canUndo 为按钮启停权威（联机/无对局/已结束/栈空 → false）；undoSize 供展示步数
    undo: undo,
    canUndo: function () { return undoCan(); },
    undoSize: function () { return undoStack.length; },
    // v1.24 契约 B/D：过程记录只读访问与时光机状态（调试/测试用）
    getJournal: function () { return journal; },
    isReplaying: function () { return !!replay; }
  };
  if (typeof window !== 'undefined') window.App = App;

  // 脚本位于 body 末尾，DOM 就绪后装配
  if (typeof window !== 'undefined' && typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }
})();

</script>
</body>
</html>
