<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡坦岛</title>
  <style>
    /* 首屏加载层：写在最前面，4MB 单文件解析前就能看到 */
    #fboot{
      position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
      background:radial-gradient(ellipse at 50% 28%,#2b1d10 0%,#140d08 68%,#0b0705 100%);
      color:#f4e6c8;font-family:Georgia,"Songti SC","STSong",SimSun,serif;
      transition:opacity .45s ease,visibility .45s ease;
    }
    #fboot.is-done{opacity:0;visibility:hidden;pointer-events:none}
    #fboot .fboot-mark{
      width:78px;height:86px;display:grid;place-items:center;
      clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
      background:linear-gradient(155deg,#f0c875,#a66a28 70%,#744314);
      color:#1b1108;font-size:40px;line-height:1;
      box-shadow:0 0 0 1px rgba(255,220,150,.28);
      animation:fboot-pulse 1.8s ease-in-out infinite;
    }
    #fboot .fboot-title{font-size:22px;letter-spacing:.06em;color:#f7e8c8;margin-top:4px}
    #fboot .fboot-sub{font-size:13px;line-height:1.7;color:#bda77f;max-width:330px;margin:0}
    #fboot .fboot-track{width:220px;height:3px;background:rgba(244,230,200,.14);border-radius:999px;overflow:hidden;margin-top:4px}
    #fboot .fboot-track i{display:block;width:44%;height:100%;border-radius:999px;background:linear-gradient(90deg,#8f5a22,#f0c875,#8f5a22);animation:fboot-slide 1.2s ease-in-out infinite}
    #fboot .fboot-hint{font-size:12px;letter-spacing:.08em;color:#8f7a57;margin:2px 0 0}
    #fboot .fboot-cards{display:flex;gap:6px;margin-top:6px;opacity:.7}
    #fboot .fboot-cards span{width:10px;height:14px;border:1px solid #8f6a3a;border-radius:2px;transform:rotate(var(--r,0deg));background:rgba(240,200,117,.08)}
    @keyframes fboot-pulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.035)}}
    @keyframes fboot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
    @media(prefers-reduced-motion:reduce){#fboot .fboot-mark,#fboot .fboot-track i{animation:none}}
    @media(max-width:480px){#fboot .fboot-title{font-size:20px}#fboot .fboot-sub{font-size:12px;padding:0 12px}}
  </style>
  <style>
/* ======================================================================
   css/style.css —— 卡坦岛 全套样式
   主题：木纹桌面打底（assets/ui/table.jpg）+ 羊皮纸面板/弹窗/战报
        （assets/ui/parchment.jpg）+ 开局页全景 hero（assets/ui/hero.jpg）。
   兜底原则：所有贴图都叠在纯色/渐变之上，贴图缺失（file:// 路径异常、
   资产被移动）时自动露出下层配色，游戏永不因缺图白屏。
   ====================================================================== */

:root {
  /* 氛围资产（相对本文件定位，file:// 直接可用） */
  --img-table: url("assets/img-6febf01ea1a1.webp");
  --img-parchment: url("assets/img-f0503ecfe3a0.webp");
  --img-hero: url("assets/img-88d7be955122.webp");
  --parchment: #f6eed9;
  --parchment-2: #eee0bd;
  --parchment-3: #e5d3a8;
  --ink: #3f3222;
  --ink-soft: #6b5a3e;
  --line: #c9b488;
  --wood-1: #43301b;
  --wood-2: #2a1d0f;
  --gold: #ffd76a;
  --gold-deep: #dfa93c;
  --sea-deep: #0c2a42;
  --danger: #c8503a;
  --ok: #4f9e5f;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  color: #eef3f8;
  /* 全局木纹桌面：深胡桃纯色兜底在最底层，table.jpg 以 cover 铺满整页 */
  background-color: #241708;
  background-image: var(--img-table);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
#app {
  position: fixed; inset: 0;
  /* 木纹桌面的第二道底层：半透明界面之下始终可见（与 body 同图） */
  background-color: #241708;
  background-image: var(--img-table);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.hidden { display: none !important; }
button { font-family: inherit; }
i, em { font-style: normal; }

/* ==================== 通用按钮 / 输入 ==================== */
.btn {
  border: 1px solid #6b4a26;
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fdf3dc;
  cursor: pointer;
  background: linear-gradient(#a06a35, #7c4c22);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 235, 200, .35);
  transition: transform .12s, filter .12s, box-shadow .12s;
}
.btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 0 0 rgba(0,0,0,.3); }
.btn:disabled { filter: grayscale(.85) brightness(.72); cursor: not-allowed; }
.btn-primary { background: linear-gradient(#d99a35, #a5651f); border-color: #7a4c15; }
.btn-ghost {
  background: linear-gradient(#f4ead0, #e2d0a4);
  color: #6b4a26;
  border-color: #b99c62;
  box-shadow: 0 2px 0 rgba(120, 90, 40, .25), inset 0 1px 0 #fffdf2;
}
.btn-danger { background: linear-gradient(#d05a40, #97301f); border-color: #6e1f12; }
.btn-big { padding: 12px 34px; font-size: 17px; letter-spacing: 4px; }

.ipt {
  border: 1px solid #b99c62;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 14px;
  color: var(--ink);
  background: #fffdf4;
  outline: none;
  min-width: 0;
}
.ipt:focus { border-color: #d99a35; box-shadow: 0 0 0 2px rgba(217, 154, 53, .35); }
select.ipt { cursor: pointer; }

/* ==================== 开局设置页 ==================== */
.setup-page {
  position: absolute; inset: 0;
  overflow: auto;
  display: flex; align-items: center; justify-content: center;
  padding: 28px 16px;
  /* 开局页全景背景：hero.jpg 在中层，上层暗化渐变蒙版保证控件可读；
     hero 缺失时露出底层的海洋渐变（原配色兜底） */
  background:
    linear-gradient(180deg, rgba(8, 18, 30, .62) 0%, rgba(10, 22, 36, .30) 44%, rgba(5, 12, 22, .70) 100%),
    var(--img-hero) center 38% / cover no-repeat,
    radial-gradient(1100px 640px at 50% 12%, rgba(94, 178, 216, .38), transparent 62%),
    linear-gradient(#1c5377 0%, #0e3049 58%, #082133 100%);
}
.setup-page::before {
  content: "";
  position: fixed; inset: 0;
  /* 暗角蒙版：压暗四周、聚焦中央设置卡片（hero 之上再叠一层轻遮蔽） */
  background: radial-gradient(120% 92% at 50% 42%, transparent 52%, rgba(2, 8, 16, .45) 100%);
  pointer-events: none;
}
.setup-card {
  position: relative;
  width: min(700px, 96vw);
  /* 羊皮纸底纹：纸色薄纱压住纹理保证文字可读；纹理缺失时回退原纸色渐变 */
  background:
    linear-gradient(160deg, rgba(255, 252, 240, .88), rgba(238, 224, 190, .92)),
    var(--img-parchment) center / cover no-repeat,
    repeating-linear-gradient(45deg, rgba(160, 120, 60, .04) 0 14px, transparent 14px 28px);
  border: 2px solid #b99c62;
  border-radius: 20px;
  box-shadow: 0 24px 70px rgba(0, 10, 20, .6), inset 0 0 0 6px rgba(255, 250, 235, .5);
  padding: 26px 30px 22px;
  color: var(--ink);
}
.setup-deco {
  position: absolute; top: 14px; left: 20px; right: 20px; height: 6px;
  background: repeating-linear-gradient(90deg, #c9a86a 0 26px, transparent 26px 40px);
  opacity: .5; border-radius: 3px;
}
.setup-title {
  margin: 8px 0 0;
  text-align: center;
  font-family: "KaiTi", "STKaiti", "楷体", "SimSun", serif;
  font-size: 52px;
  letter-spacing: 14px;
  text-indent: 14px;
  color: #7c4a1d;
  text-shadow: 0 2px 0 #ffe9bd, 0 6px 14px rgba(90, 50, 10, .35);
}
.setup-sub {
  text-align: center;
  color: #96814f;
  font-size: 12.5px;
  letter-spacing: 5px;
  margin: 4px 0 18px;
}
.setup-row-line {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: rgba(255, 250, 232, .65);
  border: 1px solid #d8c69a;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.fl { font-size: 14px; font-weight: 700; color: #7a5c2e; letter-spacing: 2px; }
.seg { display: flex; border: 2px solid #b99c62; border-radius: 10px; overflow: hidden; }
.seg-btn {
  border: none; background: #f3e8cc; color: #7a5c2e;
  padding: 7px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
  border-right: 1px solid #d8c69a;
}
.seg-btn:last-child { border-right: none; }
.seg-btn.on { background: linear-gradient(#d99a35, #a5651f); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.ipt-num { width: 76px; text-align: center; font-weight: 700; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: #7a5c2e; cursor: pointer; }
.chk input { display: none; }
.chk i {
  width: 38px; height: 20px; border-radius: 999px;
  background: #cdbb90; position: relative; transition: background .18s;
  border: 1px solid #a98d54;
}
.chk i::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fffaf0; box-shadow: 0 1px 2px rgba(0,0,0,.3);
  transition: left .18s;
}
.chk input:checked + i { background: linear-gradient(#d99a35, #b0762a); }
.chk input:checked + i::after { left: 20px; }

/* v1.24 房规开关行（设置页；开关语义由引擎 createGame 消费） */
.setup-house { gap: 14px; }
.house-note { font-size: 11.5px; color: #a08a58; letter-spacing: 1px; margin-left: auto; }

.setup-players { display: flex; flex-direction: column; gap: 8px; }
.setup-row {
  display: grid;
  grid-template-columns: 30px 1.25fr .95fr .85fr .8fr;
  gap: 8px; align-items: center;
  background: rgba(255, 250, 232, .65);
  border: 1px solid #d8c69a;
  border-radius: 12px;
  padding: 8px 12px;
}
.setup-no {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(#8a5f22, #6b4517);
  color: #ffe9bd; font-weight: 800; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.setup-actions { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }
.setup-tip {
  margin-top: 14px; text-align: center;
  font-size: 12px; color: #a08a58; letter-spacing: 1px;
}

/* 段位徽章（设置页） */
.rank-badge {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 10px auto 2px; padding: 5px 14px; width: fit-content;
  border-radius: 999px; font-size: 13px; font-weight: 800;
  background: rgba(255, 250, 232, .78); border: 1px solid #d8c69a; color: #7a5c2e;
}
.rank-badge:empty { display: none; }
.rank-badge .rk-icon { font-size: 15px; line-height: 1; }
.rank-badge .rk-pts { color: #a2661c; }
.rank-badge .rk-bar { width: 70px; height: 6px; border-radius: 999px; background: #e4d6b2; overflow: hidden; }
.rank-badge .rk-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #d99a35, #b0762a); transition: width .4s; }
.rank-badge .rk-next { font-size: 11.5px; font-weight: 700; color: #9a855c; }
.rank-badge.r-silver { border-color: #b9c2cd; }
.rank-badge.r-gold { border-color: #d9b64a; box-shadow: 0 0 0 2px rgba(217, 182, 74, .18); }
.rank-badge.r-platinum { border-color: #8fb8c9; }
.rank-badge.r-legend { border-color: #c88a4a; box-shadow: 0 0 0 2px rgba(200, 138, 74, .22); }

/* 新手教程横幅（左下角固定） */
.tut-card {
  position: absolute; left: 18px; bottom: 104px; z-index: 40;
  width: 330px; max-width: calc(100vw - 36px);
  padding: 12px 14px 10px;
  background: linear-gradient(#fffaf0, #f6e9c8);
  border: 1px solid #d8c69a; border-radius: 14px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .34);
}
.tut-card.hidden { display: none; }
.tut-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.tut-step { font-size: 12px; font-weight: 900; letter-spacing: .6px; color: #a2661c; }
.tut-skip {
  border: 0; background: none; cursor: pointer; padding: 2px 4px;
  font-size: 11.5px; color: #9a855c; text-decoration: underline;
}
.tut-skip:hover { color: #6b4a17; }
.tut-text { font-size: 13px; line-height: 1.62; color: #4a3a1c; }
.tut-bar { margin-top: 9px; height: 5px; border-radius: 999px; background: #e4d6b2; overflow: hidden; }
.tut-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #3f8f5f, #2a6b46); transition: width .3s; }

/* 胜利画面段位结算行 */.v-rankline {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  margin-top: 12px; padding: 8px 12px; border-radius: 10px;
  background: rgba(244, 197, 66, .16); border: 1px dashed #c8a94e;
  font-size: 13px; color: #5a4618; font-weight: 700;
}
.v-rankline .vr-icon { font-size: 16px; }
.v-rankline .vr-up { font-style: normal; color: #b0472a; font-weight: 900; }
.v-rankline .vr-pts { margin-left: auto; color: #9a6b16; font-weight: 900; }

/* ==================== 游戏主界面框架 ==================== */
.game-ui {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  /* 半透明海雾色罩在全局木纹桌面上：木纹隐约可辨，色调不变；
     贴图缺失时露出 body/#app 的深胡桃兜底色 */
  background:
    radial-gradient(1200px 700px at 50% 30%, rgba(80, 160, 205, .16), transparent 65%),
    linear-gradient(rgba(23, 63, 92, .82), rgba(11, 36, 55, .84) 70%, rgba(7, 26, 41, .88));
}
.topbar {
  flex: none; height: 52px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  /* v1.20 契约 C：动态顶栏 —— 底色由 JS 按当前行动玩家写入（可过渡的 background-color），
     羊皮纸明暗用半透明渐变叠加保持层次；左边框 6px 取行动玩家主色。
     两者的 0.4s 过渡让「换人行动」时顶栏颜色平滑切换。 */
  background-color: #4a3520;
  background-image: linear-gradient(rgba(255, 235, 200, .10), rgba(0, 0, 0, .46));
  border-left: 6px solid rgba(255, 235, 200, .14);
  transition: background-color .4s ease, border-left-color .4s ease;
  border-bottom: 2px solid #17100a;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
  color: #f3e7c8;
  z-index: 5;
}
.tb-logo { display: flex; align-items: center; }
.tb-title {
  font-family: "KaiTi", "STKaiti", "楷体", serif;
  font-size: 21px; letter-spacing: 5px; font-weight: 700;
  color: #ffe3a6; text-shadow: 0 1px 0 #6b4517;
}
.tb-info { font-size: 13px; color: #d8c69a; letter-spacing: 1px; margin-left: 6px; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-lab { font-size: 12px; color: #b39a68; }
.tb-select {
  background: #3a2a16; color: #f3e7c8;
  border: 1px solid #6b4a26; border-radius: 7px;
  padding: 4px 6px; font-size: 13px; outline: none; cursor: pointer;
}
.tb-btn {
  background: linear-gradient(#6e4f2a, #533919);
  color: #f3e7c8; border: 1px solid #7a5a30; border-radius: 8px;
  padding: 5px 12px; font-size: 13px; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 235, 200, .2);
  display: inline-flex; align-items: center; gap: 5px;
}
.tb-btn:hover { filter: brightness(1.15); }
.tb-warn { border-color: #8a5030; }

.hintbar {
  flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px;
  background: rgba(6, 24, 40, .78);
  border-bottom: 1px solid rgba(255, 255, 255, .07);
  min-height: 36px;
  z-index: 4;
}
.phase-chip {
  flex: none;
  font-size: 12px; font-weight: 800; letter-spacing: 2px;
  padding: 3px 10px; border-radius: 999px;
  background: linear-gradient(#3f6d94, #2a4d6d);
  color: #dceafb; border: 1px solid rgba(255, 255, 255, .18);
}
.phase-chip.ph-robber, .phase-chip.ph-steal { background: linear-gradient(#a03c2e, #722218); }
.phase-chip.ph-discard { background: linear-gradient(#77758a, #4f4d63); }
.phase-chip.ph-setup1, .phase-chip.ph-setup2 { background: linear-gradient(#3f8f5f, #276442); }
.phase-chip.ph-gameover { background: linear-gradient(#c8962f, #94660f); }
.hint-text { font-size: 13.5px; color: #ffe9ad; letter-spacing: .5px; }
.map-chip {
  flex: none; margin-left: auto; font-size: 11.5px; font-weight: 800; letter-spacing: 1px;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(255, 255, 255, .10); color: #cfe3f5;
  border: 1px solid rgba(255, 255, 255, .20);
}
.map-chip.on { background: linear-gradient(#3f8f5f, #276442); color: #e8fff1; border-color: rgba(255, 255, 255, .28); }
.rb-badge {
  flex: none; font-size: 12px; font-weight: 800;
  padding: 3px 10px; border-radius: 999px;
  background: linear-gradient(#f4c542, #d1931f);
  color: #5c3a08; border: 1px solid #a87f1a;
  animation: freePulse 1.6s ease-in-out infinite;
}
@keyframes freePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

.game-main { flex: 1; display: flex; min-height: 0; }

/* ==================== 玩家面板列 ==================== */
/* 界面改版 v2：字号/行高适度加大（宽度随之 232 → 252） */
.players-col {
  flex: none; width: 252px;
  padding: 10px; display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto;
}
.panel-player {
  position: relative;
  /* 羊皮纸面板：纹理叠在原纸色渐变之下，缺失时自动回退原样 */
  background:
    linear-gradient(165deg, rgba(248, 240, 218, .86), rgba(234, 218, 178, .9)),
    var(--img-parchment) center / cover no-repeat,
    linear-gradient(165deg, #f8f0da, #ecdcb4);
  border: 1px solid #c7b183;
  border-radius: 12px;
  padding: 9px 11px 8px;
  color: var(--ink);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
  transition: box-shadow .2s, transform .2s;
}
.panel-player.active {
  border-color: var(--pc);
  box-shadow: 0 0 0 2px var(--pc), 0 6px 14px rgba(0, 0, 0, .4);
  transform: translateY(-1px);
}
.panel-player.active::after {
  content: "";
  position: absolute; top: -7px; left: 12px;
  width: 0; height: 0;
  border: 7px solid transparent; border-top-color: var(--pc);
}
.panel-player.steal-target {
  cursor: pointer;
  animation: stealBlink 1.1s ease-in-out infinite;
}
@keyframes stealBlink {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 90, .0); }
  50% { box-shadow: 0 0 0 3px var(--gold), 0 4px 12px rgba(0,0,0,.35); }
}
.pp-head { display: flex; align-items: center; gap: 7px; }
.pp-dot {
  flex: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--pc);
  border: 2px solid rgba(0, 0, 0, .28);
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, .5);
}
.pp-name { font-weight: 800; font-size: 16px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-tag {
  font-size: 11.5px; padding: 1px 8px; border-radius: 999px;
  background: #e3d3a8; color: #6b5a3e; border: 1px solid #c4ae7c; flex: none;
}
.pp-tag.ai { background: #2f2a4a; color: #cfd6ff; border-color: #4a4470; }

/* ==================== 棋盘区 ==================== */
/* 界面改版 v2：中央区域除左右面板外全部让给棋盘——内边距压缩到极限，
   viewBox 由 js/ui.js 的 layoutBoard 按容器尺寸 min 缩放并允许海框裁切 ≤5% */
.board-col { flex: 1; min-width: 0; display: flex; padding: 2px; }
.board-wrap { position: relative; flex: 1; margin: 0; min-height: 0; }
.board-svg { width: 100%; height: 100%; display: block; }
.fx-layer {
  position: absolute; inset: 0;
  pointer-events: none; overflow: hidden;
  z-index: 6;
}

/* SVG：数字筹码 / 港口 */
.chip-num { font-size: 25px; font-weight: 900; fill: #4a3a1d; font-family: Georgia, "Microsoft YaHei", serif; }
.chip-num.red { fill: #b03224; }
/* v1.21 契约 A：全部圆片字号随概率递减（6/8 最大 → 2/12 最小）。
   档位类按概率点 p = 6 − |7 − n|（即 x/36 的 x）取值 1~5：
   6/8 → p5（27px，最大）、5/9 → p4、4/10 → p3、3/11 → p2、2/12 → p1（17px，最小）；
   6/8 的红色加粗由 .chip-num.red + 基础 font-weight:900 保持 */
.chip-num.p5 { font-size: 27px; }
.chip-num.p4 { font-size: 24px; }
.chip-num.p3 { font-size: 21px; }
.chip-num.p2 { font-size: 19px; }
.chip-num.p1 { font-size: 17px; }
.chip-pip { fill: #6b5a3e; }
.chip-pip.red { fill: #b03224; }
.chip-g { pointer-events: none; }
/* v1.21 契约 A：圆片悬停命中区（父组 pointer-events:none，命中圆单独放行）
   与 tooltip「数字 n · 概率 x/36」（单例浮层，坐标由 js 换算） */
.chip-hit { pointer-events: all; cursor: help; }
.chip-tip {
  position: absolute; transform: translate(-50%, -100%);
  z-index: 9; pointer-events: none;
  font-size: 12.5px; font-weight: 700; color: #4a3a1d; white-space: nowrap;
  background: linear-gradient(#fdf6e2, #ecdcb4);
  border: 1px solid #a98f52; border-radius: 8px;
  padding: 4px 10px; box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
  opacity: 0; transition: opacity .12s ease-out;
}
.chip-tip.show { opacity: 1; }
.port-route {
  stroke: #eaf6ff; stroke-width: 4.5; stroke-dasharray: 9 8;
  stroke-linecap: round; opacity: .8;
}
.port-rate { font-size: 17px; font-weight: 900; fill: #5a4a2a; }
.port-rate.any { font-size: 20px; }
.port-any { font-size: 11px; fill: #8a744c; letter-spacing: 2px; }
.port-badge { pointer-events: none; }

/* SVG：道路 / 建筑（界面改版 v2：棋子为 Q 版矢量粗描边形态） */
.road-under, .road-top, .road-hl { pointer-events: none; }
.road-g { pointer-events: none; }
.bldg { pointer-events: none; }
.ghost-g { pointer-events: none; }

/* SVG：高亮（呼吸加强版；悬停时该高亮圈放大 10% 基线继续呼吸） */
.hl-vert {
  fill: rgba(255, 200, 40, .60);
  stroke: #fff; stroke-width: 3.5;
  cursor: pointer;
  animation: breathe 1.4s ease-in-out infinite;
  transform-box: fill-box; transform-origin: center;
  filter: drop-shadow(0 1px 2px rgba(60, 30, 0, .6));
}
.hl-vert.hl-city { fill: rgba(110, 200, 255, .62); stroke: #e8f7ff; }
.hl-vert.hov { animation-name: breatheHov; }
.hl-edge {
  stroke: rgba(255, 178, 26, .92);
  stroke-width: 14; stroke-linecap: round;
  cursor: pointer;
  animation: breatheEdge 1.4s ease-in-out infinite;
  filter: drop-shadow(0 1px 2px rgba(60, 30, 0, .65));
}
.hl-edge.hov { animation-name: breatheEdgeHov; }
.hl-hex {
  fill: rgba(255, 96, 64, .28);
  stroke: #ffb3a0; stroke-width: 3.5;
  cursor: pointer;
  animation: pulseHex 1.2s ease-in-out infinite;
  transform-box: fill-box; transform-origin: center;
}
.hl-hex.hov { animation: pulseHexHov 1s ease-in-out infinite; }
.hl-hit { cursor: pointer; }
@keyframes breathe {
  0%, 100% { transform: scale(.84); opacity: .55; }
  50% { transform: scale(1.26); opacity: 1; }
}
@keyframes breatheHov {
  0%, 100% { transform: scale(.92); opacity: .7; }
  50% { transform: scale(1.39); opacity: 1; } /* 悬停峰值 = 基础峰值 1.26 × 1.10（放大 10%） */
}
@keyframes breatheEdge {
  0%, 100% { opacity: .5; stroke-width: 12; }
  50% { opacity: 1; stroke-width: 20; }
}
@keyframes breatheEdgeHov {
  0%, 100% { opacity: .75; stroke-width: 15; }
  50% { opacity: 1; stroke-width: 23; }
}
@keyframes pulseHex {
  0%, 100% { fill-opacity: .9; }
  50% { fill-opacity: .3; }
}
@keyframes pulseHexHov {
  0%, 100% { fill-opacity: .95; transform: scale(1.03); }
  50% { fill-opacity: .42; transform: scale(1.08); }
}

/* SVG：产出高亮 / 建筑 POP / 道路 POP */
.prod-hex { fill: rgba(255, 214, 84, .26); stroke: rgba(255, 235, 150, .8); stroke-width: 3; pointer-events: none; }
/* v1.22 契约 B：掷骰后产出格「强脉冲」——亮金爆闪 + 回弹缩放，850ms ≤900ms 红线 */
.prod-pulse { animation: prodPulse .85s ease-out 1; transform-box: fill-box; transform-origin: center; }
@keyframes prodPulse {
  0%   { fill: rgba(255, 246, 190, .92); stroke: #fff3c4; stroke-width: 11; transform: scale(.94); }
  25%  { fill: rgba(255, 228, 120, .60); stroke-width: 6; transform: scale(1.05); }
  60%  { transform: scale(1.015); }
  100% { fill: rgba(255, 214, 84, .26); stroke: rgba(255, 235, 150, .8); stroke-width: 3; transform: scale(1); }
}
.pop { animation: popIn .5s cubic-bezier(.2, 1.7, .4, 1); transform-box: fill-box; transform-origin: center; }
.pop-line { animation: popLine .5s ease-out 1; }
@keyframes popIn {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
@keyframes popLine {
  0% { opacity: 0; stroke-width: 24; }
  100% { opacity: 1; stroke-width: 13; }
}

/* 飘字（棋盘 / 面板） */
.float-tip {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 14px; font-weight: 900;
  color: #fff; white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .65), 0 0 8px rgba(0, 0, 0, .4);
  animation: floatUp 1.6s ease-out forwards;
  z-index: 7;
}
.float-tip.f-gain { color: #b9f0a2; }
.float-tip.f-build { color: #ffe3a6; font-size: 15px; }
.float-tip.f-steal { color: #e2b7ff; }
.float-tip.f-lose { color: #ff9d8a; }
.float-tip.f-badge { color: var(--gold); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
  18% { opacity: 1; transform: translate(-50%, -60%) scale(1.06); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}
.panel-float {
  position: absolute; right: 10px; top: 4px;
  font-size: 12.5px; font-weight: 900; color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
  animation: pfUp 1.5s ease-out forwards;
  pointer-events: none; z-index: 8;
}
.panel-float.f-gain { color: #2e7d32; }
.panel-float.f-badge { color: #a5720a; }
.panel-float.f-steal { color: #7a4a9e; }
.panel-float.f-lose { color: #b03224; }
@keyframes pfUp {
  0% { opacity: 0; transform: translateY(6px); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-26px); }
}

/* ==================== 资源转移动画层（界面改版契约 v2 第 9 条） ====================
   统一动画层：fixed 全屏覆盖、不拦截点击；.fly-chip 为飞行图标（WAAPI 驱动，
   JS 侧有 CSS transition 兜底），单次 ≤500ms，可通过顶栏「动画」按钮关闭。 */
#uiFlyRoot {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 70;
  overflow: hidden;
}
.fly-chip {
  position: absolute; left: 0; top: 0;
  width: 26px; height: 26px;
  margin: -13px 0 0 -13px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255, 252, 240, .93);
  border: 2px solid rgba(90, 60, 20, .55);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
  will-change: transform, opacity;
}
.fly-chip.f-gold {
  border-color: #d1931f;
  box-shadow: 0 0 0 2px rgba(255, 215, 106, .6), 0 3px 8px rgba(0, 0, 0, .4);
}
.fly-chip.f-card { border-radius: 5px; }
/* 面板反馈：资源到达时数字跳动 / 被偷时红色闪烁 */
.panel-player.bump { animation: panelBump .45s ease-out; }
@keyframes panelBump {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-4px) scale(1.045); }
  100% { transform: translateY(0) scale(1); }
}
.panel-player.flash-lose { animation: flashLose .5s ease-out; }
@keyframes flashLose {
  0%, 100% { border-color: #c7b183; }
  40% { border-color: #c8503a; box-shadow: 0 0 0 4px rgba(200, 80, 58, .8), 0 4px 14px rgba(0, 0, 0, .4); }
}
/* v1.22 契约 B：手牌区 +N 徽章——产出图标飞抵手牌区时跳动（bounce 450ms 单次 ≤900ms） */
.hand-gain-badge {
  position: absolute; top: -3px; right: 10px;
  z-index: 9; pointer-events: none;
  min-width: 30px; padding: 2px 9px;
  border-radius: 999px;
  font-size: 15px; font-weight: 900; color: #fff;
  text-align: center; line-height: 1.35;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
  background: linear-gradient(180deg, #ffd76a, #d99a1d);
  border: 1.5px solid #8a5f22;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .45), 0 0 10px rgba(255, 215, 106, .55);
  opacity: 0;
  transform: translateY(4px) scale(.6);
  transition: opacity .28s ease, transform .28s ease;
}
.hand-gain-badge.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  transition: opacity .14s ease-out, transform .14s ease-out;
}
.hand-gain-badge.bouncing { animation: handBadgeBounce .45s cubic-bezier(.3, 1.9, .4, 1) 1; }
@keyframes handBadgeBounce {
  0%   { transform: translateY(4px) scale(.55); }
  45%  { transform: translateY(-7px) scale(1.22); }
  75%  { transform: translateY(1px) scale(.96); }
  100% { transform: translateY(0) scale(1); }
}

/* ==================== 战报日志（羊皮纸战报） ==================== */
.log-col {
  flex: none; width: 284px;
  display: flex; flex-direction: column;
  /* 羊皮纸底纹：纸色薄纱压住纹理，纹理缺失回退纸色纯色 */
  background:
    linear-gradient(180deg, rgba(246, 238, 217, .93), rgba(232, 217, 179, .96)),
    var(--img-parchment) center / cover no-repeat #e8d9b2;
  border-left: 2px solid #6e4f2a;
  box-shadow: -5px 0 14px rgba(0, 0, 0, .28);
}
.log-head {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  font-size: 14.5px; font-weight: 800; letter-spacing: 4px;
  color: #6b4517;
  border-bottom: 1px dashed #b99c62;
}
.log-clear {
  background: none; border: 1px solid #a98d54; border-radius: 6px;
  color: #7a5c2e; font-size: 11px; padding: 2px 8px; cursor: pointer; letter-spacing: 1px;
}
.log-clear:hover { color: #4a3010; border-color: #7a5c2e; background: rgba(255, 250, 232, .6); }
.log-list {
  flex: 1; overflow-y: auto;
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 6px;
}
.log-list::-webkit-scrollbar { width: 8px; }
.log-list::-webkit-scrollbar-thumb { background: rgba(122, 92, 46, .35); border-radius: 4px; }
.log-list::-webkit-scrollbar-track { background: rgba(122, 92, 46, .1); }
.log-item {
  font-size: 13.5px; line-height: 1.65;
  color: #4a3a22;
  background: rgba(255, 252, 240, .55);
  border-left: 3px solid #a08a58;
  border-radius: 6px;
  padding: 6px 10px;
  animation: logIn .25s ease-out;
}
@keyframes logIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; } }
.log-item b { color: #2e2314; }
.log-item i { color: #8a744c; font-size: 12px; }
.log-item .gg { color: #2e7d32; }
/* 分类色条：按羊皮纸底色加深，保证米色背景上可辨 */
.lg-roll { border-left-color: #3f7fd0; }
.lg-gain { border-left-color: #3f9e4f; }
.lg-build { border-left-color: #c0722a; }
.lg-robber { border-left-color: #c8503a; }
.lg-steal { border-left-color: #8a4ac0; }
.lg-discard { border-left-color: #7a8694; }
.lg-badge { border-left-color: #b8860b; }
.lg-dev { border-left-color: #2a9d94; }
.lg-vp { border-left-color: #b8860b; }
.lg-over { border-left-color: #b8860b; font-size: 14px; background: rgba(255, 215, 106, .32); }
.lg-log { border-left-color: #a08a58; }

/* v1.20 契约 B：战报玩家名棋子色圆点前缀 */
.pn-dot {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 50%;
  margin: 0 4px 0 1px;
  vertical-align: 1px;
  border: 1px solid rgba(30, 18, 6, .55);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5), 0 1px 1px rgba(0, 0, 0, .25);
}
/* v1.20 契约 B：战报资源徽章（带底色圆角，🌲木 ⛰️矿 🐑羊 🌾麦 🧱砖 ×N） */
.res-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 8px;
  margin: 1px 3px 1px 0;
  border-radius: 999px;
  border: 1px solid rgba(30, 18, 6, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 1px 2px rgba(0, 0, 0, .18);
  font-size: 12px; font-weight: 800; line-height: 1.55;
  white-space: nowrap;
  vertical-align: 1px;
}
.res-badge .rb-emo { font-size: 12px; line-height: 1; }
.res-badge .rb-n { font-weight: 900; font-size: 12px; color: inherit; }
.res-badge.rb-wood  { background: linear-gradient(#d3ecc4, #a8d698); color: #1e4a1c; border-color: #5d9a4e; }
.res-badge.rb-brick { background: linear-gradient(#f8cbb4, #e9a180); color: #6e2c12; border-color: #c06a3e; }
.res-badge.rb-sheep { background: linear-gradient(#fbfdf1, #e4efc6); color: #5c7331; border-color: #9cb36a; }
.res-badge.rb-wheat { background: linear-gradient(#fbeebc, #f0d488); color: #7a5a14; border-color: #cf9f3a; }

.lg-gain .gg-wrap { display: inline; }
/* 可定位战报条目：悬停高亮 + 光标提示（棋盘同步叠加脉冲光圈） */
.log-item.lg-loc { cursor: crosshair; }
.log-item.lg-loc:hover {
  background: rgba(255, 244, 214, .92);
  box-shadow: 0 0 0 1.5px rgba(184, 134, 11, .55), 0 2px 6px rgba(0, 0, 0, .18);
}

/* v1.20 契约 B：战报悬停定位脉冲层（独立于建造高亮，青金色光圈 + 指示点） */
.loghl-vert, .loghl-edge, .loghl-hex, .loghl-dot { pointer-events: none; }
.loghl-vert {
  fill: rgba(64, 196, 220, .16);
  stroke: #46d8f0; stroke-width: 4;
  animation: logPulseRing 1.1s ease-in-out infinite;
  transform-box: fill-box; transform-origin: center;
  filter: drop-shadow(0 0 5px rgba(70, 216, 240, .85));
}
.loghl-dot {
  fill: rgba(70, 216, 240, .92);
  stroke: #fff; stroke-width: 2;
  animation: logPulseDot 1.1s ease-in-out infinite;
  transform-box: fill-box; transform-origin: center;
}
.loghl-edge {
  stroke: rgba(70, 216, 240, .92);
  stroke-width: 16; stroke-linecap: round;
  animation: logPulseEdge 1.1s ease-in-out infinite;
  filter: drop-shadow(0 0 5px rgba(70, 216, 240, .85));
}
.loghl-edge.loghl-thin { stroke-width: 11; }
.loghl-hex {
  fill: rgba(70, 216, 240, .18);
  stroke: #46d8f0; stroke-width: 4;
  animation: logPulseHex 1.1s ease-in-out infinite;
  transform-box: fill-box; transform-origin: center;
  filter: drop-shadow(0 0 6px rgba(70, 216, 240, .8));
}
@keyframes logPulseRing {
  0%, 100% { transform: scale(.88); opacity: .55; }
  50% { transform: scale(1.22); opacity: 1; }
}
@keyframes logPulseDot {
  0%, 100% { transform: scale(.8); opacity: .65; }
  50% { transform: scale(1.25); opacity: 1; }
}
@keyframes logPulseEdge {
  0%, 100% { opacity: .5; stroke-width: 13; }
  50% { opacity: 1; stroke-width: 21; }
}
@keyframes logPulseHex {
  0%, 100% { fill-opacity: .55; stroke-width: 3.5; }
  50% { fill-opacity: 1; stroke-width: 6; }
}

/* 界面改版 v2：右下悬浮操作簇（掷骰子 / 结束回合，高度 ≥64px，随状态启停） */

@keyframes clusterReady {

/* 快捷键帮助条（底部操作区） */

.dice-area {

/* 界面改版 v2：骰子面板放大到 ≥72px，点数大字清晰 */
/* v1.22 契约 A：dice-box 加 perspective，供 .die 的 rotate3d 3D 翻滚使用 */
.dice-box { display: flex; gap: 12px; perspective: 460px; }
.die {
  width: 74px; height: 74px;
  border-radius: 14px;
  background: linear-gradient(#ffffff, #e6e6ee);
  border: 1px solid #b9b9c6;
  box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .12), 0 3px 6px rgba(0, 0, 0, .4);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 10px;
  gap: 3px;
  will-change: transform;
}
.pip { width: 11px; height: 11px; border-radius: 50%; background: #2b2b33; place-self: center; box-shadow: inset 0 1px 1px rgba(255,255,255,.4); }
/* v1.22 契约 A：3D 翻滚 680ms（与 JS 侧 8×85ms 换面同步），多轴 rotate3d + 小位移颠簸 */
.die.rolling { animation: dieTumble3D .68s linear 1; }
@keyframes dieTumble3D {
  0%   { transform: translate(0, 0) rotate3d(1, 1, .3, 0deg) scale(1); }
  14%  { transform: translate(4px, -7px) rotate3d(1, 1, .3, 150deg) scale(1.05); }
  28%  { transform: translate(-5px, 3px) rotate3d(.4, 1, .6, 310deg) scale(.97); }
  42%  { transform: translate(5px, -4px) rotate3d(1, .35, .3, 470deg) scale(1.06); }
  56%  { transform: translate(-4px, 5px) rotate3d(.6, 1, .2, 640deg) scale(.96); }
  70%  { transform: translate(3px, -3px) rotate3d(1, 1, 0, 800deg) scale(1.04); }
  85%  { transform: translate(-2px, 2px) rotate3d(.8, .8, .2, 950deg) scale(.99); }
  100% { transform: translate(0, 0) rotate3d(1, 1, .3, 1080deg) scale(1); }
}
/* v1.22 契约 A：弹跳落定 200ms（squash & stretch），翻滚 + 落定全程 880ms ≤900ms 红线 */
.die.settle { animation: settleBounce .2s cubic-bezier(.2, 1.9, .4, 1) 1; }
@keyframes settleBounce {
  0%   { transform: translateY(-12px) scale(1.14, .86); }
  55%  { transform: translateY(0) scale(.93, 1.09); }
  78%  { transform: translateY(-4px) scale(1.05, .96); }
  100% { transform: translateY(0) scale(1, 1); }
}
.dice-sum { font-size: 15px; font-weight: 800; color: #ffe3a6; letter-spacing: 2px; }

/* ==================== 弹窗体系 ==================== */

  display: flex; flex-direction: column; gap: 6px;
  background: rgba(255, 250, 232, .6);
  border: 1px solid #d8c69a; border-radius: 12px;
  padding: 10px 12px;
}
.v-row {
  display: grid;
  grid-template-columns: 44px 1fr 66px 66px 66px;
  align-items: center; gap: 4px;
  font-size: 14px; font-weight: 700;
  padding: 5px 8px;
  border-radius: 8px;
}
.v-row.v-head { font-size: 11.5px; color: #96814f; letter-spacing: 2px; border-bottom: 1px dashed #c9b488; border-radius: 0; padding-bottom: 7px; }
.v-row.winner { background: linear-gradient(90deg, rgba(255, 215, 106, .4), rgba(255, 215, 106, .08)); }
.v-no { font-weight: 900; color: #8a6f3c; }
.v-name { display: flex; align-items: center; gap: 7px; text-align: left; overflow: hidden; }
.v-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, .25); flex: none; }
.v-total { font-size: 17px; font-weight: 900; color: #7c4a1d; }
.v-foot { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.v-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px; }
.v-confetti i {
  position: absolute; top: -16px;
  width: 9px; height: 14px;
  border-radius: 2px;
  opacity: .85;
  animation: confFall linear infinite;
}
@keyframes confFall {
  0% { transform: translateY(-20px) rotate(0); }
  100% { transform: translateY(560px) rotate(660deg); }
}
.v-back { position: fixed; top: 18px; right: 18px; z-index: 56; }

/* ==================== v1.24 契约 C：胜利画面 · 复盘统计 ==================== */
.v-review {
  margin-top: 14px;
  text-align: left;
  background: rgba(255, 250, 232, .6);
  border: 1px solid #d8c69a;
  border-radius: 12px;
  overflow: hidden;
}
.v-rev-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 9px 12px;
  background: rgba(217, 154, 53, .14);
  border-bottom: 1px dashed #c9b488;
}
.v-rev-title { font-size: 15px; font-weight: 900; color: #7c4a1d; letter-spacing: 2px; }
.v-rev-sub { font-size: 11.5px; color: #96814f; letter-spacing: 1px; }
.v-rev-body { max-height: 46vh; overflow-y: auto; padding: 8px 12px 10px; }
.rv-block { padding: 6px 0 10px; }
.rv-block + .rv-block { border-top: 1px dashed #d8c69a; }
.rv-title { font-size: 12.5px; font-weight: 800; color: #7a5c2e; letter-spacing: 1px; margin-bottom: 6px; }
.rv-empty { font-size: 12px; color: #a08a58; padding: 10px 2px; text-align: center; letter-spacing: 1px; }
/* ① VP 折线 */
.rv-chart { display: block; width: 100%; height: auto; }
.rv-grid { stroke: rgba(160, 138, 88, .28); stroke-width: 1; }
.rv-axis { stroke: #a98d54; stroke-width: 1.2; }
.rv-target { stroke: #c8862a; stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .85; }
.rv-target-t { fill: #b0762a; font-weight: 800; }
.rv-tick { fill: #96814f; font-size: 9.5px; font-family: inherit; }
.rv-line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.rv-dot { stroke: rgba(255, 252, 240, .9); stroke-width: 1; }
.rv-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
.rv-lg-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #6b5a3e; }
.rv-lg-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(0, 0, 0, .25); flex: none; }
/* ② 资源漏斗 */
.rv-funnel { display: flex; flex-direction: column; gap: 2px; }
.rv-fun {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr .9fr;
  align-items: center; gap: 4px;
  font-size: 12.5px; font-weight: 700; color: #4a3a20;
  padding: 3px 6px; border-radius: 7px;
}
.rv-fun:nth-child(even) { background: rgba(255, 250, 232, .55); }
.rv-fun-head {
  font-size: 11px; color: #96814f; letter-spacing: 1px;
  border-bottom: 1px dashed #c9b488; border-radius: 0; padding-bottom: 5px;
}
.rv-fun-head:nth-child(even) { background: none; }
.rv-fun-name { display: flex; align-items: center; gap: 6px; overflow: hidden; }
.rv-fun-n { text-align: right; font-variant-numeric: tabular-nums; }
.rv-fun-n.zero { color: #b0a074; }
.rv-fun-hand { text-align: right; color: #7c4a1d; font-weight: 900; font-variant-numeric: tabular-nums; }
/* ③ 骰子直方图 */
.rv-dice {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 3px;
  padding: 4px 2px 0;
}
.rv-dcol { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; }
.rv-dcnt { font-size: 10px; font-weight: 800; color: #6b5a3e; min-height: 12px; line-height: 12px; }
.rv-dbar {
  display: block; width: 100%; max-width: 26px; border-radius: 4px 4px 2px 2px;
  background: linear-gradient(#e8c877, #b98b3a);
  border: 1px solid #8a5f22; border-bottom: none;
  min-height: 2px;
}
.rv-dcol.hot .rv-dbar { background: linear-gradient(#e88a6a, #b04a2c); border-color: #7c2a18; }
.rv-dnum { font-size: 11px; font-weight: 800; color: #7a5c2e; }
.rv-dcap { font-size: 11px; color: #96814f; letter-spacing: 1px; margin-top: 6px; text-align: center; }

/* ==================== v1.24 契约 D：时光机回放条 ==================== */
.replay-bar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 70;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(16, 24, 34, .93);
  border: 1px solid rgba(255, 215, 106, .4);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
  animation: toastIn .25s cubic-bezier(.2, 1.4, .4, 1);
  max-width: min(94vw, 860px);
}
.rp-title { font-size: 13.5px; font-weight: 900; color: var(--gold); letter-spacing: 2px; white-space: nowrap; }
.rp-btn {
  border: 1px solid rgba(255, 215, 106, .35);
  background: rgba(255, 250, 232, .08);
  color: #f3e8cc; font-size: 13px; font-weight: 700;
  border-radius: 999px; padding: 6px 12px;
  cursor: pointer; white-space: nowrap;
  transition: background .15s, transform .12s;
}
.rp-btn:hover:not(:disabled) { background: rgba(255, 215, 106, .22); }
.rp-btn:active:not(:disabled) { transform: scale(.95); }
.rp-btn:disabled { opacity: .38; cursor: default; }
.rp-take { border-color: rgba(126, 217, 138, .5); color: #b9e8c0; }
.rp-exit { border-color: rgba(232, 138, 106, .5); color: #f0c2ae; }
.rp-pos { display: flex; flex-direction: column; align-items: center; min-width: 120px; line-height: 1.25; }
.rp-pos b { font-size: 13px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-pos i {
  font-size: 10.5px; color: #cdbd97; max-width: 240px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rp-sep { width: 1px; height: 22px; background: rgba(255, 215, 106, .25); }
@media (max-width: 760px) {
  .replay-bar { gap: 5px; padding: 6px 10px; bottom: 10px; }
  .rp-title { display: none; }
  .rp-pos { min-width: 86px; }
  .rp-pos i { max-width: 130px; }
  .rp-btn { padding: 5px 9px; font-size: 12px; }
}

/* ==================== Toast ==================== */
#uiToastRoot {
  position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
  z-index: 80;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  background: rgba(16, 24, 34, .94);
  border: 1px solid rgba(255, 215, 106, .35);
  color: #fff;
  font-size: 14px; letter-spacing: 1px;
  padding: 9px 20px;
  border-radius: 999px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  animation: toastIn .22s cubic-bezier(.2, 1.4, .4, 1);
  max-width: 78vw;
}
.toast.out { animation: toastOut .3s ease-in forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(.92); } to { opacity: 1; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

/* ==================== 响应式 ==================== */
@media (max-width: 1280px) {
  .players-col { width: 224px; }
  .log-col { width: 240px; }
  .dev-card { max-width: 84px; }
}
@media (max-width: 1040px) {

  .players-col { width: 196px; padding: 6px; }

  /* 快捷键契约：骰子任何断点都保持 ≥72px */
  .dice-area { width: 178px; padding: 6px; }
  .die { width: 72px; height: 72px; padding: 9px; gap: 2px; }
  .pip { width: 10px; height: 10px; }
  .keys-help { gap: 3px 8px; font-size: 10.5px; }
  .cluster-btn { min-width: 168px; min-height: 64px; }
  .cl-lab { font-size: 17px; }
  .action-cluster { right: 10px; bottom: 10px; gap: 8px; }
  .ab-btn { min-width: 74px; }
}
@media (max-height: 760px) {
  .actionbar { min-height: 126px; }
  .topbar { height: 46px; }
  .setup-title { font-size: 42px; }
}

/* ==================== 联机大厅（全屏页面） ==================== */
.lobby-page {
  position: absolute; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  background:
    linear-gradient(rgba(8, 20, 34, .62), rgba(6, 16, 28, .82)),
    var(--img-hero, none) center / cover no-repeat,
    linear-gradient(160deg, #123049, #081624);
  padding: 18px;
}
.lobby-page.hidden { display: none; }
.lobby-wrap {
  width: 100%; max-width: 460px;
  display: flex; flex-direction: column; gap: 12px;
}
.lobby-head {
  display: flex; align-items: center; gap: 10px;
}
.lobby-back {
  flex: none; cursor: pointer;
  padding: 7px 12px; border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, .28);
  background: rgba(255, 255, 255, .12);
  color: #e8f1fb; font-size: 13px; font-weight: 800;
  transition: background .15s, transform .15s;
}
.lobby-back:hover { background: rgba(255, 255, 255, .22); transform: translateX(-1px); }
.lobby-title {
  flex: 1; text-align: center;
  font-size: 17px; font-weight: 900; letter-spacing: 3px;
  color: #ffe9ad; text-shadow: 0 2px 6px rgba(0, 0, 0, .5);
}
.lobby-head-pad { flex: none; width: 66px; }

.lobby-main { display: flex; justify-content: center; }
.lobby-card {
  width: 100%; padding: 18px 20px 20px;
  background: linear-gradient(#fffaf0, #f6e9c8);
  border: 1px solid #d8c69a; border-radius: 16px;
  box-shadow: 0 18px 46px rgba(0, 0, 0, .45);
  display: flex; flex-direction: column; gap: 10px;
}

/* 页签 */
.lobby-tabs { display: flex; gap: 8px; }
.lobby-tab {
  flex: 1; padding: 8px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid #d8c69a; background: rgba(255, 255, 255, .55);
  font-size: 13.5px; font-weight: 800; color: #7a5c2e;
  transition: background .15s, color .15s;
}
.lobby-tab.on { background: linear-gradient(#d99a35, #b0762a); color: #fff8e6; border-color: #a87f1a; }

/* 表单 */
.lobby-field { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #7a5c2e; }
.lobby-field > span { flex: none; width: 66px; }
.lobby-field .ipt { flex: 1; }
.lobby-field .ipt-code {
  letter-spacing: 8px; text-align: center; font-size: 20px; font-weight: 900;
  text-transform: uppercase;
}
.lobby-chk { align-self: center; }
.lobby-hint { text-align: center; font-size: 12px; color: #9a855c; line-height: 1.5; }
.lobby-err {
  margin-top: 2px; padding: 8px 10px; border-radius: 10px;
  background: rgba(200, 80, 58, .10); border: 1px solid rgba(200, 80, 58, .45);
  font-size: 12.5px; font-weight: 700; color: #a32d1c; line-height: 1.5;
}

/* 房间视图 */
.lobby-codebox {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 10px 10px; border-radius: 12px;
  background: rgba(255, 255, 255, .62); border: 1px dashed #c8a94e;
}
.lobby-codelab { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: #9a855c; }
.lobby-code {
  font-size: 40px; font-weight: 900; letter-spacing: 12px; line-height: 1.05;
  color: #a2661c; text-indent: 12px; text-shadow: 0 2px 0 rgba(255, 255, 255, .7);
}
.lobby-copy { margin-top: 4px; font-size: 12.5px; padding: 5px 12px; }

.lobby-seats { display: flex; flex-direction: column; gap: 6px; }
.lobby-seat {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px; border-radius: 10px;
  background: rgba(255, 255, 255, .62); border: 1px solid #e0cfa4;
  font-size: 13.5px; font-weight: 700; color: #5a4618;
}
.lobby-seat.empty { color: #b3a077; font-weight: 600; border-style: dashed; }
.lobby-seat .ls-color {
  flex: none; width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid #8a5f22;
}
.lobby-seat .ls-no {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: #cbb98f; color: #fff8e6; font-size: 11.5px; font-weight: 900;
}
.lobby-seat .ls-name { flex: 1; }
.lobby-seat .ls-crown { font-size: 13px; }
.lobby-seat .ls-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #c07a6a; }
.lobby-seat .ls-dot.on { background: #3f8f5f; box-shadow: 0 0 0 3px rgba(63, 143, 95, .18); }
.lobby-seat.off { opacity: .62; }

.lobby-tip { text-align: center; font-size: 12px; color: #9a855c; }
.lobby-leave { align-self: center; font-size: 12.5px; padding: 6px 16px; }
.lobby-card .btn-big { width: 100%; }

/* 预检失败 / 检测中 */
.lobby-checking { text-align: center; color: #7a5c2e; font-size: 14px; font-weight: 800; padding: 30px 20px; }
.lobby-fail { text-align: center; gap: 8px; }
.lobby-fail .lf-icon { font-size: 34px; line-height: 1; }
.lobby-fail .lf-title { font-size: 16px; font-weight: 900; color: #a32d1c; }
.lobby-fail .lf-text { font-size: 12.5px; color: #6b5430; line-height: 1.6; }
.lobby-fail .lf-text.dim { color: #9a855c; }
.lobby-fail .lf-cmd {
  font-family: Consolas, Menlo, monospace; font-size: 13px; font-weight: 700;
  padding: 9px 10px; border-radius: 9px;
  background: #2a2013; color: #ffe9ad; letter-spacing: .4px;
  user-select: all;
}
.lobby-fail .lf-actions { display: flex; gap: 10px; margin-top: 4px; }
.lobby-fail .lf-actions .btn { flex: 1; }


/* 顶栏联机状态徽标 */
.net-chip {
  flex: none; font-size: 11.5px; font-weight: 800; letter-spacing: .5px;
  padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
}
.net-chip.hidden { display: none; }
.net-chip.ok { background: linear-gradient(#3f8f5f, #276442); color: #e8fff1; }
.net-chip.off { background: linear-gradient(#a03c2e, #722218); color: #ffe9e3; animation: freePulse 1.4s ease-in-out infinite; }

/* ==================== 玩家面板自适应压缩 ====================
   4 名玩家在矮窗口下会超出面板列，逐级压缩保证全部可见 */

.players-col.compact .pp-name { font-size: 14px; }
.players-col.compact .pp-score { font-size: 18px; }
.players-col.compact .pp-stats { margin-top: 3px; }
.players-col.compact .pp-stat { font-size: 11px; padding: 1px 6px; }
.players-col.compact .pp-tag { font-size: 10.5px; padding: 1px 6px; }

.players-col.ultra { gap: 5px; padding: 6px; }
.players-col.ultra .panel-player { padding: 4px 8px; }
.players-col.ultra .pp-name { font-size: 13px; }
.players-col.ultra .pp-score { font-size: 16px; }
.players-col.ultra .pp-tag { display: none; }
.players-col.ultra .pp-badges { display: none; }
.players-col.ultra .pp-live { font-size: 10px; padding: 1px 5px; }
.players-col.ultra .pp-stats { margin-top: 1px; }
.players-col.ultra .pp-stat { font-size: 10.5px; padding: 0 5px; }

  body { overflow: hidden; }

  .setup-form, .setup-players, .setup-row { min-width: 0; }
  .setup-title { font-size: 34px; letter-spacing: 8px; text-indent: 8px; margin-top: 4px; }
  .setup-sub { font-size: 10px; letter-spacing: 2px; margin-bottom: 10px; }
  .rank-badge { margin: 4px auto 2px; font-size: 11px; padding: 4px 10px; }
  .setup-row-line { gap: 7px; padding: 8px 9px; margin-bottom: 8px; }
  .setup-row-line .fl { font-size: 12px; letter-spacing: 1px; }
  .seg-btn { padding: 6px 9px; font-size: 12px; }
  .ipt { font-size: 13px; padding: 6px 7px; }
  .ipt-num { width: 58px; }
  .chk { font-size: 12px; }

  .tb-right { margin-left: auto; gap: 3px; }
  .tb-lab { display: none; }
  .tb-select { font-size: 11px; padding: 3px 4px; max-width: 48px; }
  .tb-btn { padding: 4px 7px; font-size: 11px; border-radius: 6px; }
  #uiSaveBtn, #uiLoadBtn2 { display: none; }
  /* v1.20：窄屏顶栏空间有限，快捷键入口收进「菜单」旁仍保留（触屏无键盘，隐藏更干净） */

  .hintbar { padding: 5px 8px; gap: 5px; min-height: 30px; flex-wrap: wrap; }
  .phase-chip { font-size: 10px; padding: 2px 7px; }
  .hint-text { font-size: 12px; line-height: 1.45; order: 3; flex: 1 0 100%; }
  .map-chip { font-size: 10px; padding: 2px 7px; margin-left: auto; }

  .game-main { flex-direction: column; min-height: 0; }
  .players-col {

    border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.25);
  }
  .panel-player.active::after { display: none; }
  .pp-head { gap: 4px; }
  .pp-dot { width: 10px; height: 10px; border-width: 1px; }
  .pp-name { font-size: 12px; max-width: 68px; }
  .pp-tag { font-size: 9px; padding: 0 4px; }
  .pp-badges { display: none; }

/* ==================== v1.22 契约 C：强盗落点尘土涟漪 ====================

<body>
  <div id="fboot" role="status" aria-live="polite">
    <div class="fboot-mark" aria-hidden="true">⬢</div>
    <div class="fboot-title">正在铺设卡坦岛</div>
    <p class="fboot-sub">首次打开要载入约 4MB 的美术与规则，稍等几秒。</p>
    <div class="fboot-track" aria-hidden="true"><i></i></div>
    <div class="fboot-cards" aria-hidden="true"><span style="--r:-14deg"></span><span style="--r:-4deg"></span><span style="--r:7deg"></span><span style="--r:16deg"></span></div>
    <p class="fboot-hint">AI 对手正在洗牌…</p>
  </div>
  <div id="app"></div>
  <script>
    (function () {
      var boot = document.getElementById('fboot');
      if (!boot) return;
      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        boot.classList.add('is-done');
        setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 500);
      }
      if (document.readyState === 'complete') {
        setTimeout(hide, 350);
      } else {
        window.addEventListener('load', function () { setTimeout(hide, 350); }, { once: true });
      }
      setTimeout(hide, 15000);
    })();
  </script>
  <script>
/* ============================================================================
 * js/engine-core.js —— 卡坦岛引擎核心（CatanCore）
 * ----------------------------------------------------------------------------
 * 职责（引擎拆分契约 v2，导出成员名逐字固定，共 15 个）：
 *   createRng / generateBoard / createGame / serializeState / deserializeState
 *   BUILD_COSTS / canAfford / payCost / addRes / resTotal / cleanRes
 *   legalSettlementVertices / legalCityVertices / legalRoadEdges / portRatesFor
 *
 * 坐标约定（pointy-top axial，UI 只做坐标→像素换算，不做图结构推导）：
 *   - hex 中心为整数 (q, r)，像素 x = √3·(q + r/2)·S，y = 1.5·r·S；
 *   - 顶点即六边形角点，(q, r) 为 1/3 的整数倍；边为两顶点中点，为 1/6 的整数倍；
 *     顶点/边与 hex 使用同一公式换算像素（ui.js 的 hexToPixel 直接适用）。
 *
 * 地图与初始状态（严格按 SPEC【状态模型】【规则硬性要求】）：
 *   - 19 陆地格（林4/麦4/羊4/砖3/山3/沙1）+ 外圈 18 海格；hex id = 数组下标；
 *   - 数字筹码 18 枚（2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12）按螺旋序放置，
 *     沙漠无筹码；随机布局时 6 与 8 不相邻（贪心交换 + 重摇保证）；
 *   - 9 港口（任意 3:1 ×4 + 木/砖/羊/麦/矿 2:1 各 1），接在外圈海格与陆地共享
 *     的边上，各连两个海岸顶点，沿岛均匀分布、互不共点；
 *   - createGame：蛇形 setupQueue（去程 0→n-1，回程由 actions 层反转）、
 *     state.awards 双 null、robber = 沙漠格、devDeck 25 张内部 RNG 洗牌、
 *     state.rngState 持久化（createRng(state.rngState) 可无缝续走随机序列）；
 *   - 房规开关（v1.24 契约 A）：config.houseRules = { balancedDice,
 *     friendlyRobber }（缺省双 false，行为语义见 engine-actions.js 头注）；
 *     serializeState 原样输出、deserializeState 对缺字段的旧档补默认值；
 *     state.diceHistory 记录每次掷骰点数（两骰之和，无论房规开否都记录，
 *     供平衡骰选组与赛后复盘直方图共用）。
 *
 * 规则注记（合法点位口径，engine-actions 层完全委托本模块判定）：
 *   - SPEC 硬性要求「强盗所在格不生产、不能建路」：所有阶段（含初始布置）的
 *     legalRoadEdges 一律排除强盗所在格的全部边，随强盗移动而变化；
 *   - 初始布置建村后必须立刻从该村修 1 条免费路，因此 setup 阶段的合法村点
 *     额外要求该村至少留有一条「未被强盗禁建且空闲」的边（强盗禁边一并排除，
 *     保证建村后必有路可修，不会死局）；
 *     主阶段建村仍按标准规则：只需与己方道路相邻。
 * ========================================================================== */

const CatanCore = (function () {
  'use strict';

  /* ================================ 常量 ================================ */

  const RES_KEYS = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
  const PLAYER_COLORS = ['red', 'blue', 'orange', 'white'];

  // 数字筹码标准集合（经典 A~R 螺旋放置顺序）
  const NUMBER_TOKENS = [5, 2, 6, 3, 8, 10, 9, 12, 11, 4, 8, 10, 9, 4, 5, 6, 3, 11];

  // 固定布局地形（按陆地螺旋序 0..18；已验证 6/8 不相邻）
  const FIXED_TERRAINS = [
    'fields',                                                        // 0 中心
    'pasture', 'hills', 'forest', 'fields', 'forest', 'mountains',   // 1~6 内圈
    'forest', 'hills', 'pasture', 'desert', 'fields', 'pasture',     // 7~12 外圈
    'mountains', 'fields', 'forest', 'pasture', 'hills', 'mountains' // 13~18 外圈
  ];

  // 9 港口计划：任意 3:1 ×4 + 五种资源 2:1 各 1（沿岛交替分布）
  const PORT_PLAN = [
    { rate: 3, resource: null }, { rate: 2, resource: 'wood' },
    { rate: 3, resource: null }, { rate: 2, resource: 'brick' },
    { rate: 2, resource: 'sheep' }, { rate: 3, resource: null },
    { rate: 2, resource: 'wheat' }, { rate: 3, resource: null },
    { rate: 2, resource: 'ore' }
  ];

  // 轴向六方向：E SE SW W NW NE（pointy-top）
  const HEX_DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
  // 六个角点相对 hex 中心的 axial 偏移（单位 1/3）：上/右上/右下/下/左下/左上（顺时针）
  const CORNER_OFFSETS = [[1, -2], [2, -1], [1, 1], [-1, 2], [-2, 1], [-1, -1]];

  // 建造费用（路/村/城/发展卡）
  const BUILD_COSTS = {
    road: { wood: 1, brick: 1 },
    settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
    city: { wheat: 2, ore: 3 },
    devCard: { sheep: 1, wheat: 1, ore: 1 }
  };

  /* ========================= 随机数（mulberry32） ========================= */

  // mulberry32：内部状态为单个 uint32，可序列化。
  // createRng(x).getState() 取出的状态传回 createRng(x) 可无缝续走同一随机序列，
  // 引擎各层据此实现 state.rngState 的「恢复 → 使用 → 写回」模式。
  function createRng(seed) {
    let a = (typeof seed === 'number' && isFinite(seed)) ? (seed >>> 0) : 0;
    return {
      next: function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      getState: function () { return a >>> 0; },
      setState: function (n) {
        a = (typeof n === 'number' && isFinite(n)) ? (n >>> 0) : 0;
      }
    };
  }

  // Fisher-Yates 洗牌（消耗 rng）
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // 未提供 seed 时的默认种子（仅用于选取种子，游戏内随机一律走 mulberry32）
  let seedCounter = 0;
  function defaultSeed() {
    seedCounter = (seedCounter + 1) >>> 0;
    return (Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF) ^ Math.imul(seedCounter, 0x9E3779B1)) >>> 0;
  }

  /* ============================== 几何工具 ============================== */

  // 以原点为中心、半径 radius 的环（从正北偏移开始顺时针）；radius=0 返回中心
  function ringCoords(radius) {
    if (radius === 0) return [[0, 0]];
    const out = [];
    let q = 0, r = -radius;
    for (let side = 0; side < 6; side++) {
      for (let step = 0; step < radius; step++) {
        out.push([q, r]);
        q += HEX_DIRS[side][0];
        r += HEX_DIRS[side][1];
      }
    }
    return out;
  }

  // 陆地 19 格：中心 + 半径1 + 半径2（螺旋序，即 id 0..18）；海洋 18 格：半径3 环（id 19..36）
  const LAND_COORDS = ringCoords(0).concat(ringCoords(1), ringCoords(2));
  const SEA_COORDS = ringCoords(3);

  function axialDistance(aq, ar, bq, br) {
    return (Math.abs(aq - bq) + Math.abs(ar - br) + Math.abs(aq + ar - bq - br)) / 2;
  }

  /* ============================== 棋盘生成 ============================== */

  function isRedToken(t) { return t === 6 || t === 8; }

  // landIdx 位置是否与已放置红筹码（6/8）相邻
  function hasAdjacentRedNumber(numbers, landIdx) {
    const c = LAND_COORDS[landIdx];
    for (let i = 0; i < LAND_COORDS.length; i++) {
      if (i === landIdx) continue;
      const n = numbers[i];
      if (n === null || n === undefined || !isRedToken(n)) continue;
      if (axialDistance(c[0], c[1], LAND_COORDS[i][0], LAND_COORDS[i][1]) === 1) return true;
    }
    return false;
  }

  // 按螺旋序把 18 枚筹码放到非沙漠格（沙漠无筹码）。
  // 随机布局：洗牌筹码队列，遇到 6/8 且相邻已有红筹码时与后续首个非红筹码交换，
  // 保证 6 与 8 不相邻，同时保持「螺旋 + 合理」的放置形态。
  function placeNumbers(terrains, randomBoard, rng) {
    const numbers = new Array(LAND_COORDS.length).fill(null);
    const order = [];
    for (let i = 0; i < terrains.length; i++) {
      if (terrains[i] !== 'desert') order.push(i);
    }
    const queue = NUMBER_TOKENS.slice();
    if (randomBoard) shuffle(queue, rng);
    for (let k = 0; k < order.length; k++) {
      const landIdx = order[k];
      let pick = queue.shift();
      if (randomBoard && isRedToken(pick) && hasAdjacentRedNumber(numbers, landIdx)) {
        let swapAt = -1;
        for (let m = 0; m < queue.length; m++) {
          if (!isRedToken(queue[m])) { swapAt = m; break; }
        }
        if (swapAt >= 0) {
          const tmp = queue[swapAt];
          queue[swapAt] = pick;
          pick = tmp;
        }
      }
      numbers[landIdx] = pick;
    }
    return numbers;
  }

  // 校验：恰 1 个沙漠且无筹码、其余格都有筹码、6/8 互不相邻
  function numbersValid(terrains, numbers) {
    let deserts = 0;
    for (let i = 0; i < terrains.length; i++) {
      if (terrains[i] === 'desert') {
        deserts++;
        if (numbers[i] !== null) return false;
      } else if (numbers[i] === null || numbers[i] === undefined) {
        return false;
      }
    }
    if (deserts !== 1) return false;
    for (let i = 0; i < numbers.length; i++) {
      if (isRedToken(numbers[i]) && hasAdjacentRedNumber(numbers, i)) return false;
    }
    return true;
  }

  function buildTerrainPool() {
    return [
      'forest', 'forest', 'forest', 'forest',
      'fields', 'fields', 'fields', 'fields',
      'pasture', 'pasture', 'pasture', 'pasture',
      'hills', 'hills', 'hills',
      'mountains', 'mountains', 'mountains',
      'desert'
    ];
  }

  // 生成完整棋盘：{ hexes, vertices, edges, ports, robber }
  // hexes：陆地 0..18（螺旋序）+ 海洋 19..36；vertices/edges 的 id 与数组下标一致。
  function generateBoard(opts, rng) {
    const randomBoard = !!(opts && opts.randomBoard);
    const r = (rng && typeof rng.next === 'function') ? rng : createRng(defaultSeed());
    let terrains = null;
    let numbers = null;

    if (!randomBoard) {
      terrains = FIXED_TERRAINS.slice();
      numbers = placeNumbers(terrains, false, r);
    } else {
      const pool = buildTerrainPool();
      // 随机布局：重摇直到满足 6/8 不相邻（贪心交换后几乎首轮即成功，此处仅作保险）
      for (let attempt = 0; attempt < 300; attempt++) {
        const t = shuffle(pool.slice(), r);
        const n = placeNumbers(t, true, r);
        terrains = t;
        numbers = n;
        if (numbersValid(t, n)) break;
      }
      // 防御性兜底：300 次重摇全部失败（概率极低）时不得静默采用非法布局，
      // 回退到经过验证的固定布局（6/8 不相邻由构造保证）
      if (!numbersValid(terrains, numbers)) {
        terrains = FIXED_TERRAINS.slice();
        numbers = placeNumbers(terrains, false, r);
      }
    }

    const hexes = [];
    LAND_COORDS.forEach(function (c, i) {
      hexes.push({
        id: i,
        q: c[0],
        r: c[1],
        terrain: terrains[i],
        number: terrains[i] === 'desert' ? null : numbers[i]
      });
    });
    SEA_COORDS.forEach(function (c, i) {
      hexes.push({ id: LAND_COORDS.length + i, q: c[0], r: c[1], terrain: 'sea', number: null });
    });

    // ---- 顶点 / 边：由陆地六边形角点/边去重得到（角点坐标为 1/3 的整数倍）----
    const vertices = [];
    const edges = [];
    const vertexMap = new Map(); // 'q3,r3'（×3 整数键）→ vertex
    const edgeMap = new Map();   // '小顶点id-大顶点id' → edge

    for (let hi = 0; hi < LAND_COORDS.length; hi++) {
      const hex = hexes[hi];
      const vids = [];
      for (let k = 0; k < 6; k++) {
        const q3 = hex.q * 3 + CORNER_OFFSETS[k][0];
        const r3 = hex.r * 3 + CORNER_OFFSETS[k][1];
        const key = q3 + ',' + r3;
        let v = vertexMap.get(key);
        if (!v) {
          v = { id: vertices.length, q: q3 / 3, r: r3 / 3, hexes: [], edges: [], adjacent: [], building: null };
          vertexMap.set(key, v);
          vertices.push(v);
        }
        if (v.hexes.indexOf(hex.id) < 0) v.hexes.push(hex.id);
        vids.push(v.id);
      }
      for (let k = 0; k < 6; k++) {
        const a = vids[k];
        const b = vids[(k + 1) % 6];
        const lo = Math.min(a, b);
        const hi2 = Math.max(a, b);
        const key = lo + '-' + hi2;
        if (!edgeMap.has(key)) {
          const va = vertices[lo];
          const vb = vertices[hi2];
          const e = {
            id: edges.length,
            q: (va.q + vb.q) / 2, // 边中点 = 两顶点中点（1/6 网格）
            r: (va.r + vb.r) / 2,
            vertices: [lo, hi2],
            road: null
          };
          edgeMap.set(key, e);
          edges.push(e);
        }
      }
    }
    // 第二遍：回填顶点的 edges / adjacent（按边 id 升序，天然有序）
    for (const e of edges) {
      vertices[e.vertices[0]].edges.push(e.id);
      vertices[e.vertices[1]].edges.push(e.id);
      vertices[e.vertices[0]].adjacent.push(e.vertices[1]);
      vertices[e.vertices[1]].adjacent.push(e.vertices[0]);
    }

    // ---- 港口：沿外圈海收集「临陆槽位」（海格与陆地共享的边），沿岛均匀取 9 处 ----
    const slots = [];
    for (let si = 0; si < SEA_COORDS.length; si++) {
      const hex = hexes[LAND_COORDS.length + si];
      const vids = [];
      for (let k = 0; k < 6; k++) {
        const v = vertexMap.get((hex.q * 3 + CORNER_OFFSETS[k][0]) + ',' + (hex.r * 3 + CORNER_OFFSETS[k][1]));
        vids.push(v ? v.id : -1); // 纯海角点不是顶点
      }
      for (let k = 0; k < 6; k++) {
        const a = vids[k];
        const b = vids[(k + 1) % 6];
        if (a < 0 || b < 0) continue;
        const e = edgeMap.get(Math.min(a, b) + '-' + Math.max(a, b));
        if (e) slots.push([e.vertices[0], e.vertices[1]]);
      }
    }
    const ports = [];
    for (let i = 0; i < PORT_PLAN.length; i++) {
      const slot = slots[Math.floor(i * slots.length / PORT_PLAN.length)];
      ports.push({
        id: i,
        rate: PORT_PLAN[i].rate,          // 3 | 2
        resource: PORT_PLAN[i].resource,  // null 表示任意资源 3:1
        vertices: [slot[0], slot[1]]
      });
    }

    // ---- 强盗初始位于沙漠 ----
    let robber = 0;
    for (const h of hexes) {
      if (h.terrain === 'desert') { robber = h.id; break; }
    }

    return { hexes: hexes, vertices: vertices, edges: edges, ports: ports, robber: robber };
  }

  /* ============================== 开局状态 ============================== */

  function normalizeTargetVP(v) {
    const n = (typeof v === 'number' && isFinite(v)) ? Math.floor(v) : 10;
    return n >= 1 ? n : 10;
  }

  function pushCards(deck, card, n) {
    for (let i = 0; i < n; i++) deck.push(card);
  }

  // config = { players:[{name,color,isAI,difficulty}...] 2~4 人,
  //            targetVP=10, randomBoard:boolean, seed?:number,
  //            houseRules?:{ balancedDice:boolean, friendlyRobber:boolean } }
  function createGame(config) {
    const cfg = config || {};
    const defs = Array.isArray(cfg.players) ? cfg.players : [];
    if (defs.length < 2 || defs.length > 4) throw new Error('玩家人数必须为 2~4 人');

    // 房规开关归一：非对象或缺省一律按双 false 处理（v1.24 契约 A）
    const hrIn = (cfg.houseRules && typeof cfg.houseRules === 'object' && !Array.isArray(cfg.houseRules))
      ? cfg.houseRules : null;

    // 所有随机（地图布局、筹码、牌堆洗牌）统一走内部 mulberry32
    const rng = createRng((typeof cfg.seed === 'number' && isFinite(cfg.seed)) ? cfg.seed : defaultSeed());
    const board = generateBoard({ randomBoard: !!cfg.randomBoard }, rng);

    const players = defs.map(function (p, i) {
      p = p || {};
      const color = PLAYER_COLORS.indexOf(p.color) >= 0 ? p.color : PLAYER_COLORS[i % 4];
      const difficulty = (p.difficulty === 'easy' || p.difficulty === 'hard') ? p.difficulty : 'normal';
      return {
        idx: i,
        name: (typeof p.name === 'string' && p.name) ? p.name : ('玩家' + (i + 1)),
        color: color,
        isAI: !!p.isAI,
        difficulty: difficulty,
        resources: { wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 },
        dev: { knight: 0, vp: 0, roadBuilding: 0, yearOfPlenty: 0, monopoly: 0 },
        devBoughtThisTurn: 0,
        devPlayedThisTurn: 0, // 内部字段：本回合已打出的发展卡数（官方规则每回合至多 1 张）
        knightsPlayed: 0,
        roadIds: [],
        settlementIds: [],
        cityIds: [],
        portFlags: { any: false, wood: false, brick: false, sheep: false, wheat: false, ore: false }
      };
    });

    // 发展卡牌堆：25 张 = 骑士14 / VP5 / 路修2 / 丰收2 / 垄断2，内部 RNG 洗牌（队首先出）
    const devDeck = [];
    pushCards(devDeck, 'knight', 14);
    pushCards(devDeck, 'vp', 5);
    pushCards(devDeck, 'roadBuilding', 2);
    pushCards(devDeck, 'yearOfPlenty', 2);
    pushCards(devDeck, 'monopoly', 2);
    shuffle(devDeck, rng);

    return {
      config: {
        targetVP: normalizeTargetVP(cfg.targetVP),
        randomBoard: !!cfg.randomBoard,
        houseRules: { balancedDice: !!(hrIn && hrIn.balancedDice), friendlyRobber: !!(hrIn && hrIn.friendlyRobber) }
      },
      currentPlayer: 0,
      phase: 'setup1',
      setupQueue: players.map(function (p) { return p.idx; }), // 蛇形去程 0→n-1；回程由 actions 层反转
      setupStep: 0,
      players: players,
      board: board,
      robber: board.robber, // 沙漠格 id
      dice: null,
      diceHistory: [], // 历次掷骰点数（两骰之和）；由 actions 层 doRoll 追加
      devDeck: devDeck,
      discardQueue: [],
      pendingTrade: null,
      roadBuildingPending: 0,
      winner: null,
      turnCount: 0,
      rngState: rng.getState(), // 此后所有随机由 actions 层经 createRng(state.rngState) 续走
      awards: { longestRoad: null, largestArmy: null }
    };
  }

  /* ============================== 资源工具 ============================== */

  // cost 中每项资源都足够
  function canAfford(res, cost) {
    if (!cost) return true;
    for (const k in cost) {
      if (!Object.prototype.hasOwnProperty.call(cost, k)) continue;
      const have = (res && typeof res[k] === 'number') ? res[k] : 0;
      if (have < cost[k]) return false;
    }
    return true;
  }

  // 支付费用（原地扣减；调用方需先用 canAfford 校验）
  function payCost(res, cost) {
    if (!res || !cost) return;
    for (const k in cost) {
      if (!Object.prototype.hasOwnProperty.call(cost, k)) continue;
      res[k] = (res[k] || 0) - cost[k];
    }
  }

  // 增加资源（原地累加；统一补齐 5 个资源键）
  function addRes(res, delta) {
    if (!res) return;
    for (const k of RES_KEYS) {
      const d = (delta && typeof delta[k] === 'number') ? delta[k] : 0;
      res[k] = (res[k] || 0) + d;
    }
  }

  function resTotal(res) {
    let t = 0;
    if (res) {
      for (const k of RES_KEYS) t += (typeof res[k] === 'number') ? res[k] : 0;
    }
    return t;
  }

  // 归一化 Res：仅保留非零项（0 值省略）
  function cleanRes(res) {
    const out = {};
    if (res) {
      for (const k of RES_KEYS) {
        const v = (typeof res[k] === 'number' && isFinite(res[k])) ? Math.round(res[k]) : 0;
        if (v !== 0) out[k] = v;
      }
    }
    return out;
  }

  /* ============================ 图结构辅助 ============================ */

  // 顶点坐标为 1/3 的整数倍：×3 取整作为整数控
  function vertexKeyOf(v) {
    return Math.round(v.q * 3) + ',' + Math.round(v.r * 3);
  }

  function buildVertexKeyMap(state) {
    const m = new Map();
    for (const v of state.board.vertices) m.set(vertexKeyOf(v), v.id);
    return m;
  }

  function buildEdgeLookup(state) {
    const m = new Map();
    for (const e of state.board.edges) m.set(e.vertices[0] + '-' + e.vertices[1], e.id);
    return m;
  }

  // 某 hex 的 6 个角点对应的顶点 id（纯海角点返回 -1）
  function hexCornerVertexIds(state, hexId, vmap) {
    const hex = state.board.hexes[hexId];
    const out = [];
    for (let k = 0; k < 6; k++) {
      const key = (hex.q * 3 + CORNER_OFFSETS[k][0]) + ',' + (hex.r * 3 + CORNER_OFFSETS[k][1]);
      const id = vmap.get(key);
      out.push(id === undefined ? -1 : id);
    }
    return out;
  }

  // 某 hex 的全部边（与陆地共享的边；纯海格返回空）
  function edgesOfHex(state, hexId) {
    if (!state || !state.board || !state.board.hexes[hexId]) return [];
    const vmap = buildVertexKeyMap(state);
    const elookup = buildEdgeLookup(state);
    const vids = hexCornerVertexIds(state, hexId, vmap);
    const out = [];
    for (let k = 0; k < 6; k++) {
      const a = vids[k];
      const b = vids[(k + 1) % 6];
      if (a < 0 || b < 0) continue;
      const eid = elookup.get(Math.min(a, b) + '-' + Math.max(a, b));
      if (eid !== undefined) out.push(eid);
    }
    return out;
  }

  // 强盗所在格的全部边（SPEC：强盗所在格不能建路；所有阶段生效，见 legalRoadEdges）
  function robberBannedEdges(state) {
    const banned = {};
    if (state && typeof state.robber === 'number' && state.robber >= 0 && state.board) {
      for (const eid of edgesOfHex(state, state.robber)) banned[eid] = true;
    }
    return banned;
  }

  // 边 e 是否与 idx 的路网相连：端点有己方建筑，或经无建筑的端点接到己方道路
  // （对手村/城所在顶点不可穿过——道路可以修到它跟前，但不能借道继续延伸）
  function edgeConnects(state, e, idx) {
    const board = state.board;
    for (const vid of e.vertices) {
      const b = board.vertices[vid].building;
      if (b && b.player === idx) return true;
    }
    for (const vid of e.vertices) {
      const v = board.vertices[vid];
      if (v.building && v.building.player !== idx) continue; // 被对手建筑截断
      for (const eid2 of v.edges) {
        if (eid2 === e.id) continue;
        if (board.edges[eid2].road === idx) return true;
      }
    }
    return false;
  }

  /* ============================== 合法点位 ============================== */

  // idx 可建村/城的顶点（id 数组）：
  //   - 间隔规则：该顶点及其相邻顶点都无建筑；
  //   - setup1/setup2：无需连通（初始放置任意合法点均可），但要求至少留有
  //     一条「未被强盗禁建且空闲」的边（建村后必须立刻修路：强盗禁边一并
  //     排除，保证建村后必有路可修，不会死局）；
  //   - 主阶段：必须与 idx 的道路相邻。
  function legalSettlementVertices(state, idx) {
    if (!state || !state.board) return [];
    const board = state.board;
    const setup = state.phase === 'setup1' || state.phase === 'setup2';
    const banned = robberBannedEdges(state);
    const out = [];
    for (const v of board.vertices) {
      if (v.building) continue;
      let blocked = false;
      for (const aid of v.adjacent) {
        if (board.vertices[aid].building) { blocked = true; break; }
      }
      if (blocked) continue;
      if (setup) {
        let canRoad = false;
        for (const eid of v.edges) {
          if (banned[eid]) continue; // 强盗所在格不能建路
          if (board.edges[eid].road !== null) continue;
          canRoad = true;
          break;
        }
        if (!canRoad) continue;
      } else {
        let connected = false;
        for (const eid of v.edges) {

    legalRoadEdges: legalRoadEdges,

  /* ================= 房规开关（v1.24 契约 A） ================= */

  // 读取房规开关：config.houseRules 缺失（旧档/手工构造）时按「双关」处理

  // （组合数/36）的平方偏差和。分越小越接近期望；两组候选在同一历史下比较，
  // 分低者胜（applyAction 层平分取第一组），保证确定性。

  // 房规·友好强盗：hexId 是否允许放置。规则关闭时一律允许；初始沙漠不受限

  /* ================= 查询辅助（全部只读，不得改动 state） ================= */

  function getValidActions(state) {

    // 有待应答交易时，只有当前应答者能 respondTrade；canCounter 标记是否还允许还价

  /* ================= 事件 / 结算辅助 ================= */

  // 掷骰生产：强盗所在格豁免；村 1 城 2；按玩家聚合后发 gain 事件
  function produce(state, sum, events) {
    var gains = {}; // playerIdx -> res
    var hs = state.board.hexes;
    var vs = state.board.vertices;
    for (var i = 0; i < hs.length; i++) {
      var hex = hs[i];
