  function buildDefs() {
    var s = '';
    Object.keys(TERRAIN).forEach(function (k) {
      var t = TERRAIN[k];
      s += '<linearGradient id="tg-' + k + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + t.c1 + '"/><stop offset="1" stop-color="' + t.c2 + '"/></linearGradient>';
    });
    Object.keys(PCOLOR).forEach(function (c) {
      var p = PCOLOR[c];
      s += '<linearGradient id="pg-' + c + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + p.light + '"/><stop offset="1" stop-color="' + p.main + '"/></linearGradient>';
    });
    s += '<radialGradient id="oceanGrad" cx="0.5" cy="0.30" r="1.05">' +
      '<stop offset="0" stop-color="#3b86b1"/><stop offset="0.55" stop-color="#1d5377"/><stop offset="1" stop-color="#0c2c46"/></radialGradient>';
    s += '<linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#eedcaa"/><stop offset="1" stop-color="#c8ae83"/></linearGradient>';
    s += '<linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#fdf8e8"/><stop offset="1" stop-color="#e4d5aa"/></linearGradient>';
    s += '<linearGradient id="robberGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#59637a"/><stop offset="1" stop-color="#20242f"/></linearGradient>';
    s += '<filter id="fHex" x="-25%" y="-25%" width="150%" height="150%">' +
      '<feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#03121f" flood-opacity="0.45"/></filter>';
    s += '<filter id="fSoft" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#03121f" flood-opacity="0.55"/></filter>';
    // 当前行动玩家棋子的轻微金色外发光（界面改版 v2）
    s += '<filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#ffd76a" flood-opacity="0.85"/></filter>';
    // v1.21 契约 C：最长公路金色流光渐变（userSpaceOnUse + repeat，线条任意方向均可着色；
    // 配合 style.css .gold-road-flow 的 stroke-dashoffset 流动动画形成「流光」效果）
    s += '<linearGradient id="goldFlowGrad" gradientUnits="userSpaceOnUse" spreadMethod="repeat" x1="0" y1="-24" x2="0" y2="24">' +
      '<stop offset="0" stop-color="#fff3c4"/><stop offset="0.5" stop-color="#e0a83c"/><stop offset="1" stop-color="#fff3c4"/></linearGradient>';
    return s;
  }

  /* --- 每种地形的小装饰（确定性随机，纯 SVG 手绘） --- */
  function decoForest(g, cx, cy, rnd) {
    var spots = [[-0.32, -0.10], [0.04, -0.30], [0.33, 0.04], [-0.06, 0.30], [0.30, -0.24], [-0.34, 0.14]];
    spots.sort(function () { return rnd() - 0.5; });
    var n = 4;
    for (var i = 0; i < n; i++) {
      var x = cx + spots[i][0] * S + (rnd() - 0.5) * 10, y = cy + spots[i][1] * S + (rnd() - 0.5) * 8;
      var sc = 0.85 + rnd() * 0.35;
      var t = mk('g', { transform: 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') scale(' + sc.toFixed(2) + ')' });
      t.appendChild(mk('rect', { x: -3, y: 2, width: 6, height: 11, rx: 1.5, fill: '#6b4a2a' }));
      t.appendChild(mk('polygon', { points: '-14,6 14,6 0,-14', fill: '#1a5c31' }));
      t.appendChild(mk('polygon', { points: '-10,-6 10,-6 0,-26', fill: '#237142' }));
      g.appendChild(t);
    }
  }
  function decoFields(g, cx, cy) {
    [[-0.34, 0.10], [0, -0.12], [0.34, 0.14], [0.02, 0.32]].forEach(function (o, i) {
      var x = cx + o[0] * S, y = cy + o[1] * S;
      var st = mk('g', { transform: 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + (i % 2 ? 10 : -8) + ')' });
      st.appendChild(mk('path', { d: 'M0 16 L0 -8', stroke: '#a5731f', 'stroke-width': 2.4, fill: 'none', 'stroke-linecap': 'round' }));
      [[-5, -1, 30], [5, -1, -30], [-4.4, 6, 30], [4.4, 6, -30]].forEach(function (e) {
        st.appendChild(mk('ellipse', { cx: e[0], cy: e[1], rx: 2.6, ry: 5.4, fill: '#e9bd4e', transform: 'rotate(' + e[2] + ' ' + e[0] + ' ' + e[1] + ')' }));
      });
      st.appendChild(mk('ellipse', { cx: 0, cy: -11, rx: 2, ry: 4.6, fill: '#f2cd6b' }));
      g.appendChild(st);
    });
  }
  function decoPasture(g, cx, cy, rnd) {
    [[-0.28, -0.06], [0.24, -0.18], [0, 0.26]].forEach(function (o) {
      var x = cx + o[0] * S + (rnd() - 0.5) * 8, y = cy + o[1] * S + (rnd() - 0.5) * 6;
      var sp = mk('g', { transform: 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')' });
      sp.appendChild(mk('line', { x1: -5, y1: 9, x2: -5, y2: 13, stroke: '#4a4238', 'stroke-width': 2 }));
      sp.appendChild(mk('line', { x1: 5, y1: 9, x2: 5, y2: 13, stroke: '#4a4238', 'stroke-width': 2 }));
      sp.appendChild(mk('circle', { cx: -6, cy: 2, r: 6.4, fill: '#f8f5ea' }));
      sp.appendChild(mk('circle', { cx: 1, cy: 0, r: 7.4, fill: '#fdfcf5' }));
      sp.appendChild(mk('circle', { cx: 8, cy: 2.4, r: 5.8, fill: '#f2eedd' }));
      sp.appendChild(mk('circle', { cx: 12.4, cy: -3.4, r: 3.6, fill: '#4a4238' }));
      g.appendChild(sp);
    });
    for (var i = 0; i < 4; i++) {
      var gx = cx + (rnd() - 0.5) * 1.4 * S, gy = cy + (rnd() - 0.5) * 1.2 * S;
      g.appendChild(mk('path', {
        d: 'M' + gx.toFixed(1) + ' ' + gy.toFixed(1) + ' l2.5 -6 l2.5 6 m-2.5 -3 l2 -4.6',
        stroke: '#4d7a34', 'stroke-width': 1.6, fill: 'none', 'stroke-linecap': 'round'
      }));
    }
  }
  function decoHills(g, cx, cy) {
    g.appendChild(mk('ellipse', { cx: cx, cy: cy + 0.14 * S, rx: 0.3 * S, ry: 0.12 * S, fill: '#a34a22' }));
    var rows = [[-0.16, -0.02, 0.3], [0.05, 0.10, 0.26], [-0.05, 0.24, 0.22]];
    rows.forEach(function (r, i) {
      var bw = r[2] * S, bh = 0.10 * S;
      var b = mk('rect', {
        x: cx + r[0] * S - bw / 2, y: cy + r[1] * S, width: bw, height: bh, rx: 3,
        fill: '#8a3d1b', stroke: '#5f2710', 'stroke-width': 1.5
      });
      g.appendChild(b);
      g.appendChild(mk('line', {
        x1: cx + r[0] * S - bw / 2 + 3, y1: cy + r[1] * S + 2.5,
        x2: cx + r[0] * S + bw / 2 - 3, y2: cy + r[1] * S + 2.5,
        stroke: '#cf7a4a', 'stroke-width': 1.6, opacity: 0.8
      }));
      void i;
    });
  }
  function decoMountains(g, cx, cy) {
    function peak(x, y, w, h, base) {
      g.appendChild(mk('polygon', {
        points: (x - w) + ',' + (y + base) + ' ' + (x + w) + ',' + (y + base) + ' ' + x + ',' + (y - h),
        fill: '#5d6874', stroke: '#46505b', 'stroke-width': 1.5
      }));
      g.appendChild(mk('polygon', {
        points: (x - w * 0.34) + ',' + (y - h * 0.52) + ' ' + (x + w * 0.34) + ',' + (y - h * 0.52) + ' ' + x + ',' + (y - h),
        fill: '#eef2f6'
      }));
    }
    peak(cx - 0.22 * S, cy + 0.02 * S, 0.24 * S, 0.34 * S, 0.22 * S);
    peak(cx + 0.22 * S, cy + 0.06 * S, 0.2 * S, 0.28 * S, 0.18 * S);
    peak(cx + 0.02 * S, cy - 0.04 * S, 0.18 * S, 0.24 * S, 0.2 * S);
  }
  function decoDesert(g, cx, cy) {
    g.appendChild(mk('path', {
      d: 'M' + (cx - 0.4 * S) + ' ' + (cy + 0.08 * S) + ' Q ' + (cx - 0.15 * S) + ' ' + (cy - 0.10 * S) + ' ' + (cx + 0.08 * S) + ' ' + (cy + 0.02 * S) + ' T ' + (cx + 0.42 * S) + ' ' + (cy - 0.02 * S),

    c.appendChild(mk('rect', { x: -10, y: -6, width: 4, height: 9, rx: 2, fill: '#5c7a3a' }));
    c.appendChild(mk('rect', { x: -10, y: -6, width: 9, height: 4, rx: 2, fill: '#5c7a3a' }));
    c.appendChild(mk('rect', { x: 6, y: -9, width: 4, height: 11, rx: 2, fill: '#6b8a46' }));
    c.appendChild(mk('rect', { x: 1, y: -9, width: 9, height: 4, rx: 2, fill: '#6b8a46' }));

  }
  // 为每格生成绝对坐标 clipPath（贴图裁剪用，无条件生成保证引用恒有效）
  function buildHexClipDefs(defs, hexes, g0) {
    hexes.forEach(function (h) {
      var c = g0.hexC[h.id];
      if (!c) return;
      var cp = mk('clipPath', { id: 'clipHex' + h.id });
      cp.appendChild(mk('polygon', { points: hexPolyAttr(c.x, c.y) }));
      defs.appendChild(cp);
    });
  }
  // 外圈海面平铺图案（sea.jpg；加载失败经 onSeaFail 回退外框纯渐变）
  function buildSeaPattern(defs, onSeaFail) {
    var pat = mk('pattern', { id: 'seaPat', patternUnits: 'userSpaceOnUse', width: 400, height: 400 });
    pat.appendChild(svgImgEl(ASSETS.sea, { width: 400, height: 400, preserveAspectRatio: 'xMidYMid slice' }, onSeaFail));
    defs.appendChild(pat);
  }

  function buildBoardStatic(state) {
    hideChipTip(); // 静态层重建后旧坐标失效，先收起圆片 tooltip
    var g0 = computeGeometry(state);
    var svg = dom.board;
    svg.setAttribute('viewBox', g0.viewBox.join(' '));
    svg.innerHTML = '';
    var defs = mk('defs'); defs.innerHTML = buildDefs(); svg.appendChild(defs);
    var vb = g0.viewBox;
    var hexes = (state.board && state.board.hexes) || [];
    var FR = { x: vb[0] - 4 * S, y: vb[1] - 4 * S, width: vb[2] + 8 * S, height: vb[3] + 8 * S };
    // 外框海面：底层 oceanGrad 兜底（缺图即回退此渐变）+ sea.jpg 平铺贴图 + 径向压暗融合
    svg.appendChild(mk('rect', { x: FR.x, y: FR.y, width: FR.width, height: FR.height, fill: 'url(#oceanGrad)' }));
    var seaTexRect = null, seaDepthRect = null;
    buildHexClipDefs(defs, hexes, g0);
    if (assetOK(ASSETS.sea)) {
      var killSeaTex = function () {
        // 海图加载失败兜底：移除贴图层与压暗层，恢复纯 oceanGrad 外框
        [seaTexRect, seaDepthRect].forEach(function (r) { if (r && r.parentNode) r.parentNode.removeChild(r); });
      };
      buildSeaPattern(defs, killSeaTex);
      seaTexRect = mk('rect', { x: FR.x, y: FR.y, width: FR.width, height: FR.height, fill: 'url(#seaPat)', opacity: 0.55 });
      seaDepthRect = mk('rect', { x: FR.x, y: FR.y, width: FR.width, height: FR.height, fill: 'url(#oceanGrad)', opacity: 0.5 });
      svg.appendChild(seaTexRect);
      svg.appendChild(seaDepthRect);
    }

    L = {};
    // gLogHl：战报悬停定位脉冲层（契约 B；不随 renderDynamic 重建，仅由悬停进出驱动）
    // gGold：最长公路金色流光层（v1.21 契约 C；夹在 gRoads 与 gBuilds 之间）
    ['gSea', 'gSeaTex', 'gSand', 'gLand', 'gDeco', 'gTex', 'gChips', 'gRoutes', 'gRoads', 'gGold', 'gBuilds', 'gProd', 'gPorts', 'gHl', 'gLogHl', 'gRobber', 'gGhost'].forEach(function (k) {
      L[k] = mk('g', { 'class': k });
      svg.appendChild(L[k]);
    });

    // 外圈海（矢量回退层 + 贴图层）
    var seaRnd = seededRand(77);
    hexes.forEach(function (h) {
      if (h.terrain !== 'sea') return;
      var c = g0.hexC[h.id];
      L.gSea.appendChild(mk('polygon', {
        points: hexPolyAttr(c.x, c.y), fill: 'url(#tg-sea)', opacity: 0.5,
        stroke: 'rgba(255,255,255,0.09)', 'stroke-width': 1.5
      }));
      if (seaRnd() < 0.42) {
        var wx = c.x + (seaRnd() - 0.5) * 0.7 * S, wy = c.y + (seaRnd() - 0.5) * 0.7 * S;
        L.gSea.appendChild(mk('path', {
          d: 'M' + (wx - 17).toFixed(1) + ' ' + wy.toFixed(1) + ' q 6 -8 12 0 q 6 8 12 0',
          stroke: 'rgba(215,238,250,0.4)', 'stroke-width': 2.4, fill: 'none', 'stroke-linecap': 'round'
        }));
      }
      if (assetOK(ASSETS.sea)) {
        // 海格贴图：方形贴图中心对齐六边形，clipPath 裁剪；描边以矢量叠加保持格线
        L.gSeaTex.appendChild(svgImgEl(ASSETS.sea, {
          x: (c.x - S).toFixed(1), y: (c.y - S).toFixed(1), width: 2 * S, height: 2 * S,
          preserveAspectRatio: 'xMidYMid slice', 'clip-path': 'url(#clipHex' + h.id + ')', opacity: 0.82
        }));
        L.gSeaTex.appendChild(mk('polygon', {
          points: hexPolyAttr(c.x, c.y), fill: 'none',
          stroke: 'rgba(255,255,255,0.09)', 'stroke-width': 1.5
        }));
      }
    });

    // 沙滩底 + 陆地
    hexes.forEach(function (h) {
      if (h.terrain === 'sea') return;
      var c = g0.hexC[h.id];
      L.gSand.appendChild(mk('polygon', { points: hexPolyAttr(c.x, c.y, 1.055), fill: 'url(#sandGrad)' }));
    });
    hexes.forEach(function (h) {
      if (h.terrain === 'sea') return;
      var c = g0.hexC[h.id], t = TERRAIN[h.terrain] || TERRAIN.desert;
      L.gLand.appendChild(mk('polygon', {
        points: hexPolyAttr(c.x, c.y), fill: 'url(#tg-' + h.terrain + ')',
        stroke: t.line, 'stroke-width': 2.5, 'data-hex': h.id
      }));
      var deco = mk('g');
      var rnd = seededRand(h.id * 2654435761 + 7);
      if (h.terrain === 'forest') decoForest(deco, c.x, c.y, rnd);
      else if (h.terrain === 'fields') decoFields(deco, c.x, c.y);
      else if (h.terrain === 'pasture') decoPasture(deco, c.x, c.y, rnd);
      else if (h.terrain === 'hills') decoHills(deco, c.x, c.y);
      else if (h.terrain === 'mountains') decoMountains(deco, c.x, c.y);
      else if (h.terrain === 'desert') decoDesert(deco, c.x, c.y);
      L.gDeco.appendChild(deco);
    });

    // 陆地贴图层（gDeco 之上）：手绘地形贴图 + clipPath 裁剪；
    // 加载失败时 onerror 自动摘除 <image>，露出下层矢量渐变与装饰，绝不白屏。
    hexes.forEach(function (h) {
      if (h.terrain === 'sea') return;
      var path = ASSETS.tiles[h.terrain];
      if (!path || !assetOK(path)) return;
      var c = g0.hexC[h.id];
      if (!c) return;
      L.gTex.appendChild(svgImgEl(path, {
        x: (c.x - S).toFixed(1), y: (c.y - S).toFixed(1), width: 2 * S, height: 2 * S,
        preserveAspectRatio: 'xMidYMid slice', 'clip-path': 'url(#clipHex' + h.id + ')'
      }));
    });
    // 陆地描边矢量叠加（贴图之上保持六边形格线清晰）
    hexes.forEach(function (h) {
      if (h.terrain === 'sea') return;
      var c = g0.hexC[h.id], t = TERRAIN[h.terrain] || TERRAIN.desert;
      if (!c) return;
      L.gTex.appendChild(mk('polygon', {
        points: hexPolyAttr(c.x, c.y), fill: 'none',
        stroke: t.line, 'stroke-width': 2.5
      }));
    });

    // 数字筹码（v1.21 契约 A：6/8 红色加粗保留；全部圆片字号随概率点递减
    // —— 6/8 最大 → 2/12 最小，字号档位见 style.css .chip-num.p1~p5；
    // 概率点 = 6 − |7 − n|，圆点数与 tooltip 文案同源）
    hexes.forEach(function (h) {
      if (h.terrain === 'sea' || h.number == null) return;
      var c = g0.hexC[h.id], red = (h.number === 6 || h.number === 8);
      var pips = pipValueOf(h.number); // 1..5（E-20261104-3：合法数字格 2~12，无 7 号格）
      var g = mk('g', { 'class': 'chip-g' + (red ? ' chip-red' : ''), transform: 'translate(' + c.x.toFixed(1) + ',' + (c.y - 2).toFixed(1) + ')' });
      g.appendChild(mk('circle', { r: 27, fill: 'url(#chipGrad)', stroke: red ? '#b03a2a' : '#7a6a45', 'stroke-width': 3, filter: 'url(#fSoft)' }));
      var t = mk('text', { y: -1, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'class': 'chip-num' + (red ? ' red' : '') + ' p' + pips });
      t.textContent = String(h.number);
      g.appendChild(t);
      for (var i = 0; i < pips; i++) {
        g.appendChild(mk('circle', { cx: (i - (pips - 1) / 2) * 8, cy: 13.5, r: 2.3, 'class': 'chip-pip' + (red ? ' red' : '') }));
      }
      // 悬停命中区 + tooltip「数字 n · 概率 x/36」（父组 pointer-events:none，
      // 命中圆单独放行；建造/强盗高亮层在其上，交互优先级不受影响）
      var hit = mk('circle', { r: 27, fill: 'transparent', 'class': 'chip-hit' });
      hit.addEventListener('mouseenter', function () {
        showChipTip(c, '数字 ' + h.number + ' · 概率 ' + pips + '/36');
      });
      hit.addEventListener('mouseleave', hideChipTip);
      g.appendChild(hit);
      L.gChips.appendChild(g);
    });

    // 港口航线 + 徽章
    ((state.board && state.board.ports) || []).forEach(function (p) {
      var pp = g0.portPts[p.id];
      if (!pp) return;
      L.gRoutes.appendChild(mk('path', {
        d: 'M' + pp.a.x.toFixed(1) + ' ' + pp.a.y.toFixed(1) +
          ' Q ' + pp.ctrl.x.toFixed(1) + ' ' + pp.ctrl.y.toFixed(1) +
          ' ' + pp.b.x.toFixed(1) + ' ' + pp.b.y.toFixed(1),

      }));
      [pp.a, pp.b].forEach(function (pt) {

      });
      var bg = mk('g', { transform: 'translate(' + pp.badge.x.toFixed(1) + ',' + pp.badge.y.toFixed(1) + ')', 'class': 'port-badge' });
      bg.appendChild(mk('circle', { r: 29, fill: 'url(#chipGrad)', stroke: '#8a6f3c', 'stroke-width': 3, filter: 'url(#fSoft)' }));
      if (p.resource && RES[p.resource]) {
        var ic = mk('g');
        ic.innerHTML = resIconSVG(p.resource, 26).replace('<svg', '<svg x="-13" y="-21"');
        bg.appendChild(ic);
        var lb = mk('text', { y: 14, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'class': 'port-rate' });

        var lb3 = mk('text', { y: 13, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'class': 'port-any' });
        lb3.textContent = '任意';
        bg.appendChild(lb3);
      }
      L.gPorts.appendChild(bg);
    });

    layoutBoard(); // 建完静态层立即按容器尺寸做一次自适应布局
  }

  // 道路：圆头粗线（深色描边 + 主色 + 中央高光线），宽 ≈0.18×边长
  function roadLines(seg, col, into, ghost) {

  }

  /* ==================== 动态棋盘 ==================== */
  function renderDynamic(state, opts, ctx) {

    L.gHl.innerHTML = ''; L.gRobber.innerHTML = ''; L.gGhost.innerHTML = '';
    if (L.gGold) L.gGold.innerHTML = ''; // v1.21 契约 C：金色流光层随渲染重建
    var glowOn = state.phase !== 'gameover';
    var actor = displayActor(state, opts);

    // 道路
    ((state.board && state.board.edges) || []).forEach(function (e) {
      if (e.road == null) return;
      var seg = g0.edgeSeg[e.id];
      if (!seg) return;
      var col = pc((state.players[e.road] || {}).color);
      var g = mk('g', { 'class': 'road-g' });
      var top = roadLines(seg, col, g, false);
      if (ctx && ctx.builtEdge === e.id) top.setAttribute('class', 'road-top pop-line');
      if (glowOn && e.road === actor) g.setAttribute('filter', 'url(#fGlow)');
      L.gRoads.appendChild(g);
    });

    // v1.21 契约 C：当前持有「最长公路」玩家的构成边叠加金色流光描边
    // （边集合来自 render() 里缓存的 curRoadHl，数据源 CatanVp.longestRoadEdges）
    drawRoadGoldHighlight(state);

    // 建筑
    ((state.board && state.board.vertices) || []).forEach(function (v) {
      if (!v.building) return;
      var p0 = g0.vertP[v.id];
      if (!p0) return;
      var colorKey = (state.players[v.building.player] || {}).color || 'red';
      var col = pc(colorKey);
      var grad = 'url(#pg-' + colorKey + ')';
      var g = mk('g', { transform: 'translate(' + p0.x.toFixed(1) + ',' + p0.y.toFixed(1) + ')', 'class': 'bldg' });
      // 棋子整体放大 1.35 倍（「道路和村庄太不明显」反馈）；缩放放在内层 g，
      // 外层 g 的 transform 留给 pop/glow 动画使用
      var art = mk('g', { transform: 'scale(1.35)' });
      if (v.building.kind === 'settlement') {
        shadowEl(art, 20, 6, 12);
        drawSettlementArt(art, grad);
      } else {
        shadowEl(art, 26, 7, 14);
        drawCityArt(art, grad);
      }
      g.appendChild(art);

      if (glowOn && v.building.player === actor) g.setAttribute('filter', 'url(#fGlow)');
      L.gBuilds.appendChild(g);
    });

    // 产出格高亮（掷骰后：数字命中且强盗不在）
    var fresh = ctx && ctx.freshRoll;
    if (state.dice && state.dice.length === 2) {
      var sum = state.dice[0] + state.dice[1];
      ((state.board && state.board.hexes) || []).forEach(function (h) {
        if (h.terrain === 'sea' || h.number !== sum) return;
        var c = g0.hexC[h.id];
        if (!c) return;
        var poly = mk('polygon', {
          // v1.22 契约 B：掷骰后产出格强脉冲（fxOn 门控，红线 E）
          points: hexPolyAttr(c.x, c.y, 0.94), 'class': 'prod-hex' + (fresh && fxOn ? ' prod-pulse' : '')
        });
        L.gProd.appendChild(poly);
      });
    }

    // 强盗：阴影格 + 棋子（robber.png 贴图，矢量图钉作为加载失败回退；事件触发平移动画）
    var rb = g0.hexC[state.robber];
    if (rb) {
      L.gRobber.appendChild(mk('polygon', { points: hexPolyAttr(rb.x, rb.y, 0.96), fill: 'rgba(20,10,4,0.22)' }));
      var rg = mk('g', { 'class': 'robber-g', transform: 'translate(' + rb.x.toFixed(1) + ',' + rb.y.toFixed(1) + ')' });
      rg.appendChild(mk('ellipse', { cx: 0, cy: 21, rx: 20, ry: 6, fill: 'rgba(0,0,0,0.4)' }));

      rg.appendChild(mk('circle', { r: 26, fill: 'url(#robberGrad)', stroke: 'rgba(255,255,255,0.72)', 'stroke-width': 2.4, filter: 'url(#fSoft)' }));
      rg.appendChild(mk('circle', { cx: 0, cy: -7, r: 7.2, fill: '#dfe4ec' }));
      rg.appendChild(mk('path', { d: 'M -10.5 13 C -10.5 -1 10.5 -1 10.5 13 Z', fill: '#dfe4ec' }));
      rg.appendChild(mk('ellipse', { cx: 0, cy: 14, rx: 12, ry: 3.6, fill: '#c9d0da' }));

      if (assetOK(ASSETS.robber)) {

          preserveAspectRatio: 'xMidYMid meet'
        }));

      if (ctx && ctx.robberMoved && ctx.robberFrom != null) {
        var from = g0.hexC[ctx.robberFrom];
        if (from && fxOn) tweenRobber(rg, from, rb); // v1.22 红线 E：动画受 fxOn 门控
      }

    renderHighlights(state, opts);
  }

  // v1.22 契约 C：强盗抛物线飞行动画——水平方向 ease-in-out 推进，垂直方向叠加
  // 「4k(1-k)」抛物线拱顶（升再降），途中轻微放大模拟腾空，落点触发尘土涟漪。
  // rAF 驱动（robberTween 令牌防重入），单次 640ms ≤900ms 红线；调用方已按 fxOn 门控。
  function tweenRobber(node, from, to) {
    var token = ++robberTween;
    var t0 = null, dur = 640;
    var dist = Math.sqrt((to.x - from.x) * (to.x - from.x) + (to.y - from.y) * (to.y - from.y));
    var peak = clamp(dist * 0.34, 44, 96); // 拱顶高度随距离，短移不低于 44 保证「升再降」可辨
    function step(ts) {
      if (token !== robberTween || !node.parentNode) return;
      if (t0 == null) t0 = ts;
      var k = clamp((ts - t0) / dur, 0, 1);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      var x = from.x + (to.x - from.x) * e;
      var y = from.y + (to.y - from.y) * e - peak * 4 * k * (1 - k);
      var sc = 1 + 0.14 * Math.sin(Math.PI * k);
      node.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') scale(' + sc.toFixed(3) + ')');
      if (k < 1) requestAnimationFrame(step);
      else dustRipple(to.x, to.y);
    }
    node.setAttribute('transform', 'translate(' + from.x.toFixed(1) + ',' + from.y.toFixed(1) + ')');
    requestAnimationFrame(step);
  }
  // v1.22 契约 C：强盗落点尘土涟漪——双圈扩散光环 + 五粒尘土向两侧上方溅起；
  // 画在棋盘 HTML 飘层 dom.fx（不随 renderDynamic 重建），单次 ≤660ms，fxOn 门控
  function dustRipple(bx, by) {
    if (!fxOn || !dom.fx) return;
    var pt = boardToScreen(bx, by);
    if (!pt) return;
    var i, node;
    for (i = 0; i < 2; i++) {
      node = el('i', 'dust-ring' + (i ? ' dust-late' : ''));
      node.style.left = pt.x.toFixed(1) + 'px';
      node.style.top = pt.y.toFixed(1) + 'px';
      dom.fx.appendChild(node);
      (function (n2) {
        setTimeout(function () { if (n2.parentNode) n2.parentNode.removeChild(n2); }, 820);
      })(node);
    }
    for (i = 0; i < 5; i++) {
      node = el('i', 'dust-puff');
      node.style.left = pt.x.toFixed(1) + 'px';
      node.style.top = pt.y.toFixed(1) + 'px';
      node.style.setProperty('--dx', ((i % 2 ? 1 : -1) * (9 + Math.random() * 16)).toFixed(1) + 'px');
      node.style.setProperty('--dy', (-7 - Math.random() * 12).toFixed(1) + 'px');
      dom.fx.appendChild(node);
      (function (n3) {
        setTimeout(function () { if (n3.parentNode) n3.parentNode.removeChild(n3); }, 700);
      })(node);
    }
  }

  // SVG class 工具（避免依赖 SVGElement.classList 的兼容性）
  function svgAddCls(n, cls) {
    var cur = n.getAttribute('class') || '';
    if ((' ' + cur + ' ').indexOf(' ' + cls + ' ') >= 0) return;
    n.setAttribute('class', cur + (cur ? ' ' : '') + cls);
  }
  function svgRmCls(n, cls) {
    var parts = (n.getAttribute('class') || '').split(/\s+/).filter(function (c) {
      return c && c !== cls;
    });
    n.setAttribute('class', parts.join(' '));
  }

  /* ---- 幽灵棋子预览（悬停合法点时的半透明落子示意） ---- */

  function hideGhost() {

  // 高亮层：严格由 opts（buildMode + selectable）驱动，每次整体重建（幂等）。
  // 界面改版 v2：命中区半径 0.42×六边形半径；悬停显示幽灵棋子 + 高亮圈放大 10%。
  function renderHighlights(state, opts) {
    L.gHl.innerHTML = '';
    hideGhost();
    opts = opts || {};
    var sel = opts.selectable || {};
    var mode = opts.buildMode || null;
    var actor = displayActor(state, opts);
    var clickable = !maskActive && isHuman(state, actor);
    var actorColor = (state.players[actor] || {}).color || 'red';
    var HIT_R = 0.42 * S; // 命中区半径：0.42 × 六边形半径

    if (clickable && (state.phase === 'robber') && sel.hexes && sel.hexes.length) {
      sel.hexes.forEach(function (hid) {
        var c = geom.hexC[hid];
        if (!c) return;
        var poly = mk('polygon', { points: hexPolyAttr(c.x, c.y, 0.9), 'class': 'hl-hex' });
        var hit = mk('polygon', { points: hexPolyAttr(c.x, c.y), fill: 'transparent', 'class': 'hl-hit' });
        var go = function () { act({ type: 'moveRobber', hexId: hid }); };
        var hovOn = function () { svgAddCls(poly, 'hov'); showGhost('robber', c, actorColor); };
        var hovOff = function () { svgRmCls(poly, 'hov'); hideGhost(); };
        [poly, hit].forEach(function (n) {
          n.addEventListener('click', go);
          n.addEventListener('mouseenter', hovOn);
          n.addEventListener('mouseleave', hovOff);
        });
        L.gHl.appendChild(poly); L.gHl.appendChild(hit);
      });
    }
    if (clickable && mode === 'road' && sel.edges && sel.edges.length) {
      sel.edges.forEach(function (eid) {
        var seg = geom.edgeSeg[eid];
        if (!seg) return;
        var ln = mk('line', {
          x1: seg[0].x, y1: seg[0].y, x2: seg[1].x, y2: seg[1].y, 'class': 'hl-edge'
        });
        var hit = mk('line', {
          x1: seg[0].x, y1: seg[0].y, x2: seg[1].x, y2: seg[1].y,
          stroke: 'transparent', 'stroke-width': 0.34 * S, 'stroke-linecap': 'round', 'class': 'hl-hit'
        });
        var go = function () { act({ type: 'buildRoad', edgeId: eid }); };
        var hovOn = function () { svgAddCls(ln, 'hov'); showGhost('road', { x: 0, y: 0 }, actorColor, { seg: seg }); };
        var hovOff = function () { svgRmCls(ln, 'hov'); hideGhost(); };
        [ln, hit].forEach(function (n) {
          n.addEventListener('click', go);
          n.addEventListener('mouseenter', hovOn);
          n.addEventListener('mouseleave', hovOff);

      sel.vertices.forEach(function (vid) {
        var p0 = geom.vertP[vid];
        if (!p0) return;
        var c = mk('circle', { cx: p0.x, cy: p0.y, r: 19, 'class': 'hl-vert hl-' + mode });
        var hit = mk('circle', { cx: p0.x, cy: p0.y, r: HIT_R, fill: 'transparent', 'class': 'hl-hit' });
        var actionType = mode === 'city' ? 'buildCity' : 'buildSettlement';
        var go = function () { act({ type: actionType, vertexId: vid }); };
        var hovOn = function () { svgAddCls(c, 'hov'); showGhost(mode, p0, actorColor); };
        var hovOff = function () { svgRmCls(c, 'hov'); hideGhost(); };
        [c, hit].forEach(function (n) {
          n.addEventListener('click', go);
          n.addEventListener('mouseenter', hovOn);
          n.addEventListener('mouseleave', hovOff);
        });
        L.gHl.appendChild(c); L.gHl.appendChild(hit);
      });
    }
  }

  /* ==================== 棋盘 HTML 飘字 ==================== */
  function boardFloat(x, y, text, cls) {

  // 抽发展卡动画：cardback.jpg 小卡翻落入位（WAAPI，不可用时短暂展示后移除）
  function devDrawFx(buyerIdx) {

    var anchor = null;
    if (buyerIdx === viewPlayer && dom.devArea) anchor = dom.devArea.getBoundingClientRect();
    else if (dom.playersCol) {
      var panel = dom.playersCol.querySelector('[data-pidx="' + buyerIdx + '"]');
      if (panel) anchor = panel.getBoundingClientRect();
    }
    if (!anchor || !anchor.width) return;
    var W = 54, H = Math.round(W * 1536 / 1024); // cardback.jpg 原始比例 1024x1536
    var c = el('div', 'dev-draw-fx');
    c.style.cssText = 'position:absolute;pointer-events:none;z-index:80;width:' + W + 'px;height:' + H + 'px;' +
      'border-radius:7px;border:1px solid #8a6f3c;box-shadow:0 6px 14px rgba(0,0,0,0.5);' +
      'background-image:url("' + ASSETS.cardback + '"), linear-gradient(#2e5382,#17334f);' +
      'background-size:cover;background-position:center;';

    c.style.top = (anchor.top + anchor.height / 2 - H / 2) + 'px';
    rootEl.appendChild(c);
    var done = false;
    function finish() { if (done) return; done = true; if (c.parentNode) c.parentNode.removeChild(c); }
    if (typeof c.animate === 'function') {
      try {
        var a = c.animate([
          { opacity: 0, transform: 'translateY(-26px) scale(0.55) rotateY(80deg)' },
          { opacity: 1, transform: 'translateY(0) scale(1) rotateY(0deg)', offset: 0.45 },
          { opacity: 1, transform: 'translateY(0) scale(1)', offset: 0.75 },
          { opacity: 0, transform: 'translateY(14px) scale(0.92)' }
        ], { duration: 1250, easing: 'ease' });
        a.onfinish = finish; a.oncancel = finish;
      } catch (e) { setTimeout(finish, 900); }
    } else {
      setTimeout(finish, 900);
    }
    setTimeout(finish, 1600); // 保险清理
  }

  /* ==================== 资源转移动画（界面改版契约 v2 第 9 条） ====================
   * 统一动画层：#uiFlyRoot（fixed 全屏覆盖、pointer-events:none 不拦截点击）+
   * .fly-chip 绝对定位元素；WAAPI 优先（带弧线中点关键帧），CSS transition 兜底；
   * 单次 ≤500ms；fxOn=false 时全部静默关闭（只保留瞬时飘字）。 */
  function setFx(b) {
    fxOn = !!b;
    if (!fxOn && dom.flyRoot) dom.flyRoot.innerHTML = '';
    // v1.22 红线 E：关动画即清全部动效残留——飞行层 / 棋盘尘土层 / 称号横幅 /
    // 手牌 +N 徽章 / 进行中的骰子翻滚（立即落定为当前骰面）
    if (!fxOn && dom.fx) dom.fx.innerHTML = '';
    if (!fxOn && bannerHostEl) {
      bannerHostEl.innerHTML = '';
      if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
    }
    if (!fxOn && handBadgeEl) handBadgeEl.classList.remove('show', 'bouncing');
    if (!fxOn && diceTimer) {
      clearInterval(diceTimer); diceTimer = null;
      if (dom.die1 && dom.die2) {
        dom.die1.classList.remove('rolling', 'settle');
        dom.die2.classList.remove('rolling', 'settle');
        if (lastState && lastState.dice && lastState.dice.length === 2) {
          setDieFace(dom.die1, lastState.dice[0]);
          setDieFace(dom.die2, lastState.dice[1]);
        }
      }
    }
    if (dom.fxBtn) {
      dom.fxBtn.innerHTML = fxOn
        ? '<svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 2 L12.2 7.8 L18 10 L12.2 12.2 L10 18 L7.8 12.2 L2 10 L7.8 7.8 Z" fill="#f3e7c8"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#cbb98a" stroke-width="2"/><path d="M3.5 16.5 L16.5 3.5" stroke="#cbb98a" stroke-width="2" stroke-linecap="round"/></svg>';
      dom.fxBtn.title = fxOn ? '关闭动画' : '开启动画';
    }
  }
  function isFxOn() { return fxOn; }
  function boardWrapRect() {
    try { return dom.boardWrap ? dom.boardWrap.getBoundingClientRect() : null; } catch (e) { return null; }
  }
  // 棋盘坐标 → 视口坐标（飞行层为 fixed 全屏，统一用视口坐标）
  function boardPointVp(x, y) {
    var p = boardToScreen(x, y), r = boardWrapRect();
    if (!p || !r) return null;
    return { x: r.left + p.x, y: r.top + p.y };
  }
  function elCenterVp(node) {
    try {
      var r = node.getBoundingClientRect();

            (ev.free ? ' <i>(路修卡免费路，剩余 ' + (ev.left || 0) + ' 条)</i>' : ''), buildLoc);
          if (ev.kind === 'road') ctx.builtEdge = ev.id;
          else ctx.builtVertex = ev.id;
          var bp = geom ? (ev.kind === 'road'
            ? (geom.edgeSeg[ev.id] ? geom.edgeSeg[ev.id][0] : null)
            : geom.vertP[ev.id]) : null;
          if (bp) boardFloat(bp.x, bp.y - 30, kindName, 'f-build');
          SND.build();
          break;
        }
        case 'robber':
          ctx.robberMoved = true; ctx.robberFrom = prevRobberHex;
          addLog('robber', nameSpan(state, ev.player) + ' 将强盗移到 <b>' + escapeHTML(hexLabel(state, ev.hexId)) + '</b>',
            { kind: 'hex', id: ev.hexId });
          break;
        case 'steal': {
          if (ev.from != null && ev.from >= 0 && (ev.count || 0) > 0) {
            addLog('steal', nameSpan(state, ev.to) + ' 从 ' + nameSpan(state, ev.from) + ' 处偷取 <b>' + (ev.count || 0) + '</b> 张资源');
            panelFloat(ev.to, '+1 张', 'f-steal'); panelFloat(ev.from, '−1 张', 'f-lose'); SND.steal();
            // 偷窃动画：不显示具体资源类型——袋子从被偷者面板飞向偷者 + 被偷面板红闪
            if (fxOn) {
              var fSt = panelPointVp(ev.from), tSt = panelPointVp(ev.to);
              if (fSt && tSt) flyChip(fSt, tSt, SACK_SVG, 'f-res', 60);
              flashPanel(ev.from); bumpPanel(ev.to);
            }
          } else {
            addLog('steal', nameSpan(state, ev.to) + ' 没有偷取任何资源');
          }
          break;
        }
        case 'discard': {
          addLog('discard', nameSpan(state, ev.player) + ' 弃置 <b>' + (ev.count || 0) + '</b> 张资源');
          if (fxOn) {
            var dn = Math.min(ev.count || 0, 4);
            for (var di = 0; di < dn; di++) flyDown(SACK_SVG, di * 70);
          }
          SND.discard();
          break;
        }
        case 'largestArmy': {
          var prevArmy = badges.army;
          badges.army = ev.player;
          addLog('badge', '⚔ ' + nameSpan(state, ev.player) + ' 获得 <b>最大军队 +2 分</b>');
          panelFloat(ev.player, '最大军队 +2', 'f-badge');
          // v1.22 契约 D：称号首次获得 / 易主 → 金属徽章横幅 + 号角
          titleBanner('army', {
            state: state, taker: ev.player,
            n: ((state.players[ev.player] || {}).knightsPlayed || 0),
            from: (prevArmy != null && prevArmy !== ev.player) ? prevArmy : null
          });
          // 徽章易主：从原持有者面板飞向新持有者
          if (fxOn && prevArmy != null && prevArmy !== ev.player) {
            var pa = panelPointVp(prevArmy), na = panelPointVp(ev.player);
            if (pa && na) flyChip(pa, na, badgeIconSVG('army', 15), 'f-res f-gold', 0);
          }
          break;
        }
        case 'longestRoad': {
          badges.road = ev.player;
          // v1.20 契约 B：最长公路无单一坐标，定位引用=持有者整套路网
          addLog('badge', '🛣 ' + nameSpan(state, ev.player) + ' 获得 <b>最长公路 +2 分</b>' +
            (ev.from != null && ev.from >= 0 ? '（从 ' + nameSpan(state, ev.from) + ' 手中夺走）' : ''),
            { kind: 'roads', player: ev.player });
          panelFloat(ev.player, '最长公路 +2', 'f-badge');
          if (ev.from != null && ev.from >= 0) panelFloat(ev.from, '失去最长公路 −2', 'f-lose');
          // v1.22 契约 D：称号首次获得 / 易主 → 金属徽章横幅 + 号角
          titleBanner('road', {
            state: state, taker: ev.player,
            n: (((state.players[ev.player] || {}).roadIds) || []).length,
            from: (ev.from != null && ev.from >= 0 && ev.from !== ev.player) ? ev.from : null
          });
          if (fxOn && ev.from != null && ev.from >= 0 && ev.from !== ev.player) {
            var pr = panelPointVp(ev.from), nr = panelPointVp(ev.player);
            if (pr && nr) flyChip(pr, nr, badgeIconSVG('road', 15), 'f-res f-gold', 0);
          }
          break;
        }
        case 'devCard':
          addLog('dev', nameSpan(state, ev.player) + ' 购买了一张发展卡');
          SND.card();
          devDrawFx(ev.player);
          break;
        case 'vp':
          addLog('vp', '⭐ ' + nameSpan(state, ev.player) + ' 达到 <b>' + ev.total + ' 分</b>');
          break;
        case 'gameover':
          ctx.gameover = true;
          addLog('over', '🏆 ' + nameSpan(state, ev.winner) + ' <b>获胜！</b>');
          SND.victory();
          break;
        case 'log':
          addLog('log', escapeHTML(ev.text || ''));
          break;
      }
    }
    return ctx;
  }

  /* ==================== 面板 / 手牌 / 发展卡 / 按钮 ==================== */
  // 4 名玩家在矮窗口下会超出面板列高度，导致最后一名「看不见」。
  // 按实际可用高度逐级压缩（compact → ultra），保证 4 个面板始终全部可见。
  function fitPlayerPanels() {
    var col = dom.playersCol;
    if (!col) return;
    col.classList.remove('compact', 'ultra');
    if (col.scrollHeight <= col.clientHeight + 2) return;
    col.classList.add('compact');
    if (col.scrollHeight > col.clientHeight + 2) col.classList.add('ultra');
  }

  function renderPanels(state, opts) {
    var col = dom.playersCol;
    col.innerHTML = '';
    var actor = displayActor(state, opts);
    var selPlayers = ((opts && opts.selectable && opts.selectable.players) || []);
    var canSteal = state.phase === 'steal' && !maskActive && isHuman(state, actor) && selPlayers.length > 0;
    // v1.21 契约 B：先为每位玩家算产能点，供面板统计与「产能最高」金边判定
    var prodMap = {}, prodMax = 0;
    state.players.forEach(function (p) {
      var v = prodPipsOf(state, p.idx);
      prodMap[p.idx] = v;
      if (v > prodMax) prodMax = v;
    });
    state.players.forEach(function (p) {
      // 单个玩家面板出错不得中断整列渲染（否则后面的玩家会整块消失）
      try {
      var c = pc(p.color);
      var d = el('div', 'panel-player');
      d.style.setProperty('--pc', c.main);
      d.style.setProperty('--pc-dark', c.dark);
      d.dataset.pidx = p.idx;
      var vp = vpInfo(state, p.idx);
      var isActor = p.idx === actor && state.phase !== 'gameover';
      if (isActor) d.classList.add('active');
      if (p.idx === viewPlayer) d.classList.add('me');
      // v1.21 契约 B：产能最高者面板加细金边（并列同享；全场产能为 0 时不标注）
      if (prodMax > 0 && prodMap[p.idx] === prodMax) d.classList.add('pp-prod-top');
      if (canSteal && selPlayers.indexOf(p.idx) >= 0) {
        d.classList.add('steal-target');
        d.title = '点击偷取该玩家 1 张随机资源';
        d.addEventListener('click', function () { act({ type: 'steal', target: p.idx }); });
      }

      var head = el('div', 'pp-head');
      head.appendChild(el('span', 'pp-dot'));
      head.appendChild(el('span', 'pp-name', p.name));
      head.appendChild(el('span', 'pp-tag' + (p.isAI ? ' ai' : ''), p.isAI ? ('AI · ' + (DIFF_NAME[p.difficulty] || '普通')) : '真人'));
      var bd = el('span', 'pp-badges');
      // v1.20 遗留修复（v1.21 实测暴露）：badgeIconSVG 返回 SVG 字符串，insertBefore
      // 只接受 Node —— 原写法在徽章出现时必抛 TypeError，把持有者面板打回占位块；
      // 改用 insertAdjacentHTML 前插（contract C「徽章易主随之切换」依赖此徽章可见）
      if (badges.road === p.idx) { var b1 = el('span', 'pp-badge', '路+2'); b1.insertAdjacentHTML('afterbegin', badgeIconSVG('road')); bd.appendChild(b1); }
      if (badges.army === p.idx) { var b2 = el('span', 'pp-badge', '军+2'); b2.insertAdjacentHTML('afterbegin', badgeIconSVG('army')); bd.appendChild(b2); }
      head.appendChild(bd);
      d.appendChild(head);

      var mid = el('div', 'pp-mid');
      var sc = el('span', 'pp-score', String(vp.public));
      var scWrap = el('span', 'pp-score-wrap');
      scWrap.appendChild(el('span', 'pp-lab', '公开分'));
      scWrap.appendChild(sc);
      mid.appendChild(scWrap);
      if (p.idx === viewPlayer && vp.hidden > 0) {
        var hid = el('span', 'pp-hidden', '暗分 ' + vp.hidden);
        mid.appendChild(hid);
      }
      if (isActor) mid.appendChild(el('span', 'pp-live', '行动中'));
      d.appendChild(mid);

      var foot = el('div', 'pp-stats');
      var handN = sumRes(p.resources);
      var devN = 0;
      if (p.dev) DEV_KEYS.forEach(function (k) { devN += p.dev[k] || 0; });
      foot.appendChild(el('span', 'pp-stat', '手牌 ' + handN));
      foot.appendChild(el('span', 'pp-stat', '发展卡 ' + devN));
      // v1.21 契约 B：产能点统计（每次渲染更新；口径见 prodPipsOf 注释）
      var prodEl = el('span', 'pp-stat pp-prod', '产能 ' + (prodMap[p.idx] || 0));
      prodEl.title = '产能 = 村庄×1 + 城市×2 覆盖数字格的概率点总和（强盗所在格不计）';
      foot.appendChild(prodEl);
      if ((p.knightsPlayed || 0) > 0) foot.appendChild(el('span', 'pp-stat dim', '骑士×' + p.knightsPlayed));
      d.appendChild(foot);
      col.appendChild(d);
      } catch (e) {
        // 该玩家面板数据异常：留下占位，保证其余玩家仍可见
        if (typeof console !== 'undefined' && console.warn) console.warn('[面板] 玩家 ' + (p && p.idx) + ' 渲染失败', e);
        var ph = el('div', 'panel-player');
        ph.appendChild(el('div', 'pp-head', (p && p.name) || ('玩家' + ((p && p.idx != null ? p.idx : 0) + 1))));
        col.appendChild(ph);
      }
    });
    fitPlayerPanels();
  }

  function renderHand(state) {
    var area = dom.handArea;
    area.innerHTML = '';
    if (viewPlayer == null || !state.players[viewPlayer]) {
      area.appendChild(el('div', 'hand-placeholder', '等待玩家确认…'));
      return;
    }
    var res = state.players[viewPlayer].resources || {};
    var who = el('div', 'hand-who');
    var p = state.players[viewPlayer];
    who.appendChild(el('span', 'hand-who-dot'));
    who.appendChild(document.createTextNode((p.isAI ? '[AI] ' : '') + p.name + ' 的手牌'));
    area.appendChild(who);
    var row = el('div', 'hand-row');
    RES_KEYS.forEach(function (k) {
      var n = res[k] || 0;
      var c = el('div', 'res-card' + (n === 0 ? ' empty' : ''));
      c.style.setProperty('--c1', RES[k].c1);
      c.style.setProperty('--c2', RES[k].c2);
      c.innerHTML = resIconSVG(k, 24);
      c.appendChild(el('span', 'res-name', RES[k].name));
      c.appendChild(el('span', 'res-count', String(n)));
      c.title = RES[k].full + ' ×' + n;
      row.appendChild(c);
    });
    area.appendChild(row);
  }

  // 发展卡可打性：权威来源是 opts.playableDev（app 依 getValidActions 现算，
  // UI 不直接依赖引擎内部字段 devBoughtTypes / devPlayedThisTurn —— 四方契约）。
  // opts 缺失时的兜底只用 SPEC 契约字段（dev 数量 + devBoughtThisTurn 保守禁用）。
  function devPlayableNow(p, k, opts) {
    var have = (p.dev && p.dev[k]) || 0;
    if (have <= 0) return false;
    if (opts && opts.playableDev) return !!opts.playableDev[k];
    return !((p.devBoughtThisTurn || 0) > 0);
  }

  function renderDevs(state, opts) {
    var area = dom.devArea;
    area.innerHTML = '';
    if (viewPlayer == null || !state.players[viewPlayer]) {
      area.appendChild(el('div', 'hand-placeholder', '—'));
      return;
    }
    opts = opts || lastOpts || {};
    var p = state.players[viewPlayer];
    var dev = p.dev || {};
    var actor = displayActor(state, opts);
    // 每回合至多打出 1 张、本回合购买的不能用：均由 opts.playableDev（合法动作）表达
    var canPlay = !maskActive && state.phase === 'main' && isHuman(state, actor) && actor === viewPlayer;
    var head = el('div', 'dev-head', '发展卡');
    area.appendChild(head);
    var row = el('div', 'dev-row');
    DEV_KEYS.forEach(function (k) {
      var n = dev[k] || 0;
      var playable = DEV[k].playable && devPlayableNow(p, k, opts);
      var d = el('div', 'dev-card' + (n === 0 ? ' empty' : '') + (playable ? ' playable' : ''));
      var withBack = n > 0 && cardbackOK();
      if (withBack) {
        // 发展卡卡背：cardback.jpg（蓝金航海罗盘），末层深蓝渐变兜底（缺图自动露出）
        d.style.backgroundImage = 'url("' + ASSETS.cardback + '"), linear-gradient(#2e5382, #17334f)';
        d.style.backgroundSize = 'cover';
        d.style.backgroundPosition = 'center';
        d.style.borderColor = '#8a6f3c';
        d.innerHTML = devIconSVG(k, 22, '#f3e7c8');
      } else {
        d.innerHTML = devIconSVG(k, 22, n === 0 ? '#9b8c6d' : '#5a4626');
      }
      var nm = el('span', 'dev-name', DEV[k].name);
      var ct = el('span', 'dev-count', '×' + n);
      if (withBack) {
        var chip = 'rgba(12,22,44,0.58)';
        [nm, ct].forEach(function (sp) {
          sp.style.color = '#f6ecd2';
          sp.style.background = chip;
          sp.style.borderRadius = '6px';
          sp.style.padding = '0 5px';
          sp.style.textShadow = '0 1px 2px rgba(0,0,0,0.65)';
        });
      }
      d.appendChild(nm);
      d.appendChild(ct);
      if (k === 'vp') d.appendChild(el('span', 'dev-note', '暗分'));
      d.title = DEV[k].tip + '（持有 ' + n + ' 张）' +
        (DEV[k].playable && n > 0 && !devPlayableNow(p, k, opts) ? '（本回合购买的卡不能立即使用）' : '');
      if (canPlay && playable) {
        d.addEventListener('click', function () { onPlayDev(k); });
      } else {
        d.classList.add('dim');
      }
      row.appendChild(d);
    });
    area.appendChild(row);
  }

  function onPlayDev(kind) {
    if (kind === 'knight') {
      act({ type: 'playDevCard', card: 'knight' });
      showToast('骑士出击：点击格子放置强盗');
    } else if (kind === 'roadBuilding') {
      act({ type: 'playDevCard', card: 'roadBuilding' });
      showToast('道路修建：连续放置两条免费道路');
    } else if (kind === 'monopoly') {
      openResPick('monopoly');
    } else if (kind === 'yearOfPlenty') {
      yopPicks = [];
      openResPick('yearOfPlenty');
    }
  }

  function affordCheck(p, cost) {
    if (!p) return false;
    for (var i = 0; i < RES_KEYS.length; i++) {
      if ((cost[RES_KEYS[i]] || 0) > ((p.resources && p.resources[RES_KEYS[i]]) || 0)) return false;
    }
    return true;
  }

  // 悬浮操作簇（掷骰子 / 结束回合）启停：只在 main 阶段显示，按合法动作驱动可用性
  function updateCluster(state, opts) {
    if (!dom.cluster) return;
    var show = !!state && state.phase === 'main';
    if (opts && opts.replay) show = false; // v1.24 契约 D：回放只读——掷骰/结束回合簇隐藏
    dom.cluster.classList.toggle('hidden', !show);
    if (!show) return;
    var actor = displayActor(state, opts);
    var myTurn = isHuman(state, actor) && !maskActive;
    var who = state.players[actor] ? state.players[actor].name : '其他玩家';
    // 掷骰可用性以 app 依据 getValidActions 计算的 opts.canRoll 为准（读档/中途恢复
    // 也正确）；旧调用方未提供 canRoll 时回退到会话内 lastRollKey 标记
    var canRoll = myTurn && (opts.canRoll === undefined
      ? (lastRollKey !== (state.turnCount + ':' + state.currentPlayer))
      : !!opts.canRoll);
    var canEnd = myTurn && !!opts.canEndTurn;
    dom.rollBig.disabled = !canRoll;
    dom.rollBig.title = canRoll ? '掷两颗骰子开始回合（快捷键 Space）'
      : (myTurn ? '本回合已掷骰' : '等待【' + who + '】行动');
    dom.endBig.disabled = !canEnd;
    dom.endBig.title = canEnd ? '结束当前回合（快捷键 E）'
      : (myTurn ? '本回合还不能结束（需先掷骰 / 放完免费道路）' : '等待【' + who + '】行动');
  }

  function renderButtons(state, opts) {
    var box = dom.btnArea;
    box.innerHTML = '';
    dom.abBtns = {}; // 快捷键映射随按钮每次重建（契约 D：键鼠同源，键盘只点「同一个」按钮）
    opts = opts || {};
    updateCluster(state, opts); // 悬浮簇每渲染都要校准（含 setup/其他阶段的隐藏）
    if (opts.replay) return; // v1.24 契约 D：回放只读——操作区清空（历史步不可建造/交易/撤销）
    var actor = displayActor(state, opts);
    var myTurn = isHuman(state, actor) && !maskActive;
    var me = viewPlayer != null ? state.players[viewPlayer] : null;
    var phase = state.phase;
    var inSetup = phase === 'setup1' || phase === 'setup2';
    var inMain = phase === 'main';
    var rb = state.roadBuildingPending || 0;
    dom.rbBadge.classList.toggle('hidden', !(inMain && rb > 0));
    if (inMain && rb > 0) dom.rbBadge.textContent = '免费道路 ×' + rb;

    var COST = {
      road: { wood: 1, brick: 1 },
      settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
      city: { wheat: 2, ore: 3 },
      dev: { wheat: 1, sheep: 1, ore: 1 }
    };

    function mkBtn(cls, label, cost, onclick, enabled, title, key) {
      var b = el('button', 'ab-btn ' + cls);
      b.type = 'button';
      b.innerHTML = '<span class="ab-lab">' + label + '</span>' + (cost ? '<span class="cost">' + costHTML(cost) + '</span>' : '');
      if (title) b.title = title;
      if (key) dom.abBtns[key] = b; // 注册给快捷键（1/2/3/4/B/T/Z 与按钮同源启停）
      if (!enabled) { b.disabled = true; }
      else b.addEventListener('click', onclick);
      return b;
    }
    function modeBtn(kind, label, cost, enabled) {
      var on = opts.buildMode === kind;
      var b = mkBtn(kind + (on ? ' on' : ''), label, cost, function () {
        if (opts.buildMode === kind) act({ type: 'cancelBuild' });
        else act({ type: 'buildMode', mode: kind });
      }, enabled, null, kind);
      if (kind === 'road' && rb > 0) {
        var tag = el('span', 'free-tag', '免费×' + rb);
        b.appendChild(tag);
      }
      return b;
    }
    // v1.20 契约 A/D：撤销入口（撤栈逻辑在 app.js；这里只负责按钮呈现与键盘分发）。
    // app 权威信号 opts.undo = { canUndo, size, online }：canUndo 控禁用（栈空），
    // online 控隐藏（联机禁用并隐藏，契约 E：undo 仅单机/热座）。旧字段名兜底兼容。
    function undoBtn() {
      var u = (opts && opts.undo && typeof opts.undo === 'object') ? opts.undo : null;
      var flag = null, online = false;
      if (u) {
        if (typeof u.canUndo === 'boolean') flag = u.canUndo;
        online = !!u.online;
      } else if (opts && typeof opts.canUndo === 'boolean') flag = opts.canUndo;
      else if (opts && typeof opts.undoable === 'boolean') flag = opts.undoable;
      if (onlineSeat != null || online) return null; // 联机：隐藏
      var enabled = (flag != null) ? flag : (!maskActive && state.phase !== 'gameover');
      if (maskActive) enabled = false; // 热座遮罩未确认时不允许撤销
      return mkBtn('undo', '撤销', null, function () { act({ type: 'undo' }); },
        enabled, '撤销上一步（快捷键 Z）· 单机/热座可用，联机不可用', 'undo');
    }

    if (inSetup) {
      // 布置阶段按钮只在轮到真人（且遮罩未激活）时可点，AI 布置回合呈禁用态
      box.appendChild(modeBtn('settlement', '放置村庄', null, myTurn));
      box.appendChild(modeBtn('road', '修建道路', null, myTurn));
      var ubS = undoBtn();
      if (ubS) box.appendChild(ubS);
      return;
    }
    if (!inMain) return; // robber/steal/discard/gameover：无操作按钮（提示条驱动）

    box.appendChild(modeBtn('road', '修路', COST.road, myTurn && (rb > 0 || affordCheck(me, COST.road))));
    box.appendChild(modeBtn('settlement', '建村', COST.settlement, myTurn && affordCheck(me, COST.settlement)));
    box.appendChild(modeBtn('city', '建城', COST.city, myTurn && affordCheck(me, COST.city)));
    box.appendChild(mkBtn('dev', '买发展卡', COST.dev, function () { act({ type: 'buyDevCard' }); },
      myTurn && affordCheck(me, COST.dev), '发展卡：麦1 羊1 矿1（快捷键 4）', 'dev'));
    var hasOther = state.players.some(function (p) { return p.idx !== actor; });
    box.appendChild(mkBtn('bank', '银行交易', null, function () { openTrade('bank'); },
      myTurn, '按港口汇率与银行交换资源（快捷键 B）', 'bank'));
    box.appendChild(mkBtn('ptrade', '玩家交易', null, function () { openTrade('player'); },
      myTurn && hasOther, '向其他玩家提议交换（快捷键 T）', 'ptrade'));
    var ubM = undoBtn();
    if (ubM) box.appendChild(ubM);
  }

  /* ==================== 骰子 ==================== */
  function setDieFace(die, n) {
    die.innerHTML = '';
    die.dataset.face = n;
    var PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
    (PIPS[n] || []).forEach(function (cell) {
      var p = el('span', 'pip');
      var row = Math.ceil(cell / 3), col2 = ((cell - 1) % 3) + 1;
      p.style.gridArea = row + ' / ' + col2;
      die.appendChild(p);
    });
  }
  function renderDice(state, ctx) {
    var d = state.dice;
    if (ctx && ctx.freshRoll && d && d.length === 2) {
      var die1 = dom.die1, die2 = dom.die2;
      if (diceTimer) { clearInterval(diceTimer); diceTimer = null; }
      die1.classList.remove('rolling', 'settle'); die2.classList.remove('rolling', 'settle');
      // v1.22 契约 A：两骰 rotate3d 3D 翻滚 ~700ms（8×85ms 换面同步跳变骰面）
      // 后弹跳落定（settleBounce 200ms），全程 880ms ≤900ms 红线；
      // 音效沿用 roll 事件的 SND.dice()（此处不动）；fxOn=false 时立即摆终值（红线 E）
      if (fxOn) {
        die1.classList.add('rolling'); die2.classList.add('rolling');
        var ticks = 0;
        diceTimer = setInterval(function () {
          ticks++;
          setDieFace(die1, 1 + Math.floor(Math.random() * 6));
          setDieFace(die2, 1 + Math.floor(Math.random() * 6));
          if (ticks >= 8) { // 8 × 85ms = 680ms ≈ 700ms 翻滚
            clearInterval(diceTimer); diceTimer = null;
            die1.classList.remove('rolling'); die2.classList.remove('rolling');
            setDieFace(die1, d[0]); setDieFace(die2, d[1]);
            die1.classList.add('settle'); die2.classList.add('settle');
            setTimeout(function () { die1.classList.remove('settle'); die2.classList.remove('settle'); }, 240);
          }
        }, 85);
      }
      setDieFace(die1, d[0]); setDieFace(die2, d[1]); // 先摆终值防跳帧
      dom.diceSum.textContent = '点数 ' + (d[0] + d[1]);
      return;
    }
    if (d && d.length === 2) {
      setDieFace(dom.die1, d[0]); setDieFace(dom.die2, d[1]);
      dom.diceSum.textContent = '点数 ' + (d[0] + d[1]);
    } else {
      setDieFace(dom.die1, 0); setDieFace(dom.die2, 0);
      dom.die1.innerHTML = ''; dom.die2.innerHTML = '';
      dom.diceSum.textContent = '—';
    }
  }

  /* ==================== 提示条 / 顶栏信息 ==================== */
  // 掷 7 弃牌期：列出全部仍待弃牌的玩家与各自需弃张数（契约 C「精确到阻塞点」）
  function discardQueueText(state) {
    var q = state.discardQueue || [];
    var parts = [];
    q.forEach(function (idx) {
      var pp = state.players[idx];
      if (!pp) return;
      parts.push(pp.name + '（弃 ' + Math.floor(sumRes(pp.resources) / 2) + ' 张）');
    });
    return parts.join('、');
  }
  // 交易等待期：仍未见应答的交易对象（游标已越过或已写入 responses 的不算）
  function waitingResponders(state) {
    var pt = state.pendingTrade;
    if (!pt || !pt.targets || !pt.targets.length) return [];
    var resp = pt.responses || [];
    var cur = typeof pt.cursor === 'number' ? pt.cursor : 0;
    var out = [];
    pt.targets.forEach(function (t, i) {
      if (i < cur) return;
      var answered = resp.some(function (r) { return r && r.player === t; });
      if (!answered) out.push(t);
    });
    return out;
  }
  function renderHint(state, opts) {
    opts = opts || {};
    var actor = displayActor(state, opts);
    var p = actor >= 0 ? state.players[actor] : null;
    var who = p ? p.name : '';
    dom.phaseChip.textContent = PHASE_NAME[state.phase] || state.phase;
    dom.phaseChip.className = 'phase-chip ph-' + state.phase;
    var text = opts.hint || '';
    if (!text) {
      var pt = state.pendingTrade;
      if (pt) {
        var fromP = state.players[pt.from] || { name: '玩家' };
        text = actor === pt.from ? '等待其他玩家应答你的交易…（底部交易抽屉可查看看板）'
          : '【' + fromP.name + '】提议交易：给出 ' + fmtRes(pt.give) + '，想要 ' + fmtRes(pt.get) +
            '（在底部交易抽屉应答）';
      } else if (state.phase === 'robber') text = '点击一个格子放置强盗';
      else if (state.phase === 'steal') text = '选择要偷窃的对象';
      else if (state.phase === 'discard') text = (p ? '【' + who + '】' : '') + '需弃置 ' +
        Math.floor(sumRes(p && p.resources) / 2) + ' 张手牌';
      else if (state.phase === 'gameover') text = '游戏结束';
      else if (p && p.isAI) text = '【' + who + '】（AI）思考中…';
      else text = '轮到 ' + who;
    }
    // v1.20 契约 C：提示精确到阻塞点 —— 弃牌列出全部待弃玩家
    if (state.phase === 'discard') {
      var dq = discardQueueText(state);
      if (dq) text = '掷出 7 · 待弃牌：' + dq;
    }
    // 路修期：显示第 N/M 条（roadBuildingPending = 还可放的免费路数，卡面共 2 条）
    if (state.phase === 'main' && (state.roadBuildingPending || 0) > 0 &&
        isHuman(state, actor) && !maskActive) {
      var rbN = state.roadBuildingPending || 0;
      var nth = clamp(2 - rbN + 1, 1, 2);
      text = '路修卡生效：免费修路第 ' + nth + '/2 条（还可放 ' + rbN + ' 条）' +
        (opts.buildMode === 'road' ? '，点击高亮边放置' : '，按 1 或点「修路」开始');
    }
    // 交易等待期：点出等待应答的对象（行动者本人恰为唯一应答者时不重复点）
    var waiters = waitingResponders(state);
    if (waiters.length && !(waiters.length === 1 && waiters[0] === actor)) {
      var wNames = waiters.map(function (t) {
        var wp = state.players[t];
        return wp ? wp.name + (t === viewPlayer ? '（你）' : '') : '玩家';
      });
      text += ' · 待应答：' + wNames.join('、');
    }
    dom.hintText.textContent = text;
    // v1.20 契约 C：顶栏底色/左边框随当前行动玩家颜色平滑过渡（0.4s 过渡在 CSS）。
    // 背景走 background-color（可过渡）；羊皮纸明暗由 background-image 半透明渐变叠加，
    // 玩家色调和比例 0.30，保证四色（含白方）下顶栏文字仍可读。
    if (dom.topbar) {
      var ac = (p && state.phase !== 'gameover') ? pc(p.color) : null;
      if (ac) {
        dom.topbar.style.backgroundColor = mixHex('#2c1e10', ac.main, 0.30);
        dom.topbar.style.borderLeftColor = ac.main;
      } else {
        dom.topbar.style.backgroundColor = '';
        dom.topbar.style.borderLeftColor = '';
      }
    }
    var turnSuffix = '';
    if (p && state.phase !== 'gameover') {
      var ptNow = state.pendingTrade;
      var responderNow = (ptNow && ptNow.targets && typeof ptNow.cursor === 'number' &&
        ptNow.cursor >= 0 && ptNow.cursor < ptNow.targets.length) ? ptNow.targets[ptNow.cursor] : null;
      if (responderNow != null && responderNow === actor && responderNow !== ptNow.from) {
        // 等待交易应答：实际行动内容是「应答」，不应标成「行动中」误导
        var fromNow = state.players[ptNow.from];
        turnSuffix = responderNow != null && state.players[responderNow] && state.players[responderNow].isAI
          ? ' · 等待【' + state.players[responderNow].name + '】应答【' + (fromNow ? fromNow.name : '') + '】的交易'
          : ' · 等待你应答【' + (fromNow ? fromNow.name : '') + '】的交易';
      } else {
        turnSuffix = ' · ' + who + (p.isAI ? '（AI）' : '') + ' 行动中';
      }
    }
    dom.turnInfo.textContent = '第 ' + state.turnCount + ' 回合' + turnSuffix;
    // 地图类型徽标：让「随机/固定」一眼可见，避免误以为地图永远不变
    var mapChip = byId('uiMapChip');
    if (mapChip) {
      var isRandom = !!(state.config && state.config.randomBoard);
      mapChip.textContent = isRandom ? '随机地图' : '固定地图';
      mapChip.className = 'map-chip' + (isRandom ? ' on' : '');
      mapChip.title = isRandom
        ? '本局地图为随机生成（每局不同）'
        : '本局为经典固定地图（设置页勾选「随机地图」可每局不同）';
    }
  }

  /* ==================== 弹窗 ==================== */
  function closeModal() { dom.stickyRoot.innerHTML = ''; }
  function modalShell(title, bodyEl, footEl, small) {
    var ov = el('div', 'modal-overlay');
    var m = el('div', 'modal' + (small ? ' modal-sm' : ''));
    var t = el('div', 'modal-title', title);
    m.appendChild(t);
    m.appendChild(bodyEl);
    if (footEl) m.appendChild(footEl);
    ov.appendChild(m);
    return ov;
  }
  function resPickGrid(onPick, selected) {
    var grid = el('div', 'res-pick-grid');
    RES_KEYS.forEach(function (k) {
      var b = el('button', 'res-pick' + (selected === k ? ' sel' : ''));
      b.type = 'button';
      b.style.setProperty('--c1', RES[k].c1);
      b.style.setProperty('--c2', RES[k].c2);
      b.innerHTML = resIconSVG(k, 26) + '<span>' + RES[k].full + '</span>';
      b.addEventListener('click', function () { onPick(k); });
      grid.appendChild(b);
    });
    return grid;
  }

  // 垄断 / 丰收选资源（粘性弹窗，AI 渲染不打断）
  function openResPick(card) {
    var state = lastState;
    if (!state) return;
    var isYop = card === 'yearOfPlenty';
    yopPicks = isYop ? (yopPicks || []) : [];
    var body = el('div', 'modal-body');
    var tip = el('div', 'modal-tip', isYop ? '丰收：依次选择两种资源（可重复同一种）' : '垄断：选择一种资源，拿走所有玩家手中的该资源');
    var step = el('div', 'yop-step');
    body.appendChild(tip);
    if (isYop) body.appendChild(step);
    var grid = resPickGrid(function (k) {
      if (isYop) {
        yopPicks.push(k);
        if (yopPicks.length >= 2) {
          closeModal();
          act({ type: 'playDevCard', card: 'yearOfPlenty', r1: yopPicks[0], r2: yopPicks[1] });
          yopPicks = [];
        } else {
          openResPick(card); // 刷新显示第一步已选
        }
      } else {
        closeModal();
        act({ type: 'playDevCard', card: 'monopoly', resource: k });
      }
    });
    body.appendChild(grid);
    if (isYop) {
      step.textContent = yopPicks.length === 0 ? '第 1 步 / 共 2 步'
        : '第 2 步（已选 ' + RES[yopPicks[0]].full + '）';
    }
    var foot = el('div', 'modal-foot');
    var cancel = el('button', 'btn btn-ghost', '取消');
    cancel.addEventListener('click', function () { yopPicks = []; closeModal(); });
    foot.appendChild(cancel);
    dom.stickyRoot.innerHTML = '';
    dom.stickyRoot.appendChild(modalShell(isYop ? '发展卡 · 丰收' : '发展卡 · 垄断', body, foot, true));
  }

  /* ==================== 交易抽屉（v1.19：底部停靠，不遮挡棋盘） ====================
   * 契约要点：
   *   - 三种视图按状态自动切换：compose（发起：银行/玩家页签）、
   *     board（我发起后的应答看板，读 pendingTrade.responses）、respond（轮到我应答）。
   *   - 关闭以动作成功为前提：提交不先收抽屉；单机用「状态指纹前后对比」判定成败，
   *     失败时错误写进抽屉错误条且保留已填内容（App 侧会同时 toast）。
   *   - Esc/× 只收起抽屉；收起后若交易仍在进行，挂出重开 pill，绝不困住玩家。
   */
  // —— 入口（沿用「银行交易 / 玩家交易」按钮）——
  function openTrade(tab) {
    var state = lastState;
    if (!state || state.phase === 'gameover' || viewPlayer == null) return;
    tdTab = tab === 'player' ? 'player' : 'bank';
    tdOpen = true;
    clearTradeErr();
    ensureTradeDraft(state);
    renderTradeDrawer(state, lastOpts || {});
  }

  function tdResClone(res) {
    var o = {};
    RES_KEYS.forEach(function (k) { o[k] = (res && res[k]) || 0; });
    return o;
  }
  function tdPtKeyOf(pt) {
    return JSON.stringify([pt.from, pt.give, pt.get, pt.targets, pt.depth || 0]);
  }
  function tradeTurnKey(state) {
    return [state.turnCount, state.currentPlayer, viewPlayer].join(':');
  }
  // 各资源实际汇率（C3 权威来源 CatanCore.portRatesFor：2:1 专属港 > 3:1 任意港 > 4:1）；
  // 引擎对象缺失时（node 冒烟/旧引擎）用 portFlags 兜底
  function tradeRates(state, idx) {
    var C = (typeof CatanCore !== 'undefined') ? CatanCore : (typeof window !== 'undefined' ? window.CatanCore : null);
    if (C && typeof C.portRatesFor === 'function') {
      try { var r = C.portRatesFor(state, idx); if (r) return r; } catch (e) { /* 落到兜底 */ }
    }
    var me = state.players[idx] || {};
    var out = {};
    RES_KEYS.forEach(function (k) {
      out[k] = (me.portFlags && me.portFlags[k]) ? 2 : ((me.portFlags && me.portFlags.any) ? 3 : 4);
    });
    return out;
  }
  // 抽屉视图路由：compose=我的主回合发起；board=我发起后等待应答；
  // respond=轮到真人应答；other=交易在他人处（含热座遮罩未确认时）
  function tradeViewOf(state, opts) {
    var pt = state.pendingTrade;
    if (!pt || !pt.targets || !pt.targets.length) {
      var actor = displayActor(state, opts);
      var myTurn = state.phase === 'main' && isHuman(state, actor) && !maskActive;
      return myTurn ? 'compose' : 'other';
    }
    var responder = (typeof pt.cursor === 'number' && pt.cursor >= 0 && pt.cursor < pt.targets.length)
      ? pt.targets[pt.cursor] : null;
    if (responder != null && state.players[responder] && isHuman(state, responder)) {
      return maskActive ? 'other' : 'respond'; // 热座先过遮罩确认，再进应答视图
    }
    if (pt.from === viewPlayer) return 'board';
    return 'other';
  }
  // 状态指纹：pendingTrade + 我的手牌。动作前后一致 ⇒ 引擎拒绝（单机同步判定）
  function tradeFp(state) {
    if (!state) return '';
    var mine = (viewPlayer != null && state.players[viewPlayer]) ? state.players[viewPlayer].resources : null;
    return [state.phase, state.currentPlayer,
      JSON.stringify(state.pendingTrade || null), JSON.stringify(mine || null)].join('|');
  }
  // 提交交易类动作：不预先关抽屉；失败把错误留在抽屉错误条并保留全部输入
  function submitTradeAction(action, failMsg) {
    var before = tradeFp(lastState);
    act(action);
    // 联机下动作异步生效（服务器回包后才渲染），无法同步判定，交由服务器校验
    if (onlineSeat != null) { clearTradeErr(); return true; }
    if (lastState && tradeFp(lastState) === before) {
      showTradeErr(failMsg || '交易未生效，请检查后重试');
      return false;
    }
    clearTradeErr();
    return true;
  }
  function showTradeErr(msg) {
    tdErr = msg || '';
    if (dom.tradeErr) {
      dom.tradeErr.textContent = tdErr;
      dom.tradeErr.classList.toggle('hidden', !tdErr);
    }
  }
  function clearTradeErr() { showTradeErr(''); }
  // 联机拒绝回调口（C7 三模式一致）：app 收到服务器对交易动作的拒绝时，把中文
  // 原因写进抽屉内错误条。错误条是抽屉外壳的常驻节点，抽屉收起时仅记忆、
  // 重开抽屉仍可见；由用户改选/换页/再次提交或挂单更替时清除
  function showTradeDrawerError(msg) {
    showTradeErr(msg || '');
  }
  function resetTradeDraft() {
    tdBank = { giveK: null, getK: null };
    tdGive = {}; tdGet = {}; tdTargets = [];
    tdCounter = null; tdDraftReady = false;
    clearTradeErr(); // 上一回合/上一局的错误条不留到新草稿
  }
  function ensureTradeDraft(state) {
    if (tdDraftReady) return;
    RES_KEYS.forEach(function (k) { tdGive[k] = 0; tdGet[k] = 0; });
    tdTargets = [];
    (state.players || []).forEach(function (p) { if (p.idx !== viewPlayer) tdTargets.push(p.idx); });
    if (tdTargets.length > 3) tdTargets = tdTargets.slice(0, 3); // 引擎限 1~3 名对象
    tdDraftReady = true;
  }
  function pillText(view) {
    return view === 'respond' ? '🔔 有一笔交易等待你应答 · 点击处理' : '🔄 交易应答进行中 · 点击查看看板';
  }
  function setTradePill(text) {
    if (!dom.tradePill) return;
    if (!text) { dom.tradePill.classList.add('hidden'); dom.tradePill.textContent = ''; return; }
    dom.tradePill.textContent = text;
    dom.tradePill.classList.remove('hidden');
  }
  // 收起抽屉（×/Esc/状态驱动共用）；fromUser=true 时按最新状态刷新 pill
  function closeTradeDrawer(fromUser) {
    tdOpen = false;
    clearTradeErr();
    if (!dom.tradeDrawer) return;
    dom.tradeDrawer.classList.add('hidden');
    if (fromUser && lastState) renderTradeDrawer(lastState, lastOpts || {});
    else setTradePill('');
  }

  // 每步 render 都会调用：派生视图 → 自动显隐 → 重建内容（草稿在模块变量里，不丢输入）
  function renderTradeDrawer(state, opts) {
    if (!dom.tradeDrawer) return;
    if (opts && opts.replay) { // v1.24 契约 D：回放只读——交易抽屉收起、不弹应答视图
      tdOpen = false; tdLastView = 'none'; tdPtKey = null;
      showTradeErr(''); setTradePill('');
      dom.tradeDrawer.classList.add('hidden');
      return;
    }
    if (!state || state.phase === 'gameover' || viewPlayer == null) {
      tdOpen = false; tdLastView = 'none'; tdPtKey = null;
      showTradeErr(''); setTradePill('');
      dom.tradeDrawer.classList.add('hidden');
      return;
    }
    opts = opts || {};
    var view = tradeViewOf(state, opts);
    var tkey = tradeTurnKey(state);
    if (view === 'compose' && tkey !== tdTurnKey) {
      tdOpen = false; resetTradeDraft(); // 回合已切换：收起并清上一回合草稿
    }
    tdTurnKey = tkey;
    var pt = state.pendingTrade;
    var key = pt ? tdPtKeyOf(pt) : null;
    if (key !== tdPtKey) {
      tdPtKey = key;
      tdCounter = null;      // 报价被替换（含还价生效）：还价编辑态随之作废
      clearTradeErr();
    }
    if (view === 'respond' && tdLastView !== 'respond' && !tdOpen) tdOpen = true; // 轮到应答自动弹出
    if (view === 'other') tdOpen = false; // 交易进入他人处理阶段：收起（提示条/横幅驱动）
    tdLastView = view;
    dom.tradeDrawer.classList.toggle('hidden', !tdOpen);
    setTradePill(!tdOpen && (view === 'respond' || view === 'board') ? pillText(view) : '');
    if (!tdOpen) return;
    buildTradeDrawerContent(state, view, pt);
  }

  function buildTradeDrawerContent(state, view, pt) {
    if (view === 'respond') { buildRespondView(state, pt); return; }
    if (view === 'board') { buildBoardView(state, pt); return; }
    buildHead('交易', true);
    var pane = el('div', 'trade-pane');
    dom.tradeBody.innerHTML = '';
    dom.tradeBody.appendChild(pane);
    ensureTradeDraft(state);
    if (tdTab === 'player') buildPlayerPane(state, pane);
    else buildBankPane(state, pane);
  }

  // 抽屉头部：标题 + （发起视图才有的）页签 + 右上 ×（C1/C2）
  function buildHead(title, showTabs) {
    var head = dom.tradeHead;
    head.innerHTML = '';
    head.appendChild(el('span', 'td-title', title));
    var tabs = el('span', 'td-tabs');
    if (showTabs) {
      var bankTab = el('button', 'trade-tab' + (tdTab !== 'player' ? ' on' : ''), '银行 / 港口');
      var playerTab = el('button', 'trade-tab' + (tdTab === 'player' ? ' on' : ''), '玩家交易');
      bankTab.type = 'button'; playerTab.type = 'button';
      bankTab.addEventListener('click', function () {
        if (tdTab !== 'bank') { tdTab = 'bank'; clearTradeErr(); renderTradeDrawer(lastState, lastOpts || {}); }
      });
      playerTab.addEventListener('click', function () {
        if (tdTab !== 'player') { tdTab = 'player'; clearTradeErr(); renderTradeDrawer(lastState, lastOpts || {}); }
      });
      tabs.appendChild(bankTab); tabs.appendChild(playerTab);
    }
    head.appendChild(tabs);

    x.title = '收起抽屉（Esc）';
    x.addEventListener('click', function () { closeTradeDrawer(true); });

  }
  function closeBtn() {
    var c = el('button', 'btn btn-ghost', '收起');

  }

  // —— 银行/港口页（C3：⚡ 一键配平）——
  function buildBankPane(state, pane) {
    var me = state.players[viewPlayer];
    var rates = tradeRates(state, viewPlayer);
    var rateNote = el('div', 'rate-note');
    var gridG = resPickGrid(function (k) { tdBank.giveK = k; clearTradeErr(); refresh(); }, null);
    var gridT = el('div', 'trade-arrow');
    gridT.innerHTML = '<svg width="34" height="22" viewBox="0 0 34 22"><path d="M3 7 H24 M20 2 L26 7 L20 12" stroke="#8a6f3c" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M31 15 H10 M14 10 L8 15 L14 20" stroke="#b0904f" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
    var gridV = resPickGrid(function (k) { tdBank.getK = k; clearTradeErr(); refresh(); }, null);
    var rowG = el('div', 'trade-side');
    rowG.appendChild(el('div', 'trade-side-lab', '给出'));
    rowG.appendChild(gridG);
    var rowV = el('div', 'trade-side');
    rowV.appendChild(el('div', 'trade-side-lab', '要得'));
    rowV.appendChild(gridV);
    pane.appendChild(rowG); pane.appendChild(gridT); pane.appendChild(rowV);
    var balanceRow = el('div', 'td-balance-row');
    var balanceBtn = el('button', 'btn btn-ghost td-balance', '⚡ 一键配平');
    balanceBtn.type = 'button';
    balanceBtn.title = '按最优港口汇率从手牌自动选出付出的资源';
    balanceBtn.addEventListener('click', autoBalance);
    balanceRow.appendChild(balanceBtn);
    pane.appendChild(balanceRow);
    pane.appendChild(rateNote);
    var confirmB = el('button', 'btn btn-primary', '确认交易');
    var foot = el('div', 'modal-foot');
    foot.appendChild(confirmB);
    foot.appendChild(closeBtn());
    pane.appendChild(foot);
    // C3：选定「要得」后自动给出最优解——最优汇率优先，其次付出持有最多的，
    // 再按单份价值最低（UI 启发式）；手牌不足时在抽屉内错误条提示
    function autoBalance() {
      var gk = tdBank.getK;
      if (!gk) return;
      var cand = [];
      RES_KEYS.forEach(function (k) {
        if (k === gk) return;
        if (((me.resources && me.resources[k]) || 0) >= (rates[k] || 4)) cand.push(k);
      });
      if (!cand.length) {
        showTradeErr('手牌不足：没有资源够按最优汇率支付（需要 ' + RES[gk].full + ' 以外的资源）');
        return;
      }
      cand.sort(function (a, b) {
        var d = (rates[a] || 4) - (rates[b] || 4);              // 汇率最优（2:1 > 3:1 > 4:1）
        if (d) return d;
        d = ((me.resources[b] || 0) - (me.resources[a] || 0));   // 付出持有最多的
        if (d) return d;
        return (RES_VALUE_UI[a] || 1) - (RES_VALUE_UI[b] || 1);  // 单份价值最低
      });
      tdBank.giveK = cand[0];
      clearTradeErr();
      refresh();
    }
    function refresh() {
      Array.prototype.forEach.call(gridG.children, function (b, i) {
        var k = RES_KEYS[i];
        b.classList.toggle('sel', k === tdBank.giveK);
        var n = (me.resources && me.resources[k]) || 0, r = rates[k] || 4;
        b.classList.toggle('lack', n < r);
        b.title = '持有 ' + n + ' · 汇率 ' + r + ':1';
      });
      Array.prototype.forEach.call(gridV.children, function (b, i) {
        b.classList.toggle('sel', RES_KEYS[i] === tdBank.getK);
        b.classList.toggle('lack', tdBank.getK != null && RES_KEYS[i] === tdBank.giveK);
      });
      balanceRow.classList.toggle('hidden', tdBank.getK == null);
      if (tdBank.giveK && tdBank.getK) {
        var r = rates[tdBank.giveK] || 4;
        rateNote.innerHTML = '汇率：<b>' + r + ' : 1</b>' + (r === 2 ? '（' + RES[tdBank.giveK].full + '专属港口）' : r === 3 ? '（任意 3:1 港口）' : '（无港口基础汇率）');
        confirmB.disabled = !(tdBank.giveK !== tdBank.getK && ((me.resources && me.resources[tdBank.giveK]) || 0) >= r);
      } else {
        rateNote.textContent = tdBank.getK ? '点击「⚡ 一键配平」自动选出付出的资源，或手动选择'
          : '依次选择给出的资源与要得的资源';
        confirmB.disabled = true;
      }
    }
    confirmB.addEventListener('click', function () {
      var gk = tdBank.giveK, tk = tdBank.getK;
      if (!gk || !tk || gk === tk) return;
      // 与引擎 doBankTrade 对齐的前置校验：精确错误就地显示，而不是等引擎笼统拒绝
      if (state.dice == null) { showTradeErr('请先掷骰，再与银行交易'); return; }
      if ((state.roadBuildingPending || 0) > 0) { showTradeErr('请先放置免费道路，再与银行交易'); return; }
      var r = rates[gk] || 4;
      var have = (me.resources && me.resources[gk]) || 0;
      if (have < r) { showTradeErr('手牌不足：需付出 ' + r + ' 张' + RES[gk].full + '（持有 ' + have + ' 张）'); return; }
      var give = {}, get = {};
      give[gk] = r; get[tk] = 1;
      submitTradeAction({ type: 'bankTrade', give: give, get: get }, '交易未生效：请检查手牌与汇率后重试');
    });
    refresh();
  }

  // —— 玩家交易页（C4 前半：给出/要得行 + 目标多选；提交后看板接管）——
  function buildPlayerPane(state, pane) {
    var me = state.players[viewPlayer];
    var hand = me.resources || {};
    var steppers = function (obj, lab, isGive) {
      var box = el('div', 'trade-side');

      RES_KEYS.forEach(function (k) {
        var line = el('div', 'stp-line');

        var plus = el('button', 'step-btn', '+'); plus.type = 'button';
        var cap = isGive ? Math.min(9, hand[k] || 0) : 9;
        var sync = function () {
          num.textContent = String(obj[k] || 0);
          plus.disabled = (obj[k] || 0) >= cap;

          line.classList.toggle('over', isGive && (obj[k] || 0) > (hand[k] || 0));
          validate();
        };
        minus.addEventListener('click', function () { obj[k] = Math.max(0, (obj[k] || 0) - 1); sync(); });
        plus.addEventListener('click', function () { if ((obj[k] || 0) < cap) { obj[k] = (obj[k] || 0) + 1; sync(); } });
        line.appendChild(minus); line.appendChild(num); line.appendChild(plus);
        box.appendChild(line);
      });
      return box;
    };
    var wrap2 = el('div', 'trade-two');
    wrap2.appendChild(steppers(tdGive, '你想给出', true));
    wrap2.appendChild(steppers(tdGet, '你想得到', false));
    pane.appendChild(wrap2);

    var tList = el('div', 'target-list');
    state.players.forEach(function (p) {

      chip.addEventListener('click', function () {
        var i = tdTargets.indexOf(p.idx);

    pane.appendChild(tList);
    pane.appendChild(el('div', 'modal-tip', '对方可接受、拒绝或还价；还价后你只能接受或拒绝'));
    var confirm2 = el('button', 'btn btn-primary', '发出提议');
    function validate() {
      var ok = tdTargets.length >= 1 && tdTargets.length <= 3;
      var any = false, enough = true;
      RES_KEYS.forEach(function (k) {
        if (tdGive[k] > 0 || tdGet[k] > 0) any = true;
        if (tdGive[k] > (hand[k] || 0)) enough = false;
      });
      confirm2.disabled = !(ok && any && enough);
    }
    confirm2.addEventListener('click', function () {
      if (confirm2.disabled) return;
      if (state.dice == null) { showTradeErr('请先掷骰，再发起交易'); return; }
      if ((state.roadBuildingPending || 0) > 0) { showTradeErr('请先放置免费道路，再发起交易'); return; }
      var gv = {}, gt = {};
      RES_KEYS.forEach(function (k) { if (tdGive[k] > 0) gv[k] = tdGive[k]; if (tdGet[k] > 0) gt[k] = tdGet[k]; });
      // 成功后抽屉切到应答看板；草稿保留，被拒绝后可直接微调再发（错了能改）
      submitTradeAction({ type: 'offerTrade', give: gv, get: gt, targets: tdTargets.slice() },
        '提议未生效：请检查交易内容后重试');
    });
    var foot = el('div', 'modal-foot');
    foot.appendChild(confirm2);
    foot.appendChild(closeBtn());
    pane.appendChild(foot);
    validate();

  // —— 应答看板（C4 后半：每个目标一行实时徽标，数据读 pendingTrade.responses）——

  // —— 应答视图（C5/C6）：拒绝 / 接受 / 还价（还价内嵌编辑器，depth===1 不出现）——

        tdCounter = { give: tdResClone(pt.get), get: tdResClone(pt.give) };
