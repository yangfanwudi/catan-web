  // 还价编辑器：提交 respondTrade{ accept:false, counter:{give,get} }（联机原样透传，C8）
  function buildCounterEditor(state, me, parent) {
    var wrap = el('div', 'td-counter');
    wrap.appendChild(el('div', 'trade-side-lab', '你的还价（我给出 ⇄ 我想换回）'));
    var two = el('div', 'trade-two');
    var miniSteppers = function (obj, lab, isGive) {
      var box = el('div', 'trade-side');
      box.appendChild(el('div', 'trade-side-lab', lab));
      RES_KEYS.forEach(function (k) {
        var line = el('div', 'stp-line');
        line.innerHTML = '<span class="stp-ic">' + resIconSVG(k, 17) + '</span>';
        var minus = el('button', 'step-btn', '−'); minus.type = 'button';
        var num = el('span', 'step-num', String(obj[k] || 0));
        var plus = el('button', 'step-btn', '+'); plus.type = 'button';
        // 仅「我给出」侧按手牌封顶（付出受引擎校验约束）；「我想换回」可索要
        // 自己没有的资源，上限 9（与发起页 buildPlayerPane 的 steppers 口径一致）
        var cap = isGive ? Math.min(9, (me.resources && me.resources[k]) || 0) : 9;
        var sync = function () {
          num.textContent = String(obj[k] || 0);
          plus.disabled = (obj[k] || 0) >= cap;
          minus.disabled = !((obj[k] || 0) > 0);
          line.classList.toggle('over', isGive && (obj[k] || 0) > ((me.resources && me.resources[k]) || 0));
        };
        minus.addEventListener('click', function () { obj[k] = Math.max(0, (obj[k] || 0) - 1); sync(); });
        plus.addEventListener('click', function () { if ((obj[k] || 0) < cap) { obj[k] = (obj[k] || 0) + 1; sync(); } });
        sync();
        line.appendChild(minus); line.appendChild(num); line.appendChild(plus);
        box.appendChild(line);
      });
      return box;
    };
    two.appendChild(miniSteppers(tdCounter.give, '我给出', true));
    two.appendChild(miniSteppers(tdCounter.get, '我想换回', false));
    wrap.appendChild(two);
    var cfoot = el('div', 'modal-foot');
    var sub = el('button', 'btn btn-primary', '提交还价');
    var cancel = el('button', 'btn btn-ghost', '取消');
    sub.addEventListener('click', function () { submitCounter(me); });
    cancel.addEventListener('click', function () {
      tdCounter = null;
      renderTradeDrawer(lastState, lastOpts || {});
    });
    cfoot.appendChild(sub); cfoot.appendChild(cancel);
    wrap.appendChild(cfoot);
    parent.appendChild(wrap);
  }
  // 与引擎还价校验（契约 A5）对齐的前置检查：give 总量≥1 且付得起、get 总量≥1、
  // 不得与 give 等价（总量相等且各资源数量完全相同）
  function submitCounter(me) {
    var g = tdCounter ? tdCounter.give : null;
    var t = tdCounter ? tdCounter.get : null;
    if (!g || !t) return;
    var gT = sumRes(g), tT = sumRes(t);
    if (gT < 1) { showTradeErr('还价至少要给出 1 张资源'); return; }
    if (tT < 1) { showTradeErr('还价至少要换取 1 张资源'); return; }
    var over = null;
    RES_KEYS.forEach(function (k) {
      if ((g[k] || 0) > ((me.resources && me.resources[k]) || 0)) over = k;
    });
    if (over) {
      showTradeErr('手牌不足：无法付出 ' + (g[over] || 0) + ' 张' + RES[over].full +
        '（持有 ' + ((me.resources && me.resources[over]) || 0) + ' 张）');
      return;
    }
    if (gT === tT && RES_KEYS.every(function (k) { return (g[k] || 0) === (t[k] || 0); })) {
      showTradeErr('还价与原报价等价，请调整数量后再提交');
      return;
    }
    var gv = {}, gt = {};
    RES_KEYS.forEach(function (k) { if (g[k] > 0) gv[k] = g[k]; if (t[k] > 0) gt[k] = t[k]; });
    submitTradeAction({ type: 'respondTrade', accept: false, counter: { give: gv, get: gt } },
      '还价未生效：请调整后重试');
  }

  /* ---- 瞬态弹窗（每次渲染随状态重建） ---- */
  function renderModals(state, opts) {
    dom.transientRoot.innerHTML = '';
    if (opts && opts.replay) return; // v1.24 契约 D：回放只读——历史步不弹弃牌/偷窃窗
    if (maskActive || !state) return;
    opts = opts || {};
    var actor = displayActor(state, opts);
    var pt = state.pendingTrade;

    // 交易应答：真人应答交互已整体迁至底部交易抽屉（v1.19 renderTradeDrawer）；
    // 此处只保留「AI 应答中」的等待横幅，抽屉收起时也有可见反馈
    if (pt && pt.targets && pt.targets.length && typeof pt.cursor === 'number' &&
      pt.cursor >= 0 && pt.cursor < pt.targets.length) {
      var responder = pt.targets[pt.cursor];
      var rp = state.players[responder];
      if (rp && !rp.isAI) return; // 热座/联机的真人应答在抽屉中完成
      // AI 应答中：等待横幅
      var wait = el('div', 'wait-banner');
      wait.innerHTML = '<span class="spin"></span>等待【' + escapeHTML(rp ? rp.name : '') + '】应答交易…（给出 ' +
        fmtRes(pt.give) + ' ⇄ 想要 ' + fmtRes(pt.get) + '）';
      dom.transientRoot.appendChild(wait);
      return;
    }

    // 弃牌
    if (state.phase === 'discard' && actor >= 0 && isHuman(state, actor) && actor === (state.discardQueue || [])[0]) {
      openDiscardModal(state, actor);
      return;
    }

    // 偷窃
    if (state.phase === 'steal' && isHuman(state, actor)) {
      var targets = (opts.selectable && opts.selectable.players) || [];
      if (targets.length) {
        var body2 = el('div', 'modal-body');
        body2.appendChild(el('div', 'modal-tip', '点击一名对手，随机偷取其 1 张资源'));
        var grid = el('div', 'steal-grid');
        targets.forEach(function (tidx) {
          var p = state.players[tidx];
          if (!p) return;
          var b = el('button', 'steal-chip');
          b.type = 'button';
          b.style.setProperty('--pc', pc(p.color).main);
          b.innerHTML = '<span class="steal-dot"></span>' + escapeHTML(p.name) + '<small>' + sumRes(p.resources) + ' 张</small>';
          b.addEventListener('click', function () { dom.transientRoot.innerHTML = ''; act({ type: 'steal', target: tidx }); });
          grid.appendChild(b);
        });
        body2.appendChild(grid);
        // 引擎在存在可偷目标时拒绝 steal{-1}（「存在可偷窃的玩家，必须选择目标」），
        // 故不渲染「不偷」按钮；无可偷目标时不弹此窗（app 会在 600ms 后自动 steal{-1}）
        dom.transientRoot.appendChild(modalShell('偷窃 · 选择对象', body2, null, true));
      }
      // 无目标：app 会在 600ms 后自动 steal{-1}，这里只提示
  }
  }

  function openDiscardModal(state, pidx) {
    var p = state.players[pidx];
    if (!p) return;
    var total = sumRes(p.resources);
    var need = Math.floor(total / 2);
    if (discardSel.player !== pidx || discardSel.need !== need) {
      discardSel = { player: pidx, cards: {}, need: need };
      RES_KEYS.forEach(function (k) { discardSel.cards[k] = 0; });
    }
    var selN = 0;
    RES_KEYS.forEach(function (k) { selN += discardSel.cards[k] || 0; });

    var body = el('div', 'modal-body');
    var tip = el('div', 'modal-tip');
    body.appendChild(tip);
    var grid = el('div', 'discard-hand');
    var cardsDom = {};
    RES_KEYS.forEach(function (k) {
      var have = (p.resources && p.resources[k]) || 0;
      if (have <= 0) return;
      var c = el('button', 'dc-card');
      c.type = 'button';
      c.style.setProperty('--c1', RES[k].c1);
      c.style.setProperty('--c2', RES[k].c2);
      c.innerHTML = resIconSVG(k, 26) + '<span class="dc-name">' + RES[k].full + '</span>' +
        '<span class="dc-n"></span><span class="dc-minus" role="button" aria-label="取消一张">−</span>';
      var numEl = c.querySelector('.dc-n');
      var minusEl = c.querySelector('.dc-minus');
      cardsDom[k] = { el: c, num: numEl, minus: minusEl, have: have };
      c.addEventListener('click', function () { add(k); });
      minusEl.addEventListener('click', function (ev) { ev.stopPropagation(); remove(k); });
      grid.appendChild(c);
    });
    body.appendChild(grid);
    var foot = el('div', 'modal-foot');
    var ok = el('button', 'btn btn-primary', '确认弃牌');
    ok.disabled = true;

    function selCount() {
      var n = 0;
      RES_KEYS.forEach(function (k) { n += discardSel.cards[k] || 0; });
      return n;
    }
    function update() {
      var selN = selCount();
      tip.innerHTML = '手牌 ' + total + ' 张超过上限 7，请弃置 <b>' + need + '</b> 张（已选 ' + selN + ' / ' + need + '）';
      RES_KEYS.forEach(function (k) {
        var d = cardsDom[k];
        if (!d) return;
        var picked = discardSel.cards[k] || 0;
        d.el.classList.toggle('sel', picked > 0);
        d.el.classList.toggle('max', picked >= d.have);
        d.num.textContent = (picked > 0 ? picked + ' / ' : '') + d.have;
        d.minus.setAttribute('aria-hidden', picked > 0 ? 'false' : 'true');
      });
      ok.disabled = selN !== need;
    }
    function add(k) {
      var d = cardsDom[k];
      if (!d) return;
      var cur = discardSel.cards[k] || 0;
      if (cur >= d.have) return;
      if (selCount() >= need) { showToast('已达需弃张数'); return; }
      discardSel.cards[k] = cur + 1;
      update();
    }
    function remove(k) {
      var cur = discardSel.cards[k] || 0;
      if (cur <= 0) return;
      discardSel.cards[k] = cur - 1;
      update();
    }
    update();
    ok.addEventListener('click', function () {
      var cards = {};
      RES_KEYS.forEach(function (k) { if (discardSel.cards[k] > 0) cards[k] = discardSel.cards[k]; });
      dom.transientRoot.innerHTML = '';
      discardSel = { player: null, cards: {}, need: 0 };
      act({ type: 'discard', cards: cards });
    });
    foot.appendChild(ok);
    body.appendChild(foot);
    dom.transientRoot.innerHTML = '';
    dom.transientRoot.appendChild(modalShell('弃牌 · ' + p.name, body, null));
  }

  /* ==================== 热座遮罩 ==================== */
  function updateMask(state, opts) {
    // 联机模式没有热座（每人一台设备），遮罩始终隐藏
    if (onlineSeat != null) {
      maskActive = false; viewPlayer = onlineSeat;
      if (dom.mask) dom.mask.classList.add('hidden');
      return;
    }
    // v1.24 契约 D：时光机回放只读——热座遮罩一律隐藏（历史步不弹「开始行动」）
    if (opts && opts.replay) {
      maskActive = false;
      if (dom.mask) dom.mask.classList.add('hidden');
      return;
    }
    if (!state || state.phase === 'gameover') { maskActive = false; dom.mask.classList.add('hidden'); return; }
    var actor = displayActor(state, opts);
    var p = actor >= 0 ? state.players[actor] : null;
    if (!p || p.isAI) {
      if (viewPlayer == null || !state.players[viewPlayer] || state.players[viewPlayer].isAI) {
        viewPlayer = firstHuman(state);
      }
      maskActive = false;
      dom.mask.classList.add('hidden');
      return;
    }
    if (viewPlayer !== actor) {
      viewPlayer = null;
      maskActive = true;
      dom.maskAvatar.style.setProperty('--pc', pc(p.color).main);
      dom.maskAvatar.innerHTML = '<svg width="46" height="46" viewBox="0 0 20 20"><path d="M-6 8 L0 -7 L6 8 Z M-4 7 L-4 1 L4 1 L4 7 Z" transform="translate(10,10) scale(1.05)" fill="rgba(255,255,255,0.92)"/></svg>';
      dom.maskName.textContent = p.name;
      var sub = '点击确认，开始你的回合';
      if (state.pendingTrade) sub = '有一笔交易等待你应答';
      else if (state.phase === 'discard') sub = '你的手牌超过 7 张，需要弃牌';
      else if (state.phase === 'setup2') sub = '第二轮初始布置';
      else if (state.phase === 'setup1') sub = '第一轮初始布置';
      dom.maskSub.textContent = sub;
      dom.mask.classList.remove('hidden');
    } else {
      maskActive = false;
      dom.mask.classList.add('hidden');
    }
  }

  /* ==================== v1.24 契约 C：复盘统计（胜利画面） ====================
   * 数据源：opts.review（app.js 内存 journal）+ state.diceHistory（契约 A，若引擎提供）。
   * 三个图块：① 各玩家 VP 折线（按回合，每回合取最后一条记录）；
   *          ② 资源漏斗（产出/交易入/支出，journal.flow 逐条累加）；
   *          ③ 骰子分布直方图（diceHistory 优先，journal.roll 兜底）。
   * 旧档无 journal 时图块降级为占位提示，绝不抛错阻断胜利画面。 */

  function rvEntries(journal) {
    var out = [];
    (journal || []).forEach(function (e) {
      if (e && typeof e === 'object' && e.a && typeof e.a.type === 'string') out.push(e);
    });
    return out;
  }
  function rvNum(o) {
    var t = 0;
    if (o) for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k) && typeof o[k] === 'number') t += o[k]; }
    return t;
  }
  function rvResText(o) {
    var parts = [];
    if (o) RES_KEYS.forEach(function (k) { if (o[k] > 0) parts.push(RES[k].name + o[k]); });
    return parts.length ? parts.join(' ') : '—';
  }
  // journal.flow 逐条累加 → { idx: {prod:{},got:{},spent:{}} }
  function rvAggFlow(entries) {
    var agg = {};
    entries.forEach(function (en) {
      var fl = en.flow;
      if (!fl || typeof fl !== 'object') return;
      for (var p in fl) {
        if (!Object.prototype.hasOwnProperty.call(fl, p)) continue;
        var idx = parseInt(p, 10);
        if (!(idx >= 0)) continue;
        var dst = agg[idx] || (agg[idx] = { prod: {}, got: {}, spent: {} });
        var src = fl[p] || {};
        ['prod', 'got', 'spent'].forEach(function (slot) {
          var s = src[slot];
          if (!s || typeof s !== 'object') return;
          RES_KEYS.forEach(function (k) {
            var n = s[k];
            if (typeof n === 'number' && n) dst[slot][k] = (dst[slot][k] || 0) + n;
          });
        });
      }
    });
    return agg;
  }
  // 每回合取最后一条记录（VP 折线横轴=回合）
  function rvLastByTurn(entries) {
    var byTurn = {};
    var turns = [];
    entries.forEach(function (en) {
      var t = typeof en.turn === 'number' ? en.turn : 0;
      if (!byTurn[t]) { byTurn[t] = en; turns.push(t); }
      else byTurn[t] = en;
    });
    turns.sort(function (a, b) { return a - b; });
    return turns.map(function (t) { return { turn: t, en: byTurn[t] }; });
  }
  function rvBlockTitle(t, tip) {
    var d = el('div', 'rv-title');
    d.textContent = t;
    if (tip) d.title = tip;
    return d;
  }

  // ① VP 折线（SVG）：横轴=回合（等距取样全部回合），纵轴=VP 总分（公开+暗分）
  function rvVpChart(state, entries) {
    var per = rvLastByTurn(entries);
    if (!per.length) return null;
    var players = state.players || [];
    var target = (state.config && state.config.targetVP) || 10;
    var W = 440, H = 200, padL = 30, padR = 10, padT = 12, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var maxVp = target;
    per.forEach(function (it) {
      (it.en.vps || []).forEach(function (v) { if (typeof v === 'number' && v > maxVp) maxVp = v; });
    });
    maxVp = Math.max(maxVp, 4);
    function xi(i) { return padL + (per.length === 1 ? plotW / 2 : (i / (per.length - 1)) * plotW); }
    function yj(v) { return padT + plotH - (v / maxVp) * plotH; }
    var svg = mk('svg', { 'class': 'rv-chart', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
    // 水平网格（每 2 分）+ 纵轴刻度
    for (var gv = 0; gv <= maxVp; gv += 2) {
      svg.appendChild(mk('line', { x1: padL, y1: yj(gv), x2: W - padR, y2: yj(gv), 'class': gv === 0 ? 'rv-axis' : 'rv-grid' }));
      var lab = mk('text', { x: padL - 5, y: yj(gv) + 3.5, 'class': 'rv-tick', 'text-anchor': 'end' });
      lab.textContent = String(gv);
      svg.appendChild(lab);
    }
    // 目标分虚线
    svg.appendChild(mk('line', { x1: padL, y1: yj(target), x2: W - padR, y2: yj(target), 'class': 'rv-target' }));
    var tl = mk('text', { x: W - padR - 2, y: yj(target) - 4, 'class': 'rv-tick rv-target-t', 'text-anchor': 'end' });
    tl.textContent = '目标 ' + target;
    svg.appendChild(tl);
    // 横轴回合标签（最多 6 个）
    var labelN = Math.min(per.length, 6);
    for (var li = 0; li < labelN; li++) {
      var pi = Math.round(li * (per.length - 1) / Math.max(1, labelN - 1));
      var xl = mk('text', { x: xi(pi), y: H - 8, 'class': 'rv-tick', 'text-anchor': 'middle' });
      xl.textContent = 'T' + per[pi].turn;
      svg.appendChild(xl);
    }
    // 每名玩家一条折线（有记录才画点；终局总分与当前面板一致）
    players.forEach(function (p) {
      var pts = [];
      per.forEach(function (it, i) {
        var v = (it.en.vps && typeof it.en.vps[p.idx] === 'number') ? it.en.vps[p.idx] : null;
        if (v != null) pts.push(xi(i) + ',' + yj(v));
      });
      if (pts.length < 1) return;
      if (pts.length > 1) {
        svg.appendChild(mk('polyline', { points: pts.join(' '), 'class': 'rv-line', stroke: pc(p.color).main }));
      }
      pts.forEach(function (ptStr) {
        var xy = ptStr.split(',');
        svg.appendChild(mk('circle', { cx: xy[0], cy: xy[1], r: 2.6, 'class': 'rv-dot', fill: pc(p.color).main }));
      });
    });
    return svg;
  }
  // 图例（玩家色点 + 名 + 终局 VP）
  function rvLegend(state) {
    var lg = el('div', 'rv-legend');
    (state.players || []).forEach(function (p) {
      var item = el('span', 'rv-lg-item');
      var dot = el('i', 'rv-lg-dot');
      dot.style.background = pc(p.color).main;
      item.appendChild(dot);
      item.appendChild(document.createTextNode(p.name + (p.isAI ? '(AI)' : '')));
      lg.appendChild(item);
    });
    return lg;
  }

  // ② 资源漏斗：产出（掷骰/初始）/ 交易入（交易·银行·卡效）/ 支出（建造·买卡·付出·流失）
  function rvFunnel(state, entries) {
    var agg = rvAggFlow(entries);
    var touched = false;
    Object.keys(agg).forEach(function (k) { if (rvNum(agg[k].prod) + rvNum(agg[k].got) + rvNum(agg[k].spent) > 0) touched = true; });
    if (!touched) return null;
    var head = el('div', 'rv-fun rv-fun-head');
    ['玩家', '▲ 产出', '⇄ 交易入', '▼ 支出', '终局手牌'].forEach(function (t) { head.appendChild(el('span', null, t)); });
    var box = el('div', 'rv-funnel');
    box.appendChild(head);
    (state.players || []).forEach(function (p) {
      var f = agg[p.idx] || { prod: {}, got: {}, spent: {} };
      var prod = rvNum(f.prod), got = rvNum(f.got), spent = rvNum(f.spent);
      var row = el('div', 'rv-fun');
      var nameCell = el('span', 'rv-fun-name');
      var dot = el('i', 'v-dot');
      dot.style.background = pc(p.color).main;
      nameCell.appendChild(dot);
      nameCell.appendChild(document.createTextNode(p.name.length > 6 ? p.name.slice(0, 6) + '…' : p.name));
      row.appendChild(nameCell);
      [['▲', prod, f.prod, '掷骰与初始布置产出'], ['⇄', got, f.got, '玩家/银行交易与卡效收入'],
       ['▼', spent, f.spent, '建造·买卡·交易付出·被偷/垄断/弃牌流失']].forEach(function (c) {
        var cell = el('span', 'rv-fun-n' + (c[1] === 0 ? ' zero' : ''));
        cell.textContent = c[0] + ' ' + c[1];
        cell.title = c[3] + '：' + rvResText(c[2]);
        row.appendChild(cell);
      });
      var hand = el('span', 'rv-fun-hand');
      var handN = 0;
      if (p.resources) RES_KEYS.forEach(function (k) { handN += p.resources[k] || 0; });
      hand.textContent = String(handN);
      hand.title = '终局手牌：' + (p.resources ? rvResText(p.resources) : '—');
      row.appendChild(hand);
      box.appendChild(row);
    });
    return box;
  }

  // ③ 骰子直方图：state.diceHistory（契约 A；元素为点数和、[d1,d2] 或 {sum}），
  //    缺失时回退 journal.roll；理论期望 = 36 组合比例（COMBO/36）
  var RV_COMBO = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
  function rvDiceData(state, entries) {
    var counts = {}, total = 0;
    function addSum(n) {
      if (typeof n === 'number' && n >= 2 && n <= 12 && isFinite(n)) {
        counts[n] = (counts[n] || 0) + 1;
        total++;
      }
    }
    var hist = state ? state.diceHistory : null;
    if (Array.isArray(hist)) {
      hist.forEach(function (v) {
        if (typeof v === 'number') addSum(v);
        else if (v && typeof v === 'object' && typeof v.length === 'number' && v.length === 2) addSum(v[0] + v[1]);
        else if (v && typeof v === 'object' && typeof v.sum === 'number') addSum(v.sum);
      });
    }
    if (!total) {
      entries.forEach(function (en) { if (typeof en.roll === 'number') addSum(en.roll); });
    }
    return { counts: counts, total: total };
  }
  function rvDiceChart(data) {
    if (!data.total) return null;
    var box = el('div', 'rv-dice');
    var max = 1;
    for (var n = 2; n <= 12; n++) if ((data.counts[n] || 0) > max) max = data.counts[n];
    for (var m = 2; m <= 12; m++) {
      (function (nn) {
        var col = el('div', 'rv-dcol' + (nn === 6 || nn === 8 ? ' hot' : ''));
        var bar = el('i', 'rv-dbar');
        var c = data.counts[nn] || 0;
        bar.style.height = Math.round((c / max) * 76 + (c > 0 ? 6 : 2)) + 'px';
        var exp = RV_COMBO[nn] / 36;
        col.title = '点数 ' + nn + '：' + c + ' 次（' + (data.total ? Math.round(c / data.total * 100) : 0) + '%，理论期望 ' +
          RV_COMBO[nn] + '/36 ≈ ' + Math.round(exp * 100) + '%）';
        var cnt = el('span', 'rv-dcnt', c > 0 ? String(c) : '');
        var num = el('span', 'rv-dnum', String(nn));
        col.appendChild(cnt); col.appendChild(bar); col.appendChild(num);
        box.appendChild(col);
      })(m);
    }
    var cap = el('div', 'rv-dcap', '共 ' + data.total + ' 次掷骰 · 红柱为 6/8 高频点');
    box.appendChild(cap);
    return box;
  }

  // 复盘统计整块（renderVictory 调用；数据来自 opts.review journal）
  function buildReviewSection(state, journal) {
    var entries = rvEntries(journal);
    var box = el('div', 'v-review');
    var head = el('div', 'v-rev-head');
    var sub = el('span', 'v-rev-sub', entries.length ? ('共 ' + entries.length + ' 步动作记录') : '本局无过程记录（旧档）');
    head.appendChild(el('span', 'v-rev-title', '📊 复盘统计'));
    head.appendChild(sub);
    box.appendChild(head);
    var body = el('div', 'v-rev-body');
    var b1 = el('div', 'rv-block');
    b1.appendChild(rvBlockTitle('各玩家 VP 走势（按回合）'));
    var vpChart = rvVpChart(state, entries);
    if (vpChart) { b1.appendChild(vpChart); b1.appendChild(rvLegend(state)); }
    else b1.appendChild(el('div', 'rv-empty', '无过程记录，无法绘制 VP 折线'));

    var b2 = el('div', 'rv-block');
    b2.appendChild(rvBlockTitle('资源漏斗（产出 / 交易入 / 支出）', '产出=掷骰与初始布置；交易入=玩家/银行交易与卡效收入；支出=建造、买卡、交易付出与被偷/垄断/弃牌流失'));
    var fu = rvFunnel(state, entries);
    if (fu) b2.appendChild(fu);
    else b2.appendChild(el('div', 'rv-empty', '无过程记录，无法统计资源漏斗'));
    body.appendChild(b2);
    var b3 = el('div', 'rv-block');
    b3.appendChild(rvBlockTitle('骰子分布直方图', '数据源：引擎 diceHistory（房规「平衡骰子」记录候选取舍后的点数）；旧档回退战报掷骰记录'));
    var dc = rvDiceChart(rvDiceData(state, entries));
    if (dc) b3.appendChild(dc);
    else b3.appendChild(el('div', 'rv-empty', '无骰子记录'));
    body.appendChild(b3);
    box.appendChild(body);
    return box;
  }

  /* ==================== v1.24 契约 D：时光机回放条 ==================== */
  function buildReplayBar() {
    var bar = el('div', 'replay-bar hidden');
    bar.id = 'uiReplayBar';
    bar.innerHTML =
      '<span class="rp-title">🕰️ 时光机</span>' +
      '<button data-rp="start" class="rp-btn" title="跳到开局（Home）">⏮</button>' +
      '<button data-rp="back" class="rp-btn" title="上一步（←）">◀</button>' +
      '<span class="rp-pos"><b id="uiRpPos">0 / 0</b><i id="uiRpSum">开局局面</i></span>' +
      '<button data-rp="fwd" class="rp-btn" title="下一步（→）">▶</button>' +
      '<button data-rp="end" class="rp-btn" title="跳到终局（End）">⏭</button>' +
      '<span class="rp-sep" aria-hidden="true"></span>' +
      '<button data-rp="take" class="rp-btn rp-take" title="从当前历史步生成新对局继续打">🎯 残局接管</button>' +
      '<button data-rp="exit" class="rp-btn rp-exit" title="退出时光机并恢复结束局面（Esc）">✕ 退出</button>';
    Array.prototype.forEach.call(bar.querySelectorAll('[data-rp]'), function (b) {
      var k = b.getAttribute('data-rp');
      rpBtns[k] = b;
      b.addEventListener('click', function () {
        if (k === 'start') act({ type: 'replayStep', dir: 'start' });
        else if (k === 'back') act({ type: 'replayStep', dir: 'back' });
        else if (k === 'fwd') act({ type: 'replayStep', dir: 'fwd' });
        else if (k === 'end') act({ type: 'replayStep', dir: 'end' });
        else if (k === 'take') act({ type: 'replayTakeover' });
        else if (k === 'exit') act({ type: 'replayExit' });
      });
    });
    rpPos = bar.querySelector('#uiRpPos');
    rpSum = bar.querySelector('#uiRpSum');
    rpBar = bar;
    rootEl.appendChild(bar);
  }
  // info = { active, idx, total, canBack, canFwd, canTakeover, sum }（app.js replayBarInfo 产出）
  function setReplayBar(info) {
    if (!rpBar) return;
    info = info || {};
    rpActiveUI = !!info.active;
    rpBar.classList.toggle('hidden', !info.active);

    card.appendChild(buildReviewSection(state, (opts && opts.review) || []));

  }
  function victoryFp(state) {
    return state.turnCount + '|' + state.winner + '|' + state.players.length;
  }

  /* ==================== 渲染主流程 ==================== */
  function stateFp(state) {
    return [
      state.config ? state.config.targetVP : 0,
      state.turnCount, state.phase, state.currentPlayer, state.robber,
      (state.players || []).map(function (p) { return (p.settlementIds || []).join(','); }).join(';')
    ].join('|');
  }
  function render(state, opts, events) {
    if (!dom.gameUI || !state || !state.players) return;
    opts = opts || {};
    events = events || [];

    // 新对局/读档检测（内容指纹，避免应用层复制 state 导致的误判）
    var ref = state, fp = stateFp(state);
    if (lastStateRef !== ref && fp !== lastFp) {
      badges = { army: null, road: null };
      lastRollKey = null;
      prevRobberHex = null;
      viewPlayer = null;
      discardSel = { player: null, cards: {}, need: 0 };
      yopPicks = [];
      victoryDismissed = '';
      lastEventsRef = null;
      lastGameoverEvents = null;
      closeModal();
      closeTradeDrawer(false);
      resetTradeDraft();
      if (dom.logList) dom.logList.innerHTML = '';
    }
    lastStateRef = ref; lastFp = fp;
    lastState = state; lastOpts = opts;

    var ctx;
    // 同一批事件只处理一次：纯重绘（缩放/切建造模式等）不得重复放音效、重复写战报
    if (events !== lastEventsRef) {
      ctx = processEvents(state, events);
      if (events.length) ctx.gameoverEvents = events;
      lastEventsRef = events;
      if (ctx.gameoverEvents) lastGameoverEvents = events;
    } else {
      ctx = lastGameoverEvents ? { gameoverEvents: lastGameoverEvents } : {};
    }

    // v1.21 契约 C：每渲染现算最长公路持有者与构成边（金流光数据源）；
    // 持有者可判定（awards / 引擎 owner 函数）时同步面板徽章——徽章易主随
    // 引擎 awards 实时切换，读档/纯重绘/称号失效等无事件场景也不残留旧徽章
    curRoadHl = longestRoadHighlightOf(state);
    if (curRoadHl.known) badges.road = curRoadHl.player;
    // v1.22 契约 D 配套：最大军队持有者同样从 awards 同步（与 road 同源）——
    // 读档/纯重绘后 badges.army 否则会丢记忆：面板军徽消失，且称号再次易主时
    // 横幅退化为「夺得」而丢失「从【Y】手中夺取」的上一持有者
    if (state.awards && state.awards.largestArmy && state.awards.largestArmy.player != null) {
      badges.army = state.awards.largestArmy.player;
    }

    if (geom && geom.boardRef !== state.board) buildBoardStatic(state);
    else if (!geom) buildBoardStatic(state);

    showGame();
    updateMask(state, opts);
    renderHint(state, opts);
    renderPanels(state, opts);
    flushPanelFloats();
    renderDynamic(state, opts, ctx);
    renderHand(state);
    renderDevs(state, opts);
    renderButtons(state, opts);
    renderDice(state, ctx);
    renderModals(state, opts);
    renderTradeDrawer(state, opts); // 交易抽屉每步 render 刷新（看板徽标/视图切换）
    renderVictory(state, ctx, opts);
    layoutBoard(); // 每次渲染后校准自适应布局（容器尺寸可能随内容变化）

    prevRobberHex = state.robber;
  }

  function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        return true;
      }

      var ta = el('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);

      var ok = document.execCommand('copy');
      document.body.removeChild(ta);

    leave.type = 'button';
    leave.addEventListener('click', function () { closeLobby(); act({ type: 'netLeave' }); showSetup(); });
    wrap.appendChild(leave);

    if (lobbyError) wrap.appendChild(el('div', 'lobby-err', lobbyError));
    return wrap;
  }

  function renderLobby() {
    if (!lobbyEl) return;
    var main = lobbyEl.querySelector('#uiLobbyMain');
    if (!main) return;
    main.innerHTML = '';
    if (lobbyPreflight === 'checking') {
      main.appendChild(el('div', 'lobby-card lobby-checking', '正在检测联机服务器…'));
      return;
    }
    if (lobbyPreflight === 'fail') { main.appendChild(buildPreflightFail()); return; }
    main.appendChild(lobbyRoom ? buildLobbyRoom() : buildLobbyForm());
  }

  function openLobby(mode) {
    ensureLobbyPage();
    lobbyMode = mode || 'create';
    lobbyRoom = null; lobbyError = ''; lobbyBusy = false;
    if (dom.setupPage) dom.setupPage.classList.add('hidden');
    if (dom.gameUI) dom.gameUI.classList.add('hidden');
    lobbyEl.classList.remove('hidden');
    if (lobbyPreflight !== 'ok') { lobbyPreflight = 'checking'; act({ type: 'netPing' }); }
    renderLobby();
  }

  // 服务器预检结果（App 在 netPing 回调里调用）
  function setPreflight(ok, err) {
    lobbyPreflight = ok ? 'ok' : 'fail';
    lobbyPreflightErr = err || '';
    if (lobbyEl) renderLobby();
  }

  function setLobby(room, err) {
    if (!lobbyEl) openLobby();
    lobbyRoom = room || null;
    lobbyError = err || '';
    renderLobby();
  }

  function setLobbyBusy(b) {
    lobbyBusy = !!b;
    if (lobbyEl) renderLobby();
  }

  // 顶栏联机状态徽标：绿色=在线，红色=断线重试中
  function setNetStatus(info) {
    var chip = byId('uiNetChip');
    if (!chip) return;
    if (!info || !info.code) { chip.classList.add('hidden'); return; }
    chip.classList.remove('hidden');
    chip.className = 'net-chip ' + (info.ok ? 'ok' : 'off');
    chip.textContent = info.ok ? ('联机 · 房间 ' + info.code) : ('连接中断 · 房间 ' + info.code);
    chip.title = info.ok ? '已连接服务器' : '与服务器断开，正在自动重试…';
  }

  function closeLobby() {
    if (lobbyEl) lobbyEl.classList.add('hidden');
    lobbyRoom = null; lobbyError = ''; lobbyBusy = false;
    if (dom.setupPage && (!dom.gameUI || dom.gameUI.classList.contains('hidden'))) {
      dom.setupPage.classList.remove('hidden');
    }
  }

  /* ==================== 新手教程横幅 / 段位 ==================== */
  // step: 当前步（从 1 开始），total: 总步数，text: 提示正文
  function showTutorial(info) {
    if (!dom.tut || !info) return;
    dom.tut.classList.remove('hidden');
    dom.tutStep.textContent = '新手教程 ' + info.step + '/' + info.total + (info.title ? ' · ' + info.title : '');
    dom.tutText.textContent = info.text || '';
    if (dom.tutBar) dom.tutBar.style.width = Math.max(0, Math.min(100, (info.step / info.total) * 100)).toFixed(1) + '%';
  }
  function hideTutorial() {
    if (dom.tut) dom.tut.classList.add('hidden');
  }
  // 段位徽章（设置页）。info = { name, points, next, progress(0~1), tierLabel }
  function setRank(info) {
    var box = byId('uiRankBadge');
    if (!box) return;
    if (!info) { box.innerHTML = ''; box.className = 'rank-badge'; return; }
    box.className = 'rank-badge r-' + (info.tier || 'bronze');
    box.innerHTML = '<span class="rk-icon">' + (info.icon || '🎖') + '</span>' +
      '<span class="rk-name">' + escapeHTML(info.name || '青铜') + '</span>' +
      '<span class="rk-pts">' + (info.points || 0) + ' 分</span>' +
      '<span class="rk-bar"><i style="width:' + Math.round((info.progress || 0) * 100) + '%"></i></span>' +
      '<span class="rk-next">' + (info.next > 0 ? '距下一段 ' + (info.next - (info.points || 0)) + ' 分' : '已达最高段') + '</span>';
  }
  // 胜利画面里的段位结算行（由 App 在对局结束那一刻写入）
  var rankResult = null;
  function setRankResult(res) { rankResult = res || null; }

  /* ==================== Toast / 速度 / 静音 ==================== */
  function showToast(text) {
    if (!dom.toastRoot) return;
    var t = el('div', 'toast', String(text == null ? '' : text));
    dom.toastRoot.appendChild(t);
    setTimeout(function () { t.classList.add('out'); }, 2100);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2500);
    while (dom.toastRoot.children.length > 3) {
      dom.toastRoot.removeChild(dom.toastRoot.firstChild);
    }
  }
  function applySpeedLocal(v) {
    if (SPEEDS[v]) speed = v;
  }
  function setSpeed(x) {
    applySpeedLocal(x);
    var sel = byId('uiSpeedSel');
    if (sel && SPEEDS[speed]) sel.value = speed;
  }
  function getSpeed() { return speed; }
  function getSpeedMs() { return speed === 'slow' ? 1600 : speed === 'fast' ? 350 : 850; }
  function setMuted(b) {
    muted = !!b;
    var btn = byId('uiMuteBtn');
    if (btn) {
      btn.innerHTML = muted
        ? '<svg width="16" height="16" viewBox="0 0 20 20"><path d="M3 8 h3 l4 -4 v12 l-4 -4 H3 Z" fill="#cbb98a"/><path d="M13 7 l5 6 M18 7 l-5 6" stroke="#cbb98a" stroke-width="1.8" stroke-linecap="round"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 20 20"><path d="M3 8 h3 l4 -4 v12 l-4 -4 H3 Z" fill="#f3e7c8"/><path d="M13.5 6.5 a5 5 0 0 1 0 7 M15.8 4.6 a8 8 0 0 1 0 10.8" stroke="#f3e7c8" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>';
      btn.title = muted ? '开启音效' : '关闭音效';
    }
  }
  function isMuted() { return muted; }

  // 键盘快捷键（界面改版 v2 + v1.20 契约 D 全键盘）：
  //   Space/R=掷骰；E/Enter=结束回合；1/2/3=修路/建村/升城模式；4=买发展卡；
  //   B=银行交易抽屉；T=玩家交易抽屉；Z=撤销；Esc=既有分层（抽屉→弹窗→建造模式）。
  // 原则：快捷键只「点击对应的按钮」，启停状态与按钮完全同源（按钮置灰=按键无效）。
  function stickyModalOpen() {
    return !!(dom.stickyRoot && dom.stickyRoot.firstChild);
  }
  function quickAction(kind) {
    if (!lastState || maskActive) return;
    if (lastState.phase !== 'main') return;
    if (stickyModalOpen()) return; // 垄断/丰收选资源等粘性弹窗打开时不抢动作
    var actor = displayActor(lastState, lastOpts);
    if (!isHuman(lastState, actor)) return;
    if (kind === 'roll') {
      if (dom.rollBig && !dom.rollBig.disabled) act({ type: 'roll' });
    } else if (kind === 'end') {
      if (dom.endBig && !dom.endBig.disabled) act({ type: 'endTurn' });
    }
  }
  // 操作区按钮的键盘镜像：按钮不存在（他阶段）或置灰时按键即为无效，不构造旁路动作
  function pressBtn(key) {
    var b = dom.abBtns ? dom.abBtns[key] : null;
    if (b && !b.disabled) b.click();
  }
  // v1.20 契约 D：帮助浮层 —— 快捷键矩阵（顶栏「⌨ 快捷键」按钮打开，Esc/× 关闭）
  function openKeysHelp() {
    if (!dom.stickyRoot) return;
    var body = el('div', 'modal-body');
    body.appendChild(el('div', 'modal-tip', '全局键盘操作（按钮置灰时对应快捷键同样无效；输入框聚焦时不拦截，Esc 除外）'));
    var grid = el('div', 'keys-matrix');
    var ROWS = [
      ['turn', '回合', 'Space / R', '掷两颗骰子开始回合'],
      ['turn', '回合', 'E / Enter', '结束当前回合'],
      ['build', '建造', '1', '修路模式（再按一次取消）'],
      ['build', '建造', '2', '建村模式（再按一次取消）'],
      ['build', '建造', '3', '升城模式（再按一次取消）'],
      ['build', '建造', '4', '买一张发展卡'],
      ['trade', '交易', 'B', '银行 / 港口交易抽屉'],
      ['trade', '交易', 'T', '玩家交易抽屉'],
      ['misc', '通用', 'Z', '撤销上一步（单机/热座，联机不可用）'],
      ['misc', '通用', 'Esc', '依次关闭：交易抽屉 → 弹窗 → 取消建造模式']
    ];
    ROWS.forEach(function (r) {
      var item = el('div', 'km-row km-' + r[0]);
      item.innerHTML = '<span class="km-group">' + r[1] + '</span>' +
        '<span class="km-keys"><kbd>' + r[2].replace(/ \/ /g, '</kbd><kbd>/</kbd><kbd>') + '</kbd></span>' +
        '<span class="km-desc">' + r[3] + '</span>';
      grid.appendChild(item);
    });
    body.appendChild(grid);
    var foot = el('div', 'modal-foot');
    var ok = el('button', 'btn btn-primary', '知道了');
    ok.addEventListener('click', closeModal);
    foot.appendChild(ok);
    dom.stickyRoot.innerHTML = '';
    dom.stickyRoot.appendChild(modalShell('快捷键矩阵', body, foot, true));
  }

  // v1.21 契约 D：记牌器 —— 发展卡牌堆剩余 / 各玩家已打出骑士数 / 未翻开 VP 总数。
  // 只盘点公开信息（牌堆数量、 knightsPlayed 计数、VP 暗牌总数），不揭示归属；
  // 内容为打开时刻的快照，关闭重开即刷新。玩家名经 escapeHTML 后再进 innerHTML。
  function openCardCounter() {
    if (!dom.stickyRoot) return;
    var st = lastState;
    if (!st || !st.players) { showToast('当前没有进行中的对局'); return; }
    var deckN = (st.devDeck && st.devDeck.length) || 0;
    var vpN = 0, knightSum = 0;
    st.players.forEach(function (p) {
      if (!p) return;
      if (p.dev) vpN += p.dev.vp || 0;
      knightSum += p.knightsPlayed || 0;
    });
    var body = el('div', 'modal-body');
    body.appendChild(el('div', 'modal-tip', '公开信息盘点 · 不揭示任何暗牌归属'));
    var grid = el('div', 'cnt-grid');
    cntRow(grid, '🂠', '发展卡牌堆剩余', deckN + ' 张');
    cntRow(grid, '⭐', '未翻开分数卡（VP）总数', vpN + ' 张');
    cntRow(grid, '⚔', '全场已打出骑士合计', knightSum + ' 名');
    body.appendChild(grid);
    var plist = el('div', 'cnt-players');
    st.players.forEach(function (p) {
      if (!p) return;
      var row = el('div', 'cnt-prow');
      row.style.setProperty('--pc', pc(p.color).main);
      row.innerHTML = '<span class="cnt-dot"></span>' +
        '<span class="cnt-pname">' + escapeHTML(p.name) + '</span>' +
        '<span class="cnt-knight"><b>' + (p.knightsPlayed || 0) + '</b> 骑士已打出</span>';
      plist.appendChild(row);
    });
    body.appendChild(plist);
    body.appendChild(el('div', 'cnt-note',
      '标准局牌堆固定 25 张：骑士×14 · 分数×5 · 道路修建×2 · 丰收×2 · 垄断×2；已购入合计 ' + (25 - deckN) + ' 张。'));
    var foot = el('div', 'modal-foot');
    var ok = el('button', 'btn btn-primary', '知道了');
    ok.addEventListener('click', closeModal);
    foot.appendChild(ok);
    dom.stickyRoot.innerHTML = '';
    dom.stickyRoot.appendChild(modalShell('🃏 记牌器', body, foot, true));
  }
  function cntRow(grid, icon, label, value) {
    var row = el('div', 'cnt-row');
    row.innerHTML = '<span class="cnt-ic">' + icon + '</span>' +
      '<span class="cnt-k">' + label + '</span>' +
      '<span class="cnt-v">' + value + '</span>';
    grid.appendChild(row);
  }
  function bindGlobalKeys() {
    if (typeof document === 'undefined') return;
    document.addEventListener('keydown', function (e) {
      // 联机大厅：Esc 直接返回（输入框内也要生效，否则表单填一半退不出去）
      if (e.key === 'Escape' && isLobbyOpen()) {
        e.preventDefault();
        closeLobby();
        act({ type: 'netLeave' });
        showSetup();
        return;
      }
      // v1.24 契约 D：时光机回放中——←/→ 步进、Home/End 跳转、Esc 退出；
      // 对局快捷键（Space/E/1/2/3/4/B/T/Z）一律不生效（回放只读，动作被 app 拦截）
      if (rpActiveUI) {
        if (e.key === 'Escape') { e.preventDefault(); act({ type: 'replayExit' }); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); act({ type: 'replayStep', dir: 'back' }); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); act({ type: 'replayStep', dir: 'fwd' }); return; }
        if (e.key === 'Home') { e.preventDefault(); act({ type: 'replayStep', dir: 'start' }); return; }
        if (e.key === 'End') { e.preventDefault(); act({ type: 'replayStep', dir: 'end' }); return; }
        return; // 其余按键（含对局快捷键）在回放中一律吞掉，避免误触发动作提示
      }
      // Esc 任何界面都可用：先关抽屉，再关弹窗，最后退建造模式。
      // v1.20 契约 D：Esc 分层在输入框聚焦时同样生效（「输入框聚焦时不拦截（Esc 除外）」）
      if (e.key === 'Escape') {
        // 交易抽屉优先：Esc 只收抽屉，不同时退出建造模式（v1.19 契约 C1）
        if (tdOpen) { closeTradeDrawer(true); hideGhost(); return; }
        if (dom.stickyRoot && dom.stickyRoot.firstChild) { closeModal(); hideGhost(); return; }
        if (dom.gameUI && !dom.gameUI.classList.contains('hidden') &&
            lastOpts && lastOpts.buildMode) { act({ type: 'cancelBuild' }); return; }
        hideGhost();
        return;
      }
      var ae = document.activeElement, tag = ae ? ae.tagName : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // 输入框内不拦截（Esc 已在上方放行）
      // 以下快捷键只在游戏界面内生效（设置页不劫持按键），
      // 且忽略 Ctrl/Meta/Alt 组合（浏览器快捷键优先）
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (!dom.gameUI || dom.gameUI.classList.contains('hidden')) return;
      var k = e.key;
      if (k === ' ' || e.code === 'Space' || k === 'r' || k === 'R') {
        e.preventDefault(); // 防止页面滚动 / 焦点按钮被空格误触发（掷骰统一走 quickAction）
        quickAction('roll');
      } else if (k === 'e' || k === 'E') {
        quickAction('end');
      } else if (k === 'Enter') {
        if (tag === 'BUTTON') return; // 焦点在按钮上：交给浏览器原生点击，避免双重触发
        e.preventDefault();
        quickAction('end');
      } else if (k === '1' || k === '2' || k === '3') {
        e.preventDefault();
        pressBtn(k === '1' ? 'road' : k === '2' ? 'settlement' : 'city');
      } else if (k === '4') {
        e.preventDefault();
        pressBtn('dev');
      } else if (k === 'b' || k === 'B') {
        pressBtn('bank');
      } else if (k === 't' || k === 'T') {
        pressBtn('ptrade');
      } else if (k === 'z' || k === 'Z') {
        pressBtn('undo'); // 撤销：单机/热座渲染出按钮且未禁用时生效（撤栈在 app.js）
      }
    });
  }

  // 用最近一次开局配置预填设置页（玩家名/颜色/真人与 AI/难度/目标分/随机地图），
  // 让偏好跨对局保持；cfg 缺字段时保留当前值。
  function applySetupConfig(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    var list = Array.isArray(cfg.players) ? cfg.players : [];
    if (list.length >= 2 && list.length <= 4) {
      setupCount = list.length;
      for (var i = 0; i < setupCount; i++) {
        var p = list[i] || {};
        if (typeof p.name === 'string' && p.name) setupNames[i] = p.name.slice(0, 12);
        if (COLOR_ORDER.indexOf(p.color) >= 0) setupColors[i] = p.color;
        setupKinds[i] = p.isAI ? '1' : '0';
        setupDiffs[i] = (p.difficulty === 'easy' || p.difficulty === 'hard') ? p.difficulty : 'normal';
      }
      setSetupCount(setupCount);
    }
    if (cfg.targetVP != null) {
      var tvp = byId('uiTargetVP');
      if (tvp) tvp.value = String(clamp(parseInt(cfg.targetVP, 10) || 10, 3, 20));
    }
    if (typeof cfg.randomBoard === 'boolean') {
      var rb = byId('uiRandomBoard');
      if (rb) rb.checked = cfg.randomBoard;
    }
    // v1.24 房规开关回填（cfg.houseRules 缺失时保留当前值；旧档/旧配置双 false）
    var hr = cfg.houseRules || {};
    if (typeof hr.balancedDice === 'boolean') {
      var bd = byId('uiBalancedDice');
      if (bd) bd.checked = hr.balancedDice;
    }
    if (typeof hr.friendlyRobber === 'boolean') {
      var fr = byId('uiFriendlyRobber');
      if (fr) fr.checked = hr.friendlyRobber;
    }
  }

  /* ==================== 导出 ==================== */
  // 浏览器挂载 window.CatanUI；node require 仅作语法级冒烟（无 window，跳过挂载，
  // 与 app.js 的守卫写法一致，require 时不报错）
  if (typeof window !== 'undefined') {
    window.CatanUI = {
      init: init,
      render: render,
      showToast: showToast,
      setSpeed: setSpeed,
      getSpeed: getSpeed,
      getSpeedMs: getSpeedMs,
      setMuted: setMuted,
      isMuted: isMuted,
      setFx: setFx,
      isFxOn: isFxOn,
      showSetup: showSetup,
      showGame: showGame,
      applySetupConfig: applySetupConfig,
      showTutorial: showTutorial,
      hideTutorial: hideTutorial,
      setRank: setRank,
      setRankResult: setRankResult,
      setOnlineSeat: setOnlineSeat,
      getOnlineSeat: getOnlineSeat,
      openLobby: openLobby,
      setLobby: setLobby,
      closeLobby: closeLobby,
      isLobbyOpen: isLobbyOpen,
      setPreflight: setPreflight,
      setLobbyBusy: setLobbyBusy,
      setNetStatus: setNetStatus,
      showTradeDrawerError: showTradeDrawerError,
      setReplayBar: setReplayBar
    };
  }
})();

</script>
  <script>
/*
 * app.js —— 流程编排与存档（只挂 window.App）
 * ------------------------------------------------------------------
 * 职责（对应 SPEC【App 契约】）：
 *   1) 装配：CatanUI.init(document.getElementById('app'), callbacks)，
 *      onAction 是唯一动作出口，全部交给 CatanEngine.applyAction 执行；
 *   2) 每次动作后：applyAction → 计算 opts（buildMode/selectable/activePlayer/hint）
 *      → CatanUI.render(state, opts, events) → 按事件驱动后续流程；
 *   3) AI 回合：按速度（慢/中/快）延时后 CatanAI.decide → applyAction → render，
 *      循环直到轮到真人；
 *   4) 交易：offerTrade 进入 pendingTrade 后，对 targets 依次应答——
 *      AI 目标延时后用 CatanAI.respondTrade（v1.19 还价协议：返回 counter 时
 *      原样构造 respondTrade{accept:false,counter} 提交引擎），真人目标在底部
 *      交易抽屉中接受/拒绝/还价，动作经 onAction 回传喂给引擎；
 *   5) 存档：每步动作后自动 localStorage（覆盖每回合至少一次），另有手动存/读档
 *      （serializeState / deserializeState），设置页可弃局重开；
 *   6) 撤回（v1.20 契约 A，BGA 式确定性动作撤回）：维护 undoStack（serializeState
 *      快照，上限 20）。buildRoad / buildSettlement / buildCity / bankTrade 执行前
 *      压栈（仅真人行动者、单机/热座）；roll / buyDevCard / steal /
 *      respondTrade(accept:true) / playDevCard(knight) / endTurn 执行成功即清栈
 *      （随机性 / 跨玩家隐藏信息 / 回合边界出现后，历史不再可确定复算）。
 *      撤销 = 弹栈 deserializeState 恢复 + 同步 lastActorSeen/buildMode + 完整渲染。
 *      入口：onAction({type:'undo'})（ui.js 键盘 Z 走这里）与 App.undo()；
 *      可用性：opts.undo = { canUndo, size, online }，App.canUndo()。联机（net.active）
 *      一律禁用，界面按钮应隐藏（契约 E：undo 仅单机/热座）。
 * 7) 对局记录（v1.24 契约 B）：内存 journal——每次动作成功后记录
 *      { i, turn, actor, a:动作原文, sum:事件摘要, roll:骰点和|null,
 *        vps:各玩家 VP 快照, flow:各玩家资源漏斗增量 {prod/got/spent} }；
 *    存档外层 JSON 新增 seed 与 journal 字段（JSON.stringify 丢弃 undefined，
 *    旧档缺字段 → 读档后 journal=[]、seed=null，向后兼容）。
 * 8) 时光机（v1.24 契约 D）：对局结束后可进入复盘模式——用开局同 seed
 *    createGame 重建初始态并逐条重放 journal 中的动作（只读，相邻步进用

(function () {

  /* ==================== 本地段位 ==================== */
  // 纯本地进度：胜利 +3 分、参与 +1 分；分数决定段位。不做联网校验。
  var RANK_TIERS = [
    { id: 'bronze', name: '青铜', icon: '🥉', min: 0 },
    { id: 'silver', name: '白银', icon: '🥈', min: 6 },
    { id: 'gold', name: '黄金', icon: '🥇', min: 16 },
    { id: 'platinum', name: '铂金', icon: '💎', min: 32 },
    { id: 'legend', name: '传说', icon: '👑', min: 60 }
  ];
  var rankData = { points: 0, wins: 0, games: 0 };
  var rankAwardedThisGame = false;

  function loadRank() {
    var s = readStorage(LS_KEYS.rank);
    if (!s) return;
    try {
      var o = JSON.parse(s);
      rankData.points = Math.max(0, parseInt(o.points, 10) || 0);
      rankData.wins = Math.max(0, parseInt(o.wins, 10) || 0);
      rankData.games = Math.max(0, parseInt(o.games, 10) || 0);
    } catch (e) { /* 损坏则用默认 */ }
  }
  function saveRank() { writeStorage(LS_KEYS.rank, JSON.stringify(rankData)); }

  // 分数 → 段位信息（含进度条与距下一段所需分）
  function rankInfo(points) {
    var tier = RANK_TIERS[0], idx = 0;
    for (var i = 0; i < RANK_TIERS.length; i++) {
      if (points >= RANK_TIERS[i].min) { tier = RANK_TIERS[i]; idx = i; }
    }
    var nextTier = RANK_TIERS[idx + 1] || null;
    var floor = tier.min;
    var ceil = nextTier ? nextTier.min : 0;
    var progress = nextTier ? Math.max(0, Math.min(1, (points - floor) / (ceil - floor))) : 1;
    return {
      tier: tier.id, name: tier.name, icon: tier.icon,
      points: points, next: nextTier ? nextTier.min : 0, progress: progress
    };
  }

  // 对局结束结算：只有含真人的对局才算（全 AI 演示局不计分）
  function awardRankIfNeeded() {
    if (!state || state.phase !== 'gameover' || rankAwardedThisGame) return null;
    var humanInvolved = state.players.some(function (p) { return !p.isAI; });
    if (!humanInvolved) return null;
    rankAwardedThisGame = true;
    var before = rankInfo(rankData.points);
    var won = false;
    // 含多名真人时，「胜利」判定为第一名是真人（本地同屏不区分具体是谁）
    if (state.winner != null && state.players[state.winner] && !state.players[state.winner].isAI) won = true;
    var delta = won ? 3 : 1;
    rankData.points += delta;
    rankData.games += 1;
    if (won) rankData.wins += 1;
    saveRank();
    var after = rankInfo(rankData.points);
    var ui = getUI();
    var res = {
      won: won, delta: delta, points: rankData.points,
      name: after.name, icon: after.icon,
      upgraded: after.tier !== before.tier

    if (ui && typeof ui.setRankResult === 'function') { try { ui.setRankResult(res); } catch (e) { /* 忽略 */ } }
    if (ui && typeof ui.setRank === 'function') { try { ui.setRank(after); } catch (e) { /* 忽略 */ } }

  /* ==================== 联机对战（服务器权威） ==================== */
  var net = { active: false, started: false, seat: -1, timer: null, inFlight: false, fails: 0 };

  }

  }

  function netPollTick() {

    net.inFlight = true;
    N.state().then(function (res) {
      net.inFlight = false;
      if (!res || res.ok === false) {

      var ui = getUI();
      net.fails = 0;

      if (!res.room || !res.room.started) {

  /* ==================== 新手教程 ==================== */

  var TUTORIAL_STEPS = [
