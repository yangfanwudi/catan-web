        var v = vs[j];
        if (!v.building || !v.hexes || v.hexes.indexOf(hex.id) < 0) continue;
        var amount = v.building.kind === 'city' ? 2 : 1;
        var bucket = gains[v.building.player] || (gains[v.building.player] = {});
        bucket[res] = (bucket[res] || 0) + amount;
      }
    }
    var idxs = [];
    for (var key in gains) idxs.push(Number(key));
    idxs.sort(function (a, b) { return a - b; });
    for (var x = 0; x < idxs.length; x++) {
      var idx = idxs[x];
      var g = CatanCore.cleanRes(gains[idx]);
      if (CatanCore.resTotal(g) <= 0) continue;
      CatanCore.addRes(state.players[idx].resources, g);
      events.push({ type: 'gain', player: idx, gains: g, reason: 'roll' });
    }
  }

  // 初始布置推进：修完路后弹出队首；第一轮走完转 setup2（反向），第二轮走完进 main
  function advanceSetup(state, events) {
    state.setupQueue.shift();
    if (state.setupQueue.length > 0) return;
    var n = state.players.length;
    if (state.phase === 'setup1') {
      state.phase = 'setup2';
      state.setupQueue = [];
      for (var i = n - 1; i >= 0; i--) state.setupQueue.push(i);
      events.push({ type: 'log', text: '第一轮初始布置完成，开始第二轮（反向顺序）' });
    } else {
      state.phase = 'main';
      state.currentPlayer = 0;
      state.dice = null;
      events.push({ type: 'log', text: '初始布置完成，游戏正式开始！' });
    }
  }

  // 村/城落在港口顶点上时点亮玩家的港口标记（幂等）
  function applyPortFlags(state, p, vertexId) {
    var ports = (state.board && state.board.ports) || [];
    for (var i = 0; i < ports.length; i++) {
      var port = ports[i];
      if (!port || !Array.isArray(port.vertices) || port.vertices.indexOf(vertexId) < 0) continue;
      if (port.resource == null) p.portFlags.any = true;
      else if (RES_KEYS.indexOf(port.resource) >= 0) p.portFlags[port.resource] = true;
    }
  }

  // state.awards 维护：调 CatanVp 的 owner 函数现算，持有者变化时发事件
  function checkAwards(state, events) {
    if (!state.awards) state.awards = { longestRoad: null, largestArmy: null };

    // 最长公路（>=5，并列保持现持有者由 owner 函数处理）
    var lr = CatanVp.longestRoadOwner(state);
    var prevLR = state.awards.longestRoad;
    if (lr) {
      if (!prevLR || prevLR.player !== lr.player) {
        state.awards.longestRoad = { player: lr.player, length: lr.length };
        events.push({ type: 'longestRoad', player: lr.player, from: prevLR ? prevLR.player : null });
      } else if (prevLR.length !== lr.length) {
        prevLR.length = lr.length; // 持有者不变，仅刷新长度
      }
    } else if (prevLR) {
      state.awards.longestRoad = null;
      events.push({ type: 'log', text: playerName(state, prevLR.player) + ' 的最长公路失效（长度不足 5）' });
    }

    // 最大军队（骑士 >=3，并列保持现持有者）
    var la = CatanVp.largestArmyOwner(state);
    var prevLA = state.awards.largestArmy;
    if (la) {
      if (!prevLA || prevLA.player !== la.player) {
        state.awards.largestArmy = { player: la.player, count: la.count };
        events.push({ type: 'largestArmy', player: la.player });
      } else if (prevLA.count !== la.count) {
        prevLA.count = la.count;
      }
    } else if (prevLA) {
      state.awards.largestArmy = null;
      events.push({ type: 'log', text: playerName(state, prevLA.player) + ' 失去最大军队' });
    }
  }

  // 胜利判定：只有当前行动者在自己回合内达到目标分才结束（弃牌者/应答者不算，endTurn 后的新玩家不算）
  function maybeWin(state, events) {
    if (state.phase === 'gameover' || state.winner != null) return;
    if (state.pendingTrade) return;
    var idx;
    if (state.phase === 'setup1' || state.phase === 'setup2') {
      idx = state.setupQueue ? state.setupQueue[0] : null;
    } else if (state.phase === 'discard') {
      return; // 弃牌者行动在掷 7 玩家的回合内，不算自己回合
    } else {
      idx = state.currentPlayer;
    }
    if (idx == null || !state.players[idx]) return;
    var target = (state.config && state.config.targetVP) || 10;
    var vp = CatanVp.computeVP(state, idx);
    if (vp && vp.total >= target) {
      state.winner = idx;
      state.phase = 'gameover';
      var vps = [];
      for (var i = 0; i < state.players.length; i++) {
        vps.push(CatanVp.computeVP(state, state.players[i].idx).total);
      }
      events.push({ type: 'vp', player: idx, total: vp.total });
      events.push({ type: 'gameover', winner: idx, vps: vps });
    }
  }

  /* ================= applyAction 各动作 ================= */

  function doRoll(state, action, events) {
    if (state.phase !== 'main') return err('当前阶段不能掷骰');
    if ((state.roadBuildingPending || 0) > 0) return err('请先放置免费道路');
    if (state.dice) return err('本回合已经掷过骰子');

    // diceHistory：历次掷骰点数（两骰之和）。旧档缺字段时就地补建
    // （deserializeState 亦会补默认 []，此处兜底手工构造的状态）。
    if (!Array.isArray(state.diceHistory)) state.diceHistory = [];

    var d1, d2;
    if (houseRuleOn(state, 'balancedDice')) {
      // 房规·平衡骰：掷两组候选（d1+d2 与 d3+d4，共消耗 4 次 RNG），
      // 选使 diceHistory 各点数频率更接近理论期望（36 组合比例）的一组；
      // 平分取第一组，保证确定性
      var c1 = 1 + Math.floor(nextRandom(state) * 6);
      var c2 = 1 + Math.floor(nextRandom(state) * 6);
      var c3 = 1 + Math.floor(nextRandom(state) * 6);
      var c4 = 1 + Math.floor(nextRandom(state) * 6);
      var pickFirst = balancedDiceScore(state.diceHistory, c1 + c2) <=
                      balancedDiceScore(state.diceHistory, c3 + c4);
      d1 = pickFirst ? c1 : c3;
      d2 = pickFirst ? c2 : c4;
    } else {
      d1 = 1 + Math.floor(nextRandom(state) * 6);
      d2 = 1 + Math.floor(nextRandom(state) * 6);
    }
    state.dice = [d1, d2];
    state.diceHistory.push(d1 + d2); // 记录本次点数（平衡骰选组依据 + 复盘直方图数据源）
    events.push({ type: 'roll', d1: d1, d2: d2 });
    var sum = d1 + d2;

    if (sum === 7) {
      events.push({ type: 'log', text: '掷出 7！强盗出动，手牌超过 7 张的玩家需要弃牌' });
      var queue = [];
      for (var i = 0; i < state.players.length; i++) {
        if (CatanCore.resTotal(state.players[i].resources) > 7) queue.push(state.players[i].idx);
      }
      state.discardQueue = queue;
      for (var j = 0; j < queue.length; j++) {
        var need = Math.floor(CatanCore.resTotal(state.players[queue[j]].resources) / 2);
        events.push({ type: 'log', text: playerName(state, queue[j]) + ' 需要弃置 ' + need + ' 张手牌' });
      }
      state.phase = queue.length > 0 ? 'discard' : 'robber';
    } else {
      produce(state, sum, events);
    }
    return OK;
  }

  function doBuildRoad(state, action, events) {
    if (!Array.isArray(state.setupQueue) || state.setupQueue.length === 0) {
      if (state.phase === 'setup1' || state.phase === 'setup2') return err('初始布置状态异常');
    }
    var actor = currentActorOf(state);
    if (actor == null || !state.players[actor]) return err('当前没有可行动的玩家');
    var edge = typeof action.edgeId === 'number' ? edgeById(state, action.edgeId) : null;
    if (!edge) return err('无效的道路位置');
    if (edge.road != null) return err('该位置已经有人修路');
    var p = state.players[actor];

    // ---- 初始布置：免费，必须从刚建的村庄出发 ----
    if (state.phase === 'setup1' || state.phase === 'setup2') {
      if (p.roadIds.length >= p.settlementIds.length) return err('初始布置阶段请先建造村庄');
      var from = p.settlementIds[p.settlementIds.length - 1];
      var legalSetup = CatanCore.legalRoadEdges(state, actor, from);
      if (legalSetup.indexOf(edge.id) < 0) return err('初始道路必须从刚建造的村庄出发');
      edge.road = actor;
      p.roadIds.push(edge.id);
      events.push({ type: 'build', kind: 'road', player: actor, id: edge.id });
      advanceSetup(state, events);
      return OK;
    }

    if (state.phase !== 'main') return err('当前阶段不能修建道路');

    // ---- 路修卡免费路（官方规则允许掷骰前打出发展卡，故先于掷骰校验）----
    if ((state.roadBuildingPending || 0) > 0) {
      var legalFree = freeRoadOptions(state, p, actor);
      if (legalFree.indexOf(edge.id) < 0) return err('免费道路必须与自己的道路网相连');
      edge.road = actor;
      p.roadIds.push(edge.id);
      state.roadBuildingPending -= 1;
      events.push({ type: 'build', kind: 'road', player: actor, id: edge.id, free: true, left: state.roadBuildingPending });
      checkAwards(state, events);
      return OK;
    }

    if (state.dice == null) return err('请先掷骰');

    // ---- 付费修路 ----
    if (!CatanCore.canAfford(p.resources, costFor('road'))) return err('资源不足，修路需要 木1 砖1');
    var legal = CatanCore.legalRoadEdges(state, actor, null);
    if (legal.indexOf(edge.id) < 0) return err('道路必须与自己的道路或建筑相连');
    CatanCore.payCost(p.resources, costFor('road'));
    edge.road = actor;
    p.roadIds.push(edge.id);
    events.push({ type: 'build', kind: 'road', player: actor, id: edge.id });
    checkAwards(state, events);
    return OK;
  }

  function doBuildSettlement(state, action, events) {
    var actor = currentActorOf(state);
    if (actor == null || !state.players[actor]) return err('当前没有可行动的玩家');
    var vertex = typeof action.vertexId === 'number' ? vertexById(state, action.vertexId) : null;
    if (!vertex) return err('无效的村庄位置');
    if (vertex.building) return err('该交叉点已有建筑');
    var p = state.players[actor];

    // ---- 初始布置：免费；第二轮立即结算相邻格各 1 资源 ----
    if (state.phase === 'setup1' || state.phase === 'setup2') {
      if (p.roadIds.length !== p.settlementIds.length) return err('请先为上一个村庄修建道路');
      var legalSetup = CatanCore.legalSettlementVertices(state, actor);
      if (legalSetup.indexOf(vertex.id) < 0) return err('此处不能建造村庄（需与已有建筑保持间隔）');
      vertex.building = { player: actor, kind: 'settlement' };
      p.settlementIds.push(vertex.id);
      applyPortFlags(state, p, vertex.id); // 初始村落在港口顶点上同样点亮 portFlags（幂等）
      state.setupStep = (state.setupStep || 0) + 1;
      events.push({ type: 'build', kind: 'settlement', player: actor, id: vertex.id });
      if (state.phase === 'setup2') {
        var gains = {};
        var hexIds = vertex.hexes || [];
        for (var i = 0; i < hexIds.length; i++) {
          var h = hexById(state, hexIds[i]);
          if (!h) continue;
          var res = TERRAIN_RES[h.terrain];
          if (res) gains[res] = (gains[res] || 0) + 1;
        }
        var g = CatanCore.cleanRes(gains);
        if (CatanCore.resTotal(g) > 0) {
          CatanCore.addRes(p.resources, g);
          events.push({ type: 'gain', player: actor, gains: g, reason: 'setup' });
        }
      }
      return OK;
    }

    if (state.phase !== 'main') return err('当前阶段不能建造村庄');
    if (state.dice == null) return err('请先掷骰');
    if ((state.roadBuildingPending || 0) > 0) return err('请先放置免费道路');
    if (!CatanCore.canAfford(p.resources, costFor('settlement'))) return err('资源不足，村庄需要 木1 砖1 羊1 麦1');
    var legal = CatanCore.legalSettlementVertices(state, actor);
    if (legal.indexOf(vertex.id) < 0) return err('此处不能建造村庄（需与道路网相连且与已有建筑保持间隔）');
    CatanCore.payCost(p.resources, costFor('settlement'));
    vertex.building = { player: actor, kind: 'settlement' };
    p.settlementIds.push(vertex.id);
    applyPortFlags(state, p, vertex.id);
    events.push({ type: 'build', kind: 'settlement', player: actor, id: vertex.id });
    checkAwards(state, events);
    return OK;
  }

  function doBuildCity(state, action, events) {
    if (state.phase !== 'main') return err('当前阶段不能升级城市');
    if (state.dice == null) return err('请先掷骰');
    if ((state.roadBuildingPending || 0) > 0) return err('请先放置免费道路');
    var actor = state.currentPlayer;
    var p = state.players[actor];
    if (!p) return err('状态异常');
    var vertex = typeof action.vertexId === 'number' ? vertexById(state, action.vertexId) : null;
    if (!vertex) return err('无效的位置');
    if (!vertex.building || vertex.building.player !== actor || vertex.building.kind !== 'settlement') {
      return err('只能将自己的村庄升级为城市');
    }
    if (!CatanCore.canAfford(p.resources, costFor('city'))) return err('资源不足，城市需要 麦2 矿3');
    var legal = CatanCore.legalCityVertices(state, actor);
    if (legal.indexOf(vertex.id) < 0) return err('此处没有可升级的村庄');
    CatanCore.payCost(p.resources, costFor('city'));
    vertex.building = { player: actor, kind: 'city' };
    p.settlementIds = p.settlementIds.filter(function (id) { return id !== vertex.id; });
    p.cityIds.push(vertex.id);
    applyPortFlags(state, p, vertex.id);
    events.push({ type: 'build', kind: 'city', player: actor, id: vertex.id });
    checkAwards(state, events);
    return OK;
  }

  function doBuyDevCard(state, action, events) {
    if (state.phase !== 'main') return err('当前阶段不能购买发展卡');
    if (state.dice == null) return err('请先掷骰');
    if ((state.roadBuildingPending || 0) > 0) return err('请先放置免费道路');
    var actor = state.currentPlayer;
    var p = state.players[actor];
    if (!p) return err('状态异常');
    if (!Array.isArray(state.devDeck) || state.devDeck.length === 0) return err('发展卡堆已经抽空');
    if (!CatanCore.canAfford(p.resources, costFor('devCard'))) return err('资源不足，发展卡需要 麦1 羊1 矿1');
    CatanCore.payCost(p.resources, costFor('devCard'));
    var card = state.devDeck.shift();
    p.dev[card] = (p.dev[card] || 0) + 1;
    p.devBoughtThisTurn = (p.devBoughtThisTurn || 0) + 1;
    var bt = p.devBoughtTypes || (p.devBoughtTypes = {}); // 内部字段：本回合按类型购买的卡
    bt[card] = (bt[card] || 0) + 1;
    events.push({ type: 'devCard', player: actor, card: card });
    return OK;
  }

  function doPlayDevCard(state, action, events) {
    if (state.phase !== 'main') return err('当前阶段不能使用发展卡');
    // 官方规则：发展卡可在掷骰前打出，故不作 dice 校验；但免费路未放完前不行
    if ((state.roadBuildingPending || 0) > 0) return err('请先放置免费道路');
    var actor = state.currentPlayer;
    var p = state.players[actor];
    if (!p) return err('状态异常');
    var card = action.card;
    if (DEV_KEYS.indexOf(card) < 0) return err('未知的发展卡类型');
    // 先校验动作参数，再改状态
    if (card === 'yearOfPlenty') {
      if (RES_KEYS.indexOf(action.r1) < 0 || RES_KEYS.indexOf(action.r2) < 0) return err('丰收卡需要选择两种资源');
    } else if (card === 'monopoly') {
      if (RES_KEYS.indexOf(action.resource) < 0) return err('垄断卡需要选择一种资源');
    }
    // 官方规则：每回合至多打出 1 张发展卡
    if ((p.devPlayedThisTurn || 0) >= 1) return err('每回合只能打出 1 张发展卡');
    if (devPlayableCount(p, card) <= 0) {
      if ((p.dev[card] || 0) > 0) return err('本回合购买的发展卡不能立即使用');
      return err('没有可使用的' + (DEV_NAMES[card] || '') + '卡');
    }
    p.dev[card] -= 1;
    p.devPlayedThisTurn = (p.devPlayedThisTurn || 0) + 1;

    if (card === 'knight') {
      p.knightsPlayed = (p.knightsPlayed || 0) + 1;
      events.push({ type: 'log', text: playerName(state, actor) + ' 打出骑士（当前军队 ' + p.knightsPlayed + ' 骑）' });
      checkAwards(state, events); // 可能夺/保最大军队
      state.phase = 'robber'; // 之后进入搬强盗 → 偷窃流程
      events.push({ type: 'log', text: '请移动强盗到新的格子' });
    } else if (card === 'roadBuilding') {
      state.roadBuildingPending = 2;
      events.push({ type: 'log', text: playerName(state, actor) + ' 使用道路修建卡：可连续免费修建 2 条道路' });
    } else if (card === 'yearOfPlenty') {
      var gains = {};
      gains[action.r1] = (gains[action.r1] || 0) + 1;
      gains[action.r2] = (gains[action.r2] || 0) + 1;
      var g = CatanCore.cleanRes(gains);
      CatanCore.addRes(p.resources, g);
      events.push({ type: 'gain', player: actor, gains: g, reason: 'yearOfPlenty' });
      events.push({ type: 'log', text: playerName(state, actor) + ' 使用丰收卡获得 ' + resText(g) });
    } else if (card === 'monopoly') {
      var resKey = action.resource;
      var total = 0;
      var parts = [];
      for (var i = 0; i < state.players.length; i++) {
        var other = state.players[i];
        if (other.idx === actor) continue;
        var amt = other.resources[resKey] || 0;
        if (amt > 0) {
          var take = {}; take[resKey] = -amt;
          CatanCore.addRes(other.resources, take);
          total += amt;
          parts.push(other.name + ' ' + amt + ' 张');
        }
      }
      var gainRes = {}; gainRes[resKey] = total;
      CatanCore.addRes(p.resources, gainRes);
      if (total > 0) {
        var gainObj = {}; gainObj[resKey] = total;
        events.push({ type: 'gain', player: actor, gains: gainObj, reason: 'monopoly' });
      }
      events.push({
        type: 'log',
        text: playerName(state, actor) + ' 打出垄断卡，夺走所有玩家的' + RES_NAMES[resKey] +
              '（共 ' + total + ' 张：' + (parts.join('、') || '无人持有') + '）'
      });
    }
    return OK;
  }

  function doMoveRobber(state, action, events) {
    if (state.phase !== 'robber') return err('当前不能移动强盗');
    var actor = state.currentPlayer;
    var hex = typeof action.hexId === 'number' ? hexById(state, action.hexId) : null;
    if (!hex) return err('无效的格子');
    if (!isLand(hex.terrain)) return err('强盗只能放在陆地格子');
    if (hex.id === state.robber) {
      // 房规兜底：友好强盗开启且无任何合法落点时允许停留原格（事件照常发、
      // 流程照常进入 steal）；其余情形维持「不能留在原地」
      if (houseRuleOn(state, 'friendlyRobber') && !hasFriendlyRobberTarget(state)) {
        events.push({ type: 'robber', player: actor, hexId: hex.id });
        state.phase = 'steal';
        return OK;
      }
      return err('强盗不能留在原地，请选择其他陆地格');
    }
    if (!friendlyRobberAllows(state, hex.id)) {
      return err('房规·友好强盗：不能放到总分 ≤2 玩家的村庄/城市相邻格');
    }
    state.robber = hex.id;
    events.push({ type: 'robber', player: actor, hexId: hex.id });
    state.phase = 'steal';
    return OK;
  }

  function doSteal(state, action, events) {
    if (state.phase !== 'steal') return err('当前不能偷窃');
    var actor = state.currentPlayer;
    var p = state.players[actor];
    if (!p) return err('状态异常');
    var targets = stealTargets(state, actor);
    var t = action.target;
    if (typeof t !== 'number' || !isFinite(t)) return err('缺少偷窃对象');

    if (t === -1) {
      if (targets.length > 0) return err('存在可偷窃的玩家，必须选择目标');
      state.phase = 'main';
      events.push({ type: 'steal', from: -1, to: actor, count: 0 });
      return OK;
    }
    if (!Number.isInteger(t) || t < 0 || t >= state.players.length || t === actor) return err('无效的偷窃对象');
    if (targets.indexOf(t) < 0) return err('该玩家不在强盗格旁边或没有手牌，不能偷窃');

    var victim = state.players[t];
    var pool = [];
    for (var i = 0; i < RES_KEYS.length; i++) {
      var k = RES_KEYS[i];
      for (var c = 0; c < (victim.resources[k] || 0); c++) pool.push(k);
    }
    var pick = pool[Math.floor(nextRandom(state) * pool.length)]; // 随机偷 1 张
    var lose = {}; lose[pick] = -1;
    var win = {}; win[pick] = 1;
    CatanCore.addRes(victim.resources, lose);
    CatanCore.addRes(p.resources, win);
    events.push({ type: 'steal', from: t, to: actor, count: 1 });
    state.phase = 'main';
    return OK;
  }

  function doBankTrade(state, action, events) {
    if (state.phase !== 'main') return err('当前阶段不能与银行交易');
    if (state.dice == null) return err('请先掷骰');
    if ((state.roadBuildingPending || 0) > 0) return err('请先放置免费道路');
    var actor = state.currentPlayer;
    var p = state.players[actor];
    if (!p) return err('状态异常');
    var give = normRes(action.give);

  // v1.23 契约 B：砖/矿/麦是升城/扩城燃料，向威胁玩家出售即资敌
  var FEED_RES = { brick: 1, ore: 1, wheat: 1 };

  // v1.23 契约 E：大师权重表（难度映射）——easy 全 0（行为与 v1.22 一致）、
  // normal 部分权重（各项半量）、hard 全量（契约 B 的 −2/份、契约 C/D 全权重）
  var MASTER_W = {
    easy:   { feedPenalty: 0, blockCounter: false, blockCut: 0, blockSpot: 0, lookahead: 0 },
    normal: { feedPenalty: 1, blockCounter: true,  blockCut: 0.5, blockSpot: 0.5, lookahead: 0.5 },
    hard:   { feedPenalty: 2, blockCounter: true,  blockCut: 1, blockSpot: 1, lookahead: 1 }
  };

  function masterWeights(diff) {
    return MASTER_W[diff] || MASTER_W.normal;
  }

  /* ------------------------------ 通用小工具 ------------------------------ */

  function resTotal(res) {
    if (!res) return 0;
    var t = 0;
    for (var i = 0; i < RES_KEYS.length; i++) t += res[RES_KEYS[i]] || 0;
    return t;
  }

  // 计算 cost 相对 have 的缺口：{ map:{res:缺几张}, total:合计 }
  function missingFor(cost, have) {
    var map = {}, total = 0;
    for (var k in cost) {
      var d = (cost[k] || 0) - ((have && have[k]) || 0);
      if (d > 0) { map[k] = d; total += d; }
    }
    return { map: map, total: total };
  }

  function normalizeDiff(diff) {
    if (diff === 'easy') return 'easy';
    // v1.23 契约 E：预留「大师」档（设置页非必须项）——行为按 hard 全量权重
    if (diff === 'hard' || diff === 'master') return 'hard';
    return 'normal';
  }

  // 评分噪声：easy 抖动大（常做出次优选择），hard 几乎理性
  function noiseFor(diff) {
    var n = DIFF_NOISE[diff];
    if (n == null) n = 0.5;
    return (Math.random() * 2 - 1) * n;
  }

  function groupByType(actions) {
    var map = {};
    for (var i = 0; i < actions.length; i++) {
      var t = actions[i] && actions[i].type;
      if (!t) continue;
      if (!map[t]) map[t] = [];
      map[t].push(actions[i]);
    }
    return map;
  }

  /* --------------------------- 引擎获取（UMD 环境） --------------------------- */
  // 浏览器里 engine.js 先于本文件加载，存在全局 CatanEngine；
  // node 下 engine.js 只导出 module.exports，这里按相对路径兜底 require。
  var _engineCache = null;
  function getEngine() {
    if (_engineCache) return _engineCache;
    if (typeof CatanEngine !== 'undefined' && CatanEngine) {
      _engineCache = CatanEngine;
      return _engineCache;
    }
    if (typeof require === 'function') {
      try {
        var m = require('./engine.js');
        if (m) { _engineCache = m; return _engineCache; }
      } catch (e) { /* 忽略，尝试下一个路径 */ }
      try {
        var m2 = require('../js/engine.js');
        if (m2) { _engineCache = m2; return _engineCache; }
      } catch (e2) { /* 引擎确实不可用 */ }
    }
    return null;
  }

  /* ------------------------------ 局面索引与评估 ------------------------------ */

  // 一次性建好查表结构与公共局势信息（每次 decide 调用重建，纯只读）
  function buildCtx(state, engine) {
    var ctx = { hexById: {}, vtxById: {}, edgeById: {}, portAt: {} };
    var board = state.board || {}; // 防御：容忍缺失 board 的最小 state
    var hexes = board.hexes || [];
    var vtxs = board.vertices || [];
    var edges = board.edges || [];
    var ports = board.ports || [];
    var i, j;

    for (i = 0; i < hexes.length; i++) ctx.hexById[hexes[i].id] = hexes[i];
    for (i = 0; i < vtxs.length; i++) ctx.vtxById[vtxs[i].id] = vtxs[i];
    for (i = 0; i < edges.length; i++) ctx.edgeById[edges[i].id] = edges[i];
    for (i = 0; i < ports.length; i++) {
      var vs = ports[i].vertices || [];
      for (j = 0; j < vs.length; j++) ctx.portAt[vs[j]] = ports[i];
    }

    // 是否还存在满足间隔规则（相邻顶点无建筑）的空顶点
    ctx.settleSpotExists = false;
    for (i = 0; i < vtxs.length && !ctx.settleSpotExists; i++) {
      var v0 = vtxs[i];
      if (v0.building) continue;
      var adj0 = v0.adjacent || [];
      var ok = true;
      for (j = 0; j < adj0.length; j++) {
        var w0 = ctx.vtxById[adj0[j]];
        if (w0 && w0.building) { ok = false; break; }
      }
      if (ok) ctx.settleSpotExists = true;
    }

    ctx.lr = longestRoadInfo(state, ctx.vtxById); // 各家最长公路长度 + 持有者
    ctx.army = armyInfo(state);                   // 最大军队持有者

    // 各家公开分：优先用引擎 computeVP（SPEC 契约字段），失败则自行估算
    ctx.publicVP = [];
    for (i = 0; i < state.players.length; i++) {
      var vp = null;
      if (engine && typeof engine.computeVP === 'function') {
        try { vp = engine.computeVP(state, i).public; } catch (e) { vp = null; }
      }
      if (vp == null) vp = manualPublicVP(state, i, ctx.lr, ctx.army);
      ctx.publicVP[i] = vp;
    }

    ctx.leader = 0;
    for (i = 1; i < state.players.length; i++) {
      if (ctx.publicVP[i] > ctx.publicVP[ctx.leader]) ctx.leader = i;
    }
    ctx.targetVP = (state.config && state.config.targetVP) || 10;

    // v1.23 契约 A：威胁度 —— 各家总 VP（computeVP.total，含暗分）、
    // 距胜利缺口 gap = targetVP − totalVP、产能（村×1/城×2 × 概率点）；
    // 缺口 ≤ 2 的玩家记入 ctx.threats / ctx.threatMap（含自己，调用方排除）
    ctx.totalVP = [];
    ctx.gap = [];
    ctx.prod = [];
    ctx.threats = [];
    ctx.threatMap = {};
    for (i = 0; i < state.players.length; i++) {
      ctx.totalVP[i] = totalVPOf(state, i, engine, ctx);
      ctx.gap[i] = ctx.targetVP - ctx.totalVP[i];
      ctx.prod[i] = prodOfPlayer(state, ctx, i);
      if (ctx.gap[i] <= 2) {
        ctx.threats.push(i);
        ctx.threatMap[i] = true;
      }
    }
    return ctx;
  }

  // 玩家总 VP：优先 SPEC 公开 API computeVP.total，失败则按公开分 + 暗分估算
  function totalVPOf(state, i, engine, ctx) {
    if (engine && typeof engine.computeVP === 'function') {
      try { return engine.computeVP(state, i).total; } catch (e) { /* 走兜底 */ }
    }
    var p = state.players[i];
    var pub = ctx ? ctx.publicVP[i] : manualPublicVP(state, i, null, null);
    return pub + ((p.dev && p.dev.vp) || 0);
  }

  // v1.23 契约 A：玩家产能 = Σ 建筑（村×1 / 城×2）× 覆盖数字格概率点
  // （强盗所在格当前被压住，不计入；口径与 ui.js 面板「产能」一致）
  function prodOfPlayer(state, ctx, idx) {
    var s = 0;
    var vtxs = (state.board && state.board.vertices) || [];
    for (var i = 0; i < vtxs.length; i++) {
      var v = vtxs[i];
      if (!v.building || v.building.player !== idx) continue;
      var mult = v.building.kind === 'city' ? 2 : 1;
      s += prodValue(vertexProd(ctx, v, state, false)) * mult;
    }
    return s;
  }

  function manualPublicVP(state, i, lr, army) {
    var p = state.players[i];
    var vp = ((p.settlementIds && p.settlementIds.length) || 0) +
      2 * ((p.cityIds && p.cityIds.length) || 0);
    if (lr && lr.holder === i) vp += 2;
    if (army && army.holder === i) vp += 2;
    return vp;
  }

  // 某玩家的最长公路长度（可叠加一条假想新路 edgeId 用于预演）。
  // 规则要点：路网是图的最长路径；对手建筑所在顶点会截断路径（可到不可穿）。
  function longestRoadLen(state, playerIdx, extraEdgeId, vtxById) {
    var adj = {};
    var edges = (state.board && state.board.edges) || [];
    var i, e;
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.road === playerIdx || e.id === extraEdgeId) {
        var a = e.vertices[0], b = e.vertices[1];
        if (!adj[a]) adj[a] = [];
        if (!adj[b]) adj[b] = [];
        adj[a].push({ eid: e.id, to: b });
        adj[b].push({ eid: e.id, to: a });
      }
    }
    var best = 0;
    function dfs(v, used, len) {
      if (len > best) best = len;
      var vx = vtxById[v];
      // 站在对手建筑顶点上不能再延伸（起点除外）
      if (len > 0 && vx && vx.building && vx.building.player !== playerIdx) return;
      var list = adj[v];
      if (!list) return;
      for (var k = 0; k < list.length; k++) {
        var step = list[k];
        if (used[step.eid]) continue;
        used[step.eid] = 1;
        dfs(step.to, used, len + 1);
        used[step.eid] = 0;
      }
    }
    for (var v in adj) {
      if (Object.prototype.hasOwnProperty.call(adj, v)) dfs(Number(v), {}, 0);
    }
    return best;
  }

  function longestRoadInfo(state, vtxById) {
    var lens = [];
    var maxLen = 0, holder = -1;
    for (var i = 0; i < state.players.length; i++) {
      lens[i] = longestRoadLen(state, i, null, vtxById);
      if (lens[i] >= 5 && lens[i] > maxLen) { maxLen = lens[i]; holder = i; }
    }
    return { lens: lens, maxLen: maxLen, holder: holder };
  }

  function armyInfo(state) {
    var holder = -1, max = 0;
    for (var i = 0; i < state.players.length; i++) {
      var k = state.players[i].knightsPlayed || 0;
      if (k >= 3 && k > max) { max = k; holder = i; }
    }
    return { holder: holder, max: max };
  }

  // 顶点产出（单位：pip）：ignoreRobber=false 时强盗所在格不计入
  function vertexProd(ctx, v, state, ignoreRobber) {
    var acc = {};
    for (var i = 0; i < v.hexes.length; i++) {
      var hex = ctx.hexById[v.hexes[i]];
      var res = hex && TERRAIN_RES[hex.terrain];
      if (res && hex.number && PIPS[hex.number] &&
        (ignoreRobber || hex.id !== state.robber)) {
        acc[res] = (acc[res] || 0) + PIPS[hex.number];
      }
    }
    return acc;
  }

  function prodValue(prod) {
    var s = 0;
    for (var k in prod) s += prod[k] * (RES_VALUE[k] || 1);
    return s;
  }

  // 空顶点作为建村点的长期价值（与玩家无关的部分 + 港口加成）
  function spotScore(ctx, state, vid) {
    var v = ctx.vtxById[vid];
    if (!v || v.building) return -1;
    var prod = vertexProd(ctx, v, state, true); // 长期价值，不考虑强盗临时位置
    var s = prodValue(prod);
    var resSet = {}, k;
    for (k in prod) resSet[k] = 1;

    // 港口加成：2:1 资源港且相邻有该资源产出时价值最大
    var port = ctx.portAt[vid];
    if (port) {
      if (port.rate === 2 && port.resource) s += resSet[port.resource] ? 0.5 : 0.1;
      else s += 0.3; // 3:1 通用港
    }

    // 资源多样性：三种以上资源更抗运气
    var diversity = 0;
    for (k in resSet) diversity++;
    s += diversity >= 3 ? 0.45 : (diversity === 2 ? 0.15 : 0);
    if (resSet.wheat && resSet.ore) s += 0.35; // 城市燃料组合
    if (resSet.wood && resSet.brick) s += 0.2; // 扩张组合
    return s;
  }

  // 封锁/争抢价值：该点贴着对手建筑或对手路时，建在这里等于抢黄金点
  function denyBonus(state, ctx, myIdx, vid, diff) {
    if (diff === 'easy') return 0;
    var v = ctx.vtxById[vid];
    if (!v || v.building) return 0;
    var contested = false;
    var adj = v.adjacent || [];
    for (var i = 0; i < adj.length; i++) {
      var w = ctx.vtxById[adj[i]];
      if (w && w.building && w.building.player !== myIdx) contested = true;
    }
    var vEdges = v.edges || [];
    for (var j = 0; j < vEdges.length; j++) {
      var e = ctx.edgeById[vEdges[j]];
      if (e && e.road != null && e.road !== myIdx) contested = true;
    }
    if (!contested) return 0;
    var base = spotScore(ctx, state, vid) * (diff === 'hard' ? 0.35 : 0.15);
    if (diff === 'hard' && ctx.leader !== myIdx &&
      ctx.publicVP[ctx.leader] > ctx.publicVP[myIdx]) base *= 1.3;
    return base;
  }

  function touchesMyRoad(state, ctx, myIdx, vid) {
    var v = ctx.vtxById[vid];
    var vEdges = (v && v.edges) || [];
    for (var i = 0; i < vEdges.length; i++) {
      var e = ctx.edgeById[vEdges[i]];
      if (e && e.road === myIdx) return true;
    }
    return false;
  }

  /* -------------------- v1.23 契约 C：卡位与截路加权项 -------------------- */

  // 威胁优先级：距胜利缺口越小越优先（缺口 ≤2 才是威胁，这里做 1.0~1.24 的缩放）
  function threatPriority(ctx, t) {
    var gap = ctx.gap && ctx.gap[t] != null ? ctx.gap[t] : 99;
    return 1 + 0.12 * Math.max(0, 2 - gap);
  }

  // 截路收益系数：对方现持最长公路称号（打断直接丢 +2 分）> 已达 5 段 > 4 段在望
  function roadAwardFactor(ctx, t) {
    var len = (ctx.lr && ctx.lr.lens && ctx.lr.lens[t]) || 0;
    if (ctx.lr && ctx.lr.holder === t) return 1.6;
    if (len >= 5) return 1.2;
    if (len >= 4) return 0.9;
    return 0.5;
  }

  // 顶点索引副本：vid 上带一座「我的假想建筑」（绝不改真实 state，仅传给
  // 本文件自有的 longestRoadLen 做截路预演——该函数只读 building.player）
  function mockVtxBlocked(ctx, vid, myIdx) {
    var mock = {};
    for (var k in ctx.vtxById) {
      if (Object.prototype.hasOwnProperty.call(ctx.vtxById, k)) mock[k] = ctx.vtxById[k];
    }
    var v = ctx.vtxById[vid];
    var copy = {};
    for (var k2 in v) {
      if (Object.prototype.hasOwnProperty.call(v, k2)) copy[k2] = v[k2];
    }
    copy.building = { player: myIdx, kind: 'settlement' };
    mock[vid] = copy;
    return mock;
  }

  function touchesRoadOf(ctx, t, vid) {
    var v = ctx.vtxById[vid];
    var vEdges = (v && v.edges) || [];
    for (var i = 0; i < vEdges.length; i++) {
      var e = ctx.edgeById[vEdges[i]];
      if (e && e.road === t) return true;
    }
    return false;
  }

  // 建村卡位加权项（契约 C）：对每个威胁玩家
  //   ① 截路 —— 模拟我建村后其最长公路的损失（对手建筑截断对手路径），
  //      损失越大、其公路越接近称号价值越高；
  //   ② 抢占扩张方向 —— 该点贴着威胁玩家的路（其下一张路可达）且产能可观，
  //      即使自身收益一般也加分，抢在其前面落子。
  // w.blockCut / w.blockSpot 为 0（easy 或 normal/hard 权重缩放）时自动减弱/关闭。
  function blockBonusSettlement(state, ctx, myIdx, vid, diff) {
    var w = masterWeights(diff);
    if ((w.blockCut <= 0 && w.blockSpot <= 0) || !ctx.threats || !ctx.threats.length) return 0;
    var v = ctx.vtxById[vid];
    if (!v || v.building) return 0;
    var s = 0, mock = null;
    var spotCap = w.blockSpot > 0 ? Math.min(spotScore(ctx, state, vid), 3.2) : 0;
    for (var i = 0; i < ctx.threats.length; i++) {
      var t = ctx.threats[i];
      if (t === myIdx) continue;
      var tl = (ctx.lr.lens && ctx.lr.lens[t]) || 0;
      var pri = threatPriority(ctx, t);
      if (w.blockCut > 0 && tl >= 3) {
        if (!mock) mock = mockVtxBlocked(ctx, vid, myIdx);
        var cut = tl - longestRoadLen(state, t, null, mock);
        if (cut > 0) s += w.blockCut * 0.8 * cut * roadAwardFactor(ctx, t) * pri;
      }
      if (spotCap > 0 && touchesRoadOf(ctx, t, vid)) {
        s += w.blockSpot * 0.45 * spotCap * pri;
      }
    }
    return s;
  }

  // 修路截路加权项（契约 C）：该边若被威胁玩家修走，其最长公路能涨多少
  // （延长/桥接两段都算，由带假想边的最长公路预演精确给出）——
  // 我先占下 = 打断其最长公路路径的推进，在望称号时价值最高。
  function blockBonusRoad(state, ctx, myIdx, edgeId, diff) {
    var w = masterWeights(diff);
    if (w.blockCut <= 0 || !ctx.threats || !ctx.threats.length) return 0;
    var e = ctx.edgeById[edgeId];
    if (!e || e.road != null) return 0;
    var s = 0;
    for (var i = 0; i < ctx.threats.length; i++) {
      var t = ctx.threats[i];
      if (t === myIdx) continue;
      var tl = (ctx.lr.lens && ctx.lr.lens[t]) || 0;
      var gain = longestRoadLen(state, t, edgeId, ctx.vtxById) - tl;
      if (gain > 0) {
        s += w.blockCut * 0.55 * Math.min(gain, 2) * roadAwardFactor(ctx, t) * threatPriority(ctx, t);
      }
    }
    return s;
  }

  /* ---------------------- v1.23 契约 D：1-ply 前瞻 ---------------------- */

  // 主阶段建造候选动作的一层期望评估（不搜索对手回应）：
  //   deltaVP   动作后自身 VP 变化（村/城 +1，买发展卡取牌堆期望）
  //   deltaProd 动作后自身产能变化（强盗感知口径，村/城按覆盖格概率点）
  // 期望 = 产能增益 × 折现 + VP 增益 × 冲线紧迫度（动作后缺口 ≤2 加倍计价，
  // 即「分差」收窄的期望价值）。w.lookahead = 0（easy）时恒为 0。
  function ply1Lookahead(ctx, myIdx, diff, deltaVP, deltaProd) {
    var w = masterWeights(diff);
    if (w.lookahead <= 0) return 0;
    var gapAfter = ctx.targetVP - ((ctx.totalVP[myIdx] || 0) + deltaVP);
    var urgency = gapAfter <= 2 ? 2.2 : (gapAfter <= 4 ? 1.0 : 0.55);
    return w.lookahead * (deltaVP * urgency + deltaProd * 0.3);
  }

  // 顶点当前产能价值（强盗感知口径），供 1-ply 前瞻的 deltaProd 使用
  function vertexProdValueNow(state, ctx, v) {
    return v ? prodValue(vertexProd(ctx, v, state, false)) : 0;
  }

  // 我因强盗被压住的生产价值
  function myBlockedValue(state, ctx, playerIdx) {
    var s = 0;
    var vtxs = (state.board && state.board.vertices) || [];
    for (var i = 0; i < vtxs.length; i++) {
      var v = vtxs[i];
      if (!v.building || v.building.player !== playerIdx) continue;
      for (var j = 0; j < v.hexes.length; j++) {
        var hex = ctx.hexById[v.hexes[j]];
        var res = hex && TERRAIN_RES[hex.terrain];
        if (res && hex.number && hex.id === state.robber) {
          s += PIPS[hex.number] * (RES_VALUE[res] || 1);
        }
      }
    }
    return s;
  }

  // 强盗移到 hexId 的评分：打对手产出、避免打自己、hard 加重打击领先者
  function scoreRobberHex(state, ctx, myIdx, hexId, diff) {
    var hex = ctx.hexById[hexId];
    var res = hex && TERRAIN_RES[hex.terrain];
    if (!hex || !res || !hex.number) return -10; // 沙漠/海几乎无意义
    var pip = PIPS[hex.number] * (RES_VALUE[res] || 1);
    var harm = 0, own = 0, leaderHarm = 0;
    var vtxs = (state.board && state.board.vertices) || [];
    for (var i = 0; i < vtxs.length; i++) {
      var v = vtxs[i];
      if (!v.building || v.hexes.indexOf(hexId) < 0) continue;
      if (v.building.player === myIdx) own += pip;
      else {
        harm += pip;
        if (v.building.player === ctx.leader) leaderHarm += pip;
      }
    }
    var s = harm - 1.4 * own;
    if (diff === 'hard' && leaderHarm > 0) s += 0.5 * Math.min(leaderHarm, 5);
    return s;
  }

  // 我在银行/港口交易该资源的汇率
  function portRate(me, res) {
    if (me.portFlags) {
      if (me.portFlags[res]) return 2;
      if (me.portFlags.any) return 3;
    }
    return 4;
  }

  /* ------------------------------ 目标与需求 ------------------------------ */

  // 当前玩家的建造目标清单（按优先级排序），供丰收/垄断/交易共用
  function buildGoalList(state, me, myIdx, diff, ctx) {
    var goals = [];
    if (me.settlementIds && me.settlementIds.length > 0) {
      goals.push({ kind: 'city', cost: COST.city, value: 3.0 });
    }
    if (ctx.settleSpotExists) {
      goals.push({ kind: 'settlement', cost: COST.settlement, value: 2.6 });
    }
    goals.push({ kind: 'dev', cost: COST.dev, value: 1.8 });
    if ((ctx.bestRoadValue || 0) >= 2.0) {
      goals.push({ kind: 'road', cost: COST.road, value: 1.6 });
    }
    return goals;
  }

  // 资源对我的边际价值：是当前目标缺口 → 更值钱；大量富余 → 不值钱
  function needWeight(me, r) {
    var hasSettlement = me.settlementIds && me.settlementIds.length > 0;
    var costs = [COST.city, COST.settlement, COST.dev];
    for (var i = 0; i < costs.length; i++) {
      if (i === 0 && !hasSettlement) continue;
      var miss = missingFor(costs[i], me.resources);
      if (miss.map[r]) return 1.4;
    }
    if ((me.resources[r] || 0) >= 3) return 0.7;
    return 1.0;
  }

  /* ------------------------------ 建置阶段 ------------------------------ */

  function decideSetup(state, actions, myIdx, diff, ctx) {
    var byType = groupByType(actions);
    var i, a, s;

    // 先村后路：能建村时挑 pip 加权最高的点
    if (byType.buildSettlement && byType.buildSettlement.length) {
      var best = null, bestScore = -Infinity;
      for (i = 0; i < byType.buildSettlement.length; i++) {
        a = byType.buildSettlement[i];
        s = spotScore(ctx, state, a.vertexId);
        s += denyBonus(state, ctx, myIdx, a.vertexId, diff); // 顺手抢黄金点
        s += blockBonusSettlement(state, ctx, myIdx, a.vertexId, diff); // v1.23 契约 C 卡位/截路
        s += noiseFor(diff);
        if (s > bestScore) { bestScore = s; best = a; }
      }
      if (best) return { type: 'buildSettlement', vertexId: best.vertexId };
    }

    // 建村后的免费路：朝更有价值的方向延伸
    if (byType.buildRoad && byType.buildRoad.length) {
      var bestE = null, bestEScore = -Infinity;
      for (i = 0; i < byType.buildRoad.length; i++) {
        a = byType.buildRoad[i];
        s = setupRoadScore(state, ctx, myIdx, a.edgeId, diff) + noiseFor(diff) * 0.5;
        if (s > bestEScore) { bestEScore = s; bestE = a; }
      }
      if (bestE) return { type: 'buildRoad', edgeId: bestE.edgeId };
    }

    return actions[0];
  }

  function setupRoadScore(state, ctx, myIdx, edgeId, diff) {
    var e = ctx.edgeById[edgeId];
    if (!e) return 0;
    var s = blockBonusRoad(state, ctx, myIdx, edgeId, diff); // v1.23 契约 C 截路
    for (var i = 0; i < e.vertices.length; i++) {
      var vid = e.vertices[i];
      var v = ctx.vtxById[vid];
      if (!v) continue;
      if (!v.building) {
        s += 0.6 * spotScore(ctx, state, vid); // 这条路通向的建村点
        // 再看一步：该点继续往外能到多好的地方
        var onward = 0;
        var adj = v.adjacent || [];
        for (var j = 0; j < adj.length; j++) {
          if (e.vertices.indexOf(adj[j]) >= 0) continue;
          var w = ctx.vtxById[adj[j]];
          if (w && !w.building) {
            var sc = spotScore(ctx, state, adj[j]);
            if (sc > onward) onward = sc;
          }
        }
        s += 0.18 * onward;
        s += denyBonus(state, ctx, myIdx, vid, diff) * 0.5;
      } else if (v.building.player === myIdx) {
        s += 0.2;
      }
    }
    return s;
  }

  /* ------------------------------ 弃牌阶段 ------------------------------ */

  // 掷 7 后弃 floor(n/2)：从「数量多且价值低」的资源弃起，边际价值递减。
  // 难度差异：hard 优先保住当前建造目标缺口资源；easy 引入随机噪声常弃错牌
  function decideDiscard(state, myIdx, diff) {
    var me = state.players[myIdx];
    var counts = {}, total = 0, i;
    for (i = 0; i < RES_KEYS.length; i++) {
      var c = me.resources[RES_KEYS[i]] || 0;
      counts[RES_KEYS[i]] = c;
      total += c;
    }
    var need = Math.floor(total / 2);
    var cards = {};
    var guard = 100;
    while (need > 0 && guard-- > 0) {
      var pick = null, pickVal = Infinity;
      for (var j = 0; j < RES_KEYS.length; j++) {
        var r = RES_KEYS[j];
        if (counts[r] <= 0) continue;
        // 边际保留价值：数量越多越不心疼，本身价值越低越先弃
        var v = (RES_VALUE[r] || 1) * Math.pow(0.85, counts[r] - 1);
        if (diff === 'hard') v *= needWeight(me, r);          // 目标缺口资源更值得保留
        else if (diff === 'easy') v += noiseFor(diff) * 0.6;  // 随机性弃牌（次优选择）
        if (v < pickVal) { pickVal = v; pick = r; }
      }
      if (!pick) break;
      cards[pick] = (cards[pick] || 0) + 1;
      counts[pick] -= 1;
      need -= 1;
    }
    return { type: 'discard', cards: cards };
  }

  /* ------------------------------ 强盗 / 偷窃 ------------------------------ */

  function bestRobberAction(state, actions, ctx, myIdx, diff) {
    var best = null, bestScore = -Infinity;
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      if (a.type !== 'moveRobber') continue;
      var s = scoreRobberHex(state, ctx, myIdx, a.hexId, diff) + noiseFor(diff) * 0.5;
      if (s > bestScore) { bestScore = s; best = a; }
    }
    return best ? { type: 'moveRobber', hexId: best.hexId } : null;
  }

  function decideRobber(state, actions, myIdx, diff, ctx) {
    var a = bestRobberAction(state, actions, ctx, myIdx, diff);
    if (a) return a;
    var byType = groupByType(actions);
    if (byType.moveRobber && byType.moveRobber.length) {
      return { type: 'moveRobber', hexId: byType.moveRobber[0].hexId };
    }
    return actions[0];
  }

  // 偷手牌最多的对手（hard 额外偏爱领先者）
  function bestStealAction(state, actions, ctx, myIdx, diff) {
    var best = null, bestScore = -Infinity;
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      if (a.type !== 'steal') continue;
      var s = 0;
      if (a.target != null && a.target >= 0) {
        var p = state.players[a.target];
        s = p ? resTotal(p.resources) : 0;
        if (diff === 'hard' && a.target === ctx.leader) s += 2;
        s += noiseFor(diff) * 0.5;
      }
      if (s > bestScore) { bestScore = s; best = a; }
    }
    return best ? { type: 'steal', target: best.target } : null;
  }

  /* ------------------------------ 主回合 ------------------------------ */

  function decideMain(state, actions, myIdx, diff, ctx) {
    var byType = groupByType(actions);
    var me = state.players[myIdx];
    var i;

    // 预算所有可建路的评分（路修卡判断与银行交易目标都要用）
    var roadOpts = (byType.buildRoad && byType.buildRoad.length)
      ? bestRoadOption(state, byType.buildRoad, myIdx, diff, ctx) : null;
    ctx.bestRoadValue = roadOpts ? roadOpts.value : 0;

    // 0) 先掷骰
    if (byType.roll && byType.roll.length && state.dice == null) {
      return { type: 'roll' };
    }

    // 0.5) 冲线优先：本回合能直接获胜的建造立刻执行
    var winMove = findWinningMove(state, byType, myIdx, ctx);
    if (winMove) return winMove;

    // 1) 骑士：被压得惨 / 能夺最大军队 / 有值得打的强盗落点
    if (hasDevCard(byType, 'knight') && shouldPlayKnight(state, me, myIdx, diff, ctx)) {
      return { type: 'playDevCard', card: 'knight' };
    }

    // 2) 丰收+2：能立刻凑齐高价值建造时使用
    if (hasDevCard(byType, 'yearOfPlenty')) {
      var picks = yopPick(state, me, myIdx, diff, ctx);
      if (picks) return { type: 'playDevCard', card: 'yearOfPlenty', r1: picks[0], r2: picks[1] };
    }

    // 3) 升城 vs 建村，取价值更高者
    var cityOpt = bestCityOption(state, byType, myIdx, diff, ctx);
    var settleOpt = bestSettlementOption(state, byType, myIdx, diff, ctx);
    if (cityOpt || settleOpt) {
      var cv = cityOpt ? cityOpt.value + 0.3 + noiseFor(diff) * 0.3 : -Infinity; // 城略优先
      var sv = settleOpt ? settleOpt.value + noiseFor(diff) * 0.3 : -Infinity;
      if (cv >= sv && cityOpt) return { type: 'buildCity', vertexId: cityOpt.vertexId };
      if (settleOpt) return { type: 'buildSettlement', vertexId: settleOpt.vertexId };
    }

    // 4) 路修卡：有两条以上值得修的路时打出（免费省 4 张资源）
    if (hasDevCard(byType, 'roadBuilding') && byType.buildRoad && byType.buildRoad.length &&
      shouldPlayRoadBuilding(state, me, myIdx, diff, ctx, byType.buildRoad)) {
      return { type: 'playDevCard', card: 'roadBuilding' };
    }

    // 5) 建路：免费额度内必建；否则过价值阈值，或手牌爆满时排水
    if (roadOpts) {
      if ((state.roadBuildingPending || 0) > 0) {
        return { type: 'buildRoad', edgeId: roadOpts.edgeId };
      }
      if (roadOpts.value >= 2.0) {
        return { type: 'buildRoad', edgeId: roadOpts.edgeId };
      }
      if (roadOpts.value >= 1.1 && resTotal(me.resources) >= 7) {
        return { type: 'buildRoad', edgeId: roadOpts.edgeId };
      }
    }

    // 6) 垄断：对手手里某种资源囤得多且我需要时
    if (hasDevCard(byType, 'monopoly')) {
      var mono = monopolyPick(state, me, myIdx, diff);
      if (mono) return { type: 'playDevCard', card: 'monopoly', resource: mono };
    }

    // 7) 银行/港口交易：一步（或两步）凑齐目标建造
    var bt = bestBankTrade(state, me, myIdx, diff, ctx);
    if (bt) return bt;

    // 8) 闲钱买发展卡
    if (byType.buyDevCard && byType.buyDevCard.length && shouldBuyDev(state, me, myIdx, diff, ctx)) {
      return { type: 'buyDevCard' };
    }

    // 9) 玩家交易（每人每回合最多主动报价一次，防止报价-拒绝死循环）
    if (byType.offerTrade && byType.offerTrade.length) {
      var ot = bestOfferTrade(state, me, myIdx, diff, ctx);
      if (ot) return ot;
    }

    // 10) 结束回合
    if (byType.endTurn && byType.endTurn.length) return { type: 'endTurn' };

    return actions[0];
  }

  // 本回合直接获胜的建造（只看自己总分，含暗分；胜利判定由引擎负责）。
  // v1.23：总 VP 与缺口统一走 ctx.totalVP / ctx.gap（契约 A 口径）
  function findWinningMove(state, byType, myIdx, ctx) {
    var need = ctx.gap[myIdx];
    if (need >= 1 && need <= 2 && byType.buildCity && byType.buildCity.length) {
      var opt = bestCityOption(state, byType, myIdx, 'hard', ctx);
      if (opt) return { type: 'buildCity', vertexId: opt.vertexId };
    }
    if (need === 1 && byType.buildSettlement && byType.buildSettlement.length) {
      var opt2 = bestSettlementOption(state, byType, myIdx, 'hard', ctx);
      if (opt2) return { type: 'buildSettlement', vertexId: opt2.vertexId };
    }
    return null;
  }

  function hasDevCard(byType, card) {
    var list = byType.playDevCard;
    if (!list) return false;
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].card === card) return true;
    }
    return false;
  }

  // 升城候选：取强盗感知下的增产价值，越接近冲线越激进
  function bestCityOption(state, byType, myIdx, diff, ctx) {
    if (!byType.buildCity || !byType.buildCity.length) return null;
    var best = null, bestScore = -Infinity;
    for (var i = 0; i < byType.buildCity.length; i++) {
      var vid = byType.buildCity[i].vertexId;
      var v = ctx.vtxById[vid];
      if (!v) continue;
      var prodNow = prodValue(vertexProd(ctx, v, state, false));
      var prodAll = prodValue(vertexProd(ctx, v, state, true));
      var s = prodNow + 0.35 * (prodAll - prodNow) + 0.3;
      // v1.23 契约 D：1-ply 前瞻——升城后该点产能翻倍的期望 + 分差收窄
      s += ply1Lookahead(ctx, myIdx, diff, 1, prodNow);
      if (diff === 'hard') {
        var mine = ctx.publicVP[myIdx];
        if (mine + 2 >= ctx.targetVP) s += 2.0;
        else if (mine >= ctx.targetVP - 4) s += 0.6;
      }
      s += noiseFor(diff) * 0.4;
      if (s > bestScore) { bestScore = s; best = { vertexId: vid, value: s }; }
    }
    return best;
  }

  // 建村候选：spotScore + 路网保护 + 封锁价值 + 卡位/截路 + 1-ply 前瞻
  function bestSettlementOption(state, byType, myIdx, diff, ctx) {
    if (!byType.buildSettlement || !byType.buildSettlement.length) return null;
    var best = null, bestScore = -Infinity;
    for (var i = 0; i < byType.buildSettlement.length; i++) {
      var vid = byType.buildSettlement[i].vertexId;
      var s = spotScore(ctx, state, vid);
      if (touchesMyRoad(state, ctx, myIdx, vid)) s += 0.5;
      s += denyBonus(state, ctx, myIdx, vid, diff);
      s += blockBonusSettlement(state, ctx, myIdx, vid, diff); // v1.23 契约 C 卡位/截路
      // v1.23 契约 D：1-ply 前瞻——落村新增产能的期望 + 分差收窄
      s += ply1Lookahead(ctx, myIdx, diff, 1, vertexProdValueNow(state, ctx, ctx.vtxById[vid]));
      if (diff === 'hard' && ctx.publicVP[myIdx] + 1 >= ctx.targetVP) s += 2.0;
      s += noiseFor(diff) * 0.4;
      if (s > bestScore) { bestScore = s; best = { vertexId: vid, value: s }; }
    }
    return best;
  }

  function bestRoadOption(state, roadActions, myIdx, diff, ctx) {
    var best = null, bestScore = -Infinity;
    for (var i = 0; i < roadActions.length; i++) {
      var eid = roadActions[i].edgeId;
      var s = roadScore(state, ctx, myIdx, eid, diff) + noiseFor(diff) * 0.4;
      if (s > bestScore) { bestScore = s; best = { edgeId: eid, value: s }; }
    }
    return best;
  }

  // 建路价值：通向的空点潜力 + 最长公路推进/争夺 + 封锁 + 截路（v1.23 契约 C）
  function roadScore(state, ctx, myIdx, edgeId, diff) {
    var e = ctx.edgeById[edgeId];
    if (!e) return -99;
    var s = blockBonusRoad(state, ctx, myIdx, edgeId, diff); // 抢占威胁玩家要修的边
    for (var i = 0; i < e.vertices.length; i++) {
      var vid = e.vertices[i];
      var v = ctx.vtxById[vid];
      if (!v) continue;
      if (!v.building) {
        s += 0.55 * spotScore(ctx, state, vid);
        if (touchesMyRoad(state, ctx, myIdx, vid)) s += 0.15; // 自己路网内更安全
        s += denyBonus(state, ctx, myIdx, vid, diff) * 0.4;
      } else if (v.building.player === myIdx) {
        s += 0.15;
      }
    }
    var myLen = ctx.lr.lens[myIdx] || 0;
    var lenWith = longestRoadLen(state, myIdx, edgeId, ctx.vtxById);
    if (lenWith > myLen) s += 0.35 * (lenWith - myLen);
    if (lenWith >= 5 && ctx.lr.holder !== myIdx) {
      if (myLen >= 4) s += 1.5;       // 一条路就能夺最长公路
      else if (diff !== 'easy' && myLen >= 3) s += 0.5;
    }
    return s;
  }

  // 是否打出骑士
  function shouldPlayKnight(state, me, myIdx, diff, ctx) {
    if (!me.dev || (me.dev.knight || 0) <= 0) return false;
    var played = me.knightsPlayed || 0;

    // 打出即夺最大军队（≥3 且超过现有持有者）→ 直接打
    if (played + 1 >= 3 && (ctx.army.holder === -1 || ctx.army.max < played + 1)) return true;

    // 被强盗压在生产格上
    var blocked = myBlockedValue(state, ctx, myIdx);
    if (blocked >= 2.4) return true;

    // 找一个值得打击的落点（除当前强盗格外的陆地图格）
    var bestScore = -Infinity;
    var hexes = (state.board && state.board.hexes) || [];
    for (var i = 0; i < hexes.length; i++) {
      var h = hexes[i];
      if (h.id === state.robber) continue;
      if (h.terrain === 'sea' || h.terrain === 'desert' || !h.number) continue;
      var s = scoreRobberHex(state, ctx, myIdx, h.id, diff);
      if (s > bestScore) bestScore = s;
    }
    if (bestScore >= 2.2 && diff !== 'easy') return true;
    if (blocked >= 1.4 && bestScore >= 1.2) return true;
    if (diff === 'hard' && played >= 2 && bestScore >= 1.5) return true; // 冲最大军队
    return false;
  }

  // 丰收+2 选哪两张：优先补齐某个高价值建造的缺口
  function yopPick(state, me, myIdx, diff, ctx) {
    var goals = buildGoalList(state, me, myIdx, diff, ctx);
    for (var i = 0; i < goals.length; i++) {
      var g = goals[i];
      var miss = missingFor(g.cost, me.resources);
      if (miss.total === 0 || miss.total > 2) continue;
      var picks = [];
      for (var k in miss.map) {
        for (var n = 0; n < miss.map[k]; n++) picks.push(k);
      }
      while (picks.length < 2) picks.push(secondNeed(picks));
      return picks.slice(0, 2);
    }
    // 没有紧急目标且手牌少：拿城市燃料
    if (diff !== 'easy' && resTotal(me.resources) <= 3) return ['wheat', 'ore'];
    return null;
  }

  function secondNeed(exclude) {
    var order = ['wheat', 'ore', 'wood', 'brick', 'sheep'];
    for (var i = 0; i < order.length; i++) {
      if (exclude.indexOf(order[i]) < 0) return order[i];
    }
    return 'wheat';
  }

  // 是否打出路修卡（免费两路）
  function shouldPlayRoadBuilding(state, me, myIdx, diff, ctx, roadActions) {
    if (!me.dev || (me.dev.roadBuilding || 0) <= 0) return false;
    if ((state.roadBuildingPending || 0) > 0) return false;
    var scores = [];
    for (var i = 0; i < roadActions.length; i++) {
      scores.push(roadScore(state, ctx, myIdx, roadActions[i].edgeId, diff));
    }
    scores.sort(function (a, b) { return b - a; });
    var t1 = scores[0] || 0, t2 = scores[1] || 0;
    // 差两条到 5 就能争最长公路 → 直接打
    var myLen = ctx.lr.lens[myIdx] || 0;
    if (myLen >= 3 && myLen + 2 >= 5 && ctx.lr.holder !== myIdx) return true;
    var need = diff === 'easy' ? 5.5 : (diff === 'hard' ? 3.2 : 4.0);
    return (t1 + t2) >= need || (t1 >= 3.5 && t2 >= 1.0);
  }

  // 垄断选资源：对手持有量 × 资源价值 × 我的需要程度
  function monopolyPick(state, me, myIdx, diff) {
    if (diff === 'easy' && Math.random() < 0.5) return null;
    var bestRes = null, bestScore = 0;
    for (var i = 0; i < RES_KEYS.length; i++) {
      var r = RES_KEYS[i];
      var hold = 0;
      for (var j = 0; j < state.players.length; j++) {
        if (j !== myIdx) hold += state.players[j].resources[r] || 0;
      }
      var s = hold * (RES_VALUE[r] || 1) * needWeight(me, r);
      if (diff === 'hard' && r === 'wheat') s *= 1.15; // 麦最抢手
      if (s > bestScore) { bestScore = s; bestRes = r; }
    }
    var threshold = diff === 'easy' ? 3.5 : 2.2;
    return bestScore >= threshold ? bestRes : null;
  }

  // 银行/港口交易：交易后目标建造可完成（或只剩 1 缺口可下回合补齐）
  function bestBankTrade(state, me, myIdx, diff, ctx) {
    var goals = buildGoalList(state, me, myIdx, diff, ctx);
    var best = null, bestScore = -Infinity;
    for (var i = 0; i < goals.length; i++) {
      var g = goals[i];
      var miss = missingFor(g.cost, me.resources);
      if (miss.total === 0 || miss.total > 2) continue;

      // 换入资源：取价值最高的缺口
      var m = null, mv = -1;
      for (var mi = 0; mi < RES_KEYS.length; mi++) {
        var rr = RES_KEYS[mi];
        if (miss.map[rr] && (RES_VALUE[rr] || 1) > mv) {
          mv = RES_VALUE[rr] || 1;
          m = rr;
        }
      }
      if (!m) continue;

      for (var si = 0; si < RES_KEYS.length; si++) {
        var s = RES_KEYS[si];
        if (s === m || miss.map[s]) continue; // 只用真盈余去换
        var rate = portRate(me, s);
        if ((me.resources[s] || 0) < rate) continue;

        // 模拟交易后的资源
        var after = {};
        for (var ri = 0; ri < RES_KEYS.length; ri++) {
          var r2 = RES_KEYS[ri];
          after[r2] = (me.resources[r2] || 0) - (r2 === s ? rate : 0) + (r2 === m ? 1 : 0);
        }
        var missAfter = missingFor(g.cost, after);
        var completes = missAfter.total === 0;
        var chains = !completes && missAfter.total < miss.total &&
          missAfter.total <= 1 && diff !== 'easy';
        if (!completes && !chains) continue;

        // 不破坏更高优先级且已可完成的目标
        var ok = true;
        for (var j = 0; j < i; j++) {
          var gj = goals[j];
          if (gj.kind === 'settlement' && !ctx.settleSpotExists) continue;
          if (missingFor(gj.cost, me.resources).total === 0 &&
            missingFor(gj.cost, after).total > 0) { ok = false; break; }
        }
        if (!ok) continue;

        var score = g.value + (completes ? 0.5 : 0) - rate * 0.15 + noiseFor(diff) * 0.3;
        if (score > bestScore) {
          bestScore = score;
          var give = {}, get = {};
          give[s] = rate;
          get[m] = 1;
          best = { type: 'bankTrade', give: give, get: get };
        }
      }
    }
    return best;
  }

  // 是否闲钱买发展卡：手牌爆满必买；为临近的城/村目标留资源后仍有富余则买
  function shouldBuyDev(state, me, myIdx, diff, ctx) {
    if (resTotal(me.resources) >= 7) return true; // 防 7 弃牌，先花掉

    var reserved = { wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 };
    var goals = buildGoalList(state, me, myIdx, diff, ctx);
    for (var i = 0; i < goals.length; i++) {
      var g = goals[i];
      if (g.kind === 'dev' || g.kind === 'road') continue;
      if (g.kind === 'settlement' && !ctx.settleSpotExists) continue;
      var miss = missingFor(g.cost, me.resources);
      if (miss.total > 0 && miss.total <= 2) {
        for (var k in miss.map) reserved[k] += miss.map[k];
      }
    }
    var ok = true;
    for (var j = 0; j < RES_KEYS.length; j++) {
      var r = RES_KEYS[j];
      if ((me.resources[r] || 0) - reserved[r] < (COST.dev[r] || 0)) ok = false;
    }
    if (ok) return true;

    // 军队路线：手里有骑士或已打出 2 张，城市目标还远 → 买卡冲军队
    if (diff !== 'easy' &&
      ((me.dev && (me.dev.knight || 0) > 0) || (me.knightsPlayed || 0) >= 2) &&
      (me.resources.sheep || 0) >= 1 && (me.resources.wheat || 0) >= 1 &&
      (me.resources.ore || 0) >= 1) {
      return true;
    }

    // v1.23 契约 D（1-ply 前瞻）：距胜利缺口 ≤4 且村/城都买不起时（能建早在
    // 前面的分支建了），闲钱买卡冲分差——牌堆期望 VP 5/25 + 骑士进度也是收益
    var w = masterWeights(diff);
    if (w.lookahead > 0 && ctx.targetVP - (ctx.totalVP[myIdx] || 0) <= 4 &&
      (me.resources.sheep || 0) >= 1 && (me.resources.wheat || 0) >= 1 &&
      (me.resources.ore || 0) >= 1) {
      return true;
    }
    return false;
  }

  // 每人每回合最多主动报价一次的哨兵（模块级，键 = 玩家:回合数）。
  // 跨局/读档后键可能撞车（如都为 '0:3'）误抑制报价，故由 app 在
  // startNewGame / loadGame 时调用 resetOfferMemo() 清零
  var _lastOfferKey = null;
  function resetOfferMemo() { _lastOfferKey = null; }

  // 玩家交易报价：用盈余资源换缺口资源，报价给得起且大概率被接受。
  // v1.23 契约 B：不向威胁玩家（距胜利缺口 ≤2）送砖/矿/麦（easy 行为不变）
  function bestOfferTrade(state, me, myIdx, diff, ctx) {
    var key = myIdx + ':' + state.turnCount;
    if (_lastOfferKey === key) return null;
    var w = masterWeights(diff);

    // 已可完成目标所需的资源视为预留，不拿去送人
    var reserved = { wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 };
    var goals = buildGoalList(state, me, myIdx, diff, ctx);
    for (var i = 0; i < goals.length; i++) {
      var g0 = goals[i];
      if (g0.kind === 'settlement' && !ctx.settleSpotExists) continue;
      if (missingFor(g0.cost, me.resources).total === 0) {
        for (var k in g0.cost) reserved[k] += g0.cost[k];
      }
    }

    for (i = 0; i < goals.length; i++) {
      var g = goals[i];
      if (g.kind === 'settlement' && !ctx.settleSpotExists) continue;
      var miss = missingFor(g.cost, me.resources);
      if (miss.total === 0 || miss.total > 2) continue;

      var m = null, mv = -1;
      for (var mi = 0; mi < RES_KEYS.length; mi++) {
        var rr = RES_KEYS[mi];
        if (miss.map[rr] && (RES_VALUE[rr] || 1) > mv) { mv = RES_VALUE[rr] || 1; m = rr; }
      }
      if (!m) continue;

      for (var si = 0; si < RES_KEYS.length; si++) {
        var s = RES_KEYS[si];
        if (s === m || miss.map[s]) continue;
        var avail = (me.resources[s] || 0) - (reserved[s] || 0);
        if (avail < 1) continue;
        // 报价要够诱人：给出的价值 ≥ 想要资源价值的约 1.3 倍
        var n = Math.max(1, Math.ceil((RES_VALUE[m] || 1) * 1.3 / (RES_VALUE[s] || 1)));
        if (n > avail) continue;

        // 目标：手里有该资源的对手；hard 避开领先者；
        // v1.23 契约 B：换出的 s 是砖/矿/麦时不找威胁玩家（不资敌）
        var targets = [];
        for (var pj = 0; pj < state.players.length; pj++) {
          if (pj === myIdx) continue;
          var p = state.players[pj];
          if (!p || (p.resources[m] || 0) < 1) continue;
          if (diff === 'hard' && pj === ctx.leader &&
            ctx.publicVP[pj] > ctx.publicVP[myIdx]) continue;
          if (w.feedPenalty > 0 && FEED_RES[s] && ctx.threatMap[pj]) continue;
          targets.push(pj);
        }
        if (!targets.length) continue;

        _lastOfferKey = key;
        var give = {}, get = {};
        give[s] = n;
        get[m] = 1;
        return { type: 'offerTrade', give: give, get: get, targets: targets.slice(0, 3) };
      }
    }
    return null;
  }

  /* ------------------------------ 玩家交易应答（v1.19 还价协议） ------------------------------ */

  // 资源 r 对我的加权价值：RES_VALUE 基础价值 × needWeight 需求权重
  function counterResValue(me, r) {
    return (RES_VALUE[r] || 1) * needWeight(me, r);
  }

  function copyRes(res) {
    var out = {};
    for (var i = 0; i < RES_KEYS.length; i++) {
      var k = RES_KEYS[i];
      if (res && res[k]) out[k] = res[k];
    }
    return out;
  }

  // 还价形态自检（对齐引擎 A5 校验）：双方总量 ≥1 且给出与换取不等价
  function validCounterShape(give, get) {
    if (resTotal(give) < 1 || resTotal(get) < 1) return false;
    if (resTotal(give) === resTotal(get)) {
      for (var i = 0; i < RES_KEYS.length; i++) {
        if ((give[RES_KEYS[i]] || 0) !== (get[RES_KEYS[i]] || 0)) return true;
      }
      return false; // 总量相等且每种资源数量完全相同 → 等价报价，引擎会拒绝
    }
    return true;
  }

  // 还价构造（契约 B2）：效用 < 0 时提出对己更有利的反向报价。
  // 引擎口径：incoming = 对方付给我，outgoing = 我要付出。
  // 首选：把我付出的资源中对己价值最低者减 1（付出总量仍 ≥1）；
  // 付出的总量已是最少 1 张时：改为在对方给我的资源中加 1 张我最缺的。
  // 构造结果须通过引擎校验（见 validCounterShape），否则放弃还价直接拒绝。
  function buildCounter(me, incoming, outgoing) {
    if (resTotal(outgoing) >= 2) {
      var pick = null, pickVal = Infinity;
      for (var i = 0; i < RES_KEYS.length; i++) {
        var r = RES_KEYS[i];
        if ((outgoing[r] || 0) <= 0) continue;
        var v = counterResValue(me, r);
        if (v < pickVal) { pickVal = v; pick = r; }
      }
      if (pick) {
        var give = copyRes(outgoing);
        give[pick] -= 1;
        if (!give[pick]) delete give[pick];
        var get = copyRes(incoming);
        if (validCounterShape(give, get)) return { give: give, get: get };
      }
    }
    // 兜底：我付出的总量已是 1 张 → 按「最缺优先、同分价值高者优先」挑 1 种资源加进对方给我的清单
    var order = RES_KEYS.slice().sort(function (a, b) {
      var d = counterResValue(me, b) - counterResValue(me, a);
      return d !== 0 ? d : RES_KEYS.indexOf(a) - RES_KEYS.indexOf(b);
    });
    for (var j = 0; j < order.length; j++) {
      var r2 = order[j];
      var give2 = copyRes(outgoing);
      var get2 = copyRes(incoming);
      get2[r2] = (get2[r2] || 0) + 1;
      if (validCounterShape(give2, get2)) return { give: give2, get: get2 };
    }
    return null;
  }

  function respondTrade(state, playerIdx, trade, difficulty) {
    var diff = normalizeDiff(difficulty);
    if (!state || !state.players || !state.players[playerIdx] || !trade) {
      return { accept: false };
    }
    if (trade.from != null && trade.from === playerIdx) return { accept: false };

    var me = state.players[playerIdx];
    var incoming = trade.give || {}; // 对方付给我
    var outgoing = trade.get || {};  // 我要付出

    // v1.23 契约 A/B：报价方是否威胁玩家（距胜利缺口 ≤2）——反资敌加权的对象
    var w = masterWeights(diff);
    var fromIsThreat = false;
    if (w.feedPenalty > 0 || w.blockCounter) {
      var from = trade.from;
      if (from != null && from >= 0 && from !== playerIdx && from < state.players.length) {
        var respTargetVP = (state.config && state.config.targetVP) || 10;
        fromIsThreat = respTargetVP - totalVPOf(state, from, getEngine(), null) <= 2;
      }
    }

    // 是否付得起对方所要：付不起时接受必被引擎拒绝（h7），先记下，不能在这里
    // 提前否决还价路径——buildCounter 首选分支正是把付出减 1，恰好可能把付不起
    // 变成付得起（如被要 2 麦而只有 1 麦 → 还价只付 1 麦，引擎实测接受）
    var canPay = true;
    for (var i = 0; i < RES_KEYS.length; i++) {
      var r = RES_KEYS[i];
      if ((outgoing[r] || 0) > (me.resources[r] || 0)) { canPay = false; break; }
    }

    // depth 缺省（旧调用方/旧存档）视为原始报价
    var depth = trade.depth === 1 ? 1 : 0;

    // 效用 = 我收到的价值 − 我付出的价值（RES_VALUE × needWeight 加权，契约 B1）
    // v1.23 契约 B：报价方为威胁玩家时，我付出的每份砖/矿/麦额外 −2（normal −1）
    // ——给「对手收益」加权，向冲线者售城墙/城市燃料等于资敌
    var inVal = 0, outVal = 0;
    for (i = 0; i < RES_KEYS.length; i++) {
      var r2 = RES_KEYS[i];
      var w2 = (RES_VALUE[r2] || 1) * needWeight(me, r2);
      inVal += (incoming[r2] || 0) * w2;
      outVal += (outgoing[r2] || 0) * (w2 + (fromIsThreat && FEED_RES[r2] ? w.feedPenalty : 0));
    }

    // 效用 ≥ 0 → 接受（付不起时接受必被引擎拒绝，退为拒绝）；
    // 否则对还价的再应答只能拒绝（绝不二次还价，契约 B3/B4）
    if (inVal - outVal >= 0) return canPay ? { accept: true } : { accept: false };
    if (depth !== 0) return { accept: false };

    // 原始报价还价（契约 B2）：easy 一半概率懒得还价，直接拒绝
    if (diff === 'easy' && Math.random() < 0.5) return { accept: false };
    var counter = buildCounter(me, incoming, outgoing);
    if (!counter) return { accept: false };
    // v1.23 契约 B：向威胁玩家的还价若仍要把砖/矿/麦送到对方手里 → 明显资敌，
    // 直接拒绝，不出 counter（normal/hard 生效，easy 行为不变）
    if (w.blockCounter && fromIsThreat) {
      for (i = 0; i < RES_KEYS.length; i++) {
        var r3 = RES_KEYS[i];
        if (FEED_RES[r3] && (counter.give[r3] || 0) > 0) return { accept: false };
      }
    }
    // 还价给出的必须是我付得起的（引擎 A5 校验会拒绝付不起的 counter），
    // 兜底分支不改变付出总量，付不起的原报价构造出的还价仍可能付不起
    for (i = 0; i < RES_KEYS.length; i++) {
      var r4 = RES_KEYS[i];
      if ((counter.give[r4] || 0) > (me.resources[r4] || 0)) return { accept: false };
    }
    return { accept: false, counter: counter };
  }

  /* ------------------------------ 入口与 UMD 桥接 ------------------------------ */

  function decide(state, playerIdx, difficulty) {
    if (!state || !state.players || !state.players[playerIdx]) return null;
    if (state.pendingTrade) {
      // 挂单期间 getValidActions 只列当前应答者的 respondTrade（应答决策由
      // respondTrade() 按契约 B1~B4 专职处理）。若放行进 decideMain：
      // bestBankTrade 不查 byType 会返回非法 bankTrade，或盲取 actions[0]
      // （未经 B1 效用评估、甚至付不起的 accept），违背「decide 返回的动作
      // 必然可被引擎接受」的文件不变量，故直接返回 null（与 gameover 同语义）
      return null;
    }
    var engine = getEngine();
    var actions = null;
    if (engine && typeof engine.getValidActions === 'function') {
      try { actions = engine.getValidActions(state); } catch (e) { actions = null; }
    }
    if (!actions || !actions.length) return null;

    var diff = normalizeDiff(difficulty || state.players[playerIdx].difficulty);
    var ctx = buildCtx(state, engine);
    var phase = state.phase;

    if (phase === 'setup1' || phase === 'setup2') {
      return decideSetup(state, actions, playerIdx, diff, ctx);
    }
    if (phase === 'discard') return decideDiscard(state, playerIdx, diff);
    if (phase === 'robber') return decideRobber(state, actions, playerIdx, diff, ctx);
    if (phase === 'steal') {
      var sa = bestStealAction(state, actions, ctx, playerIdx, diff);
      return sa || actions[0];
    }
    if (phase === 'main') return decideMain(state, actions, playerIdx, diff, ctx);
    return null; // gameover 或未知阶段
  }

  const CatanAI = {
    decide: decide,
    respondTrade: respondTrade,
    resetOfferMemo: resetOfferMemo // app 在新开局/读档时调用，清跨局哨兵
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = CatanAI;
  } else {
    window.CatanAI = CatanAI;
  }
})();

  <script>
/* ======================================================================
   js/net.js —— 联机客户端（零依赖，原生 fetch）
   ----------------------------------------------------------------------
   只做三件事：建房/加入、轮询状态、提交动作。
   服务器权威：本地不推进状态，所有动作都由服务器校验后回传完整 state。
   ====================================================================== */
(function (global) {
  'use strict';

  var BASE = '';                 // 与页面同源（服务器同时托管静态文件）
  var TIMEOUT_MS = 8000;         // 单次请求超时，避免网络挂起时无限等待
  var SERVER_INFO = null;        // /api/ping 返回的服务器信息（含局域网地址）
  var NET = {
    code: null,
    playerId: null,
    seat: -1,
    version: 0,
    host: false,
    started: false,
    lastError: null
  };

  // 页面不是由联机服务器提供时的统一提示（HTTP 501/404 的 HTML 错误页最常见）
  function notServedMsg(status) {
    return '当前页面不是由联机服务器提供的（HTTP ' + status + '）。' +
      '请先在项目目录运行 node server/server.js，再用它打印的地址打开本页（例如 http://127.0.0.1:8080/）。';
  }
  function offlineMsg(detail) {
    return '无法连接联机服务器' + (detail ? '（' + detail + '）' : '') +
      '。请确认 node server/server.js 正在运行，并用它打印的地址打开页面。';
  }

  function post(path, body) {
    // file:// 直接打开的单文件版没有服务器可连，提前给出明确说明
    if (typeof location !== 'undefined' && location.protocol === 'file:') {
      return Promise.resolve({ ok: false, error: '单文件版（file://）不支持联机。请运行 node server/server.js，再用它打印的地址打开页面。' });
    }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
    return fetch(BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      if (timer) clearTimeout(timer);
      // 先看 Content-Type：非 JSON 说明对端不是联机服务器（静态服务器/其它服务）
      var ct = '';
      try { ct = (r.headers && r.headers.get) ? (r.headers.get('Content-Type') || '') : ''; } catch (e) { ct = ''; }
      if (ct.toLowerCase().indexOf('json') < 0) {
        return { ok: false, error: notServedMsg(r.status) };
      }
      return r.json().then(function (j) {
        if (j && typeof j === 'object') return j;
        return { ok: false, error: notServedMsg(r.status) };
      }).catch(function () {
        return { ok: false, error: notServedMsg(r.status) };
      });
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      var aborted = e && (e.name === 'AbortError');
      return { ok: false, error: aborted ? '连接服务器超时（8 秒）。请确认 node server/server.js 正在运行。' : offlineMsg(e && e.message ? e.message : '网络错误') };
    });
  }

  function ping() {
    return post('/api/ping', {}).then(function (res) {
      if (res && res.ok) SERVER_INFO = res;
      return res;
    });
  }

  function reset() {
    NET.code = null;
    NET.playerId = null;
    NET.seat = -1;
    NET.version = 0;
    NET.host = false;
    NET.started = false;
    NET.lastError = null;
    clearSession();
  }

  /* ---------- 会话持久化：刷新/断网后可自动回座 ----------
     用 sessionStorage 而不是 localStorage：
       - 同一标签页刷新 → 会话保留，自动回到原座位
       - 新开标签页 → 独立会话，可当另一个玩家加入（同一台机器双人测试要靠这个）
     注意不要在模块顶层直接取 window.sessionStorage（node require 时没有 window）。 */
  var LS_SESSION = 'catan.netSession';
  function sessionStore() {
    try { return (typeof window !== 'undefined' && window.sessionStorage) ? window.sessionStorage : null; }
    catch (e) { return null; }
  }
  function saveSession() {
    var st = sessionStore();
    if (!st) return;
    try {
      if (NET.code && NET.playerId) {
        st.setItem(LS_SESSION, JSON.stringify({ code: NET.code, playerId: NET.playerId }));
      }
    } catch (e) { /* 存储不可用则忽略 */ }
  }
  function restoreSession() {
    var st = sessionStore();
    if (!st) return false;
    try {
      var s = JSON.parse(st.getItem(LS_SESSION) || 'null');
      if (s && s.code && s.playerId) {
        NET.code = s.code;
        NET.playerId = s.playerId;
        return true;
      }
    } catch (e) { /* 损坏则忽略 */ }
    return false;
  }
  function clearSession() {
    var st = sessionStore();
    if (!st) return;
    try { st.removeItem(LS_SESSION); } catch (e) { /* 忽略 */ }
  }

  function absorb(res) {
    if (!res || !res.ok) {
      NET.lastError = res && res.error ? res.error : '未知错误';
      return res || { ok: false, error: NET.lastError };
    }
    NET.lastError = null;
    if (res.code) NET.code = res.code;
    if (res.playerId) NET.playerId = res.playerId;
    if (res.room) {
      NET.seat = res.room.yourSeat;
      NET.host = !!res.room.host;
      NET.started = !!res.room.started;
    }
    if (typeof res.version === 'number') NET.version = res.version;
    saveSession();
    return res;
  }

  function create(name, cfg) {
    return post('/api/create', { name: name, config: cfg }).then(absorb);
  }
  function join(code, name) {
    return post('/api/join', { code: String(code).trim().toUpperCase(), name: name }).then(absorb);
  }
  function room() {
    if (!NET.code) return Promise.resolve({ ok: false, error: '尚未加入房间' });
    return post('/api/room', { code: NET.code, playerId: NET.playerId }).then(absorb);
  }
  function start() {
    return post('/api/start', { code: NET.code, playerId: NET.playerId }).then(absorb);
  }
  function state() {
    if (!NET.code) return Promise.resolve({ ok: false, error: '尚未加入房间' });
    return post('/api/state', { code: NET.code, playerId: NET.playerId, since: NET.version }).then(absorb);
  }
  function action(a) {
    if (!NET.code) return Promise.resolve({ ok: false, error: '尚未加入房间' });
    return post('/api/action', {
      code: NET.code, playerId: NET.playerId, action: a, since: NET.version
    }).then(absorb);
  }

  NET.create = create;
  NET.join = join;
  NET.room = room;
  NET.start = start;
  NET.state = state;
  NET.action = action;
  NET.ping = ping;
  NET.reset = reset;
  NET.serverInfo = function () { return SERVER_INFO; };
  NET.restoreSession = restoreSession;
  NET.clearSession = clearSession;
  NET.info = function () {
    return { code: NET.code, playerId: NET.playerId, seat: NET.seat, version: NET.version, host: NET.host, started: NET.started };
  };

  if (typeof module !== 'undefined' && module.exports) { module.exports = NET; }
  else { global.CatanNet = NET; }
})(typeof window !== 'undefined' ? window : this);

</script>

/*
 * js/ui.js —— 卡坦岛界面渲染与交互（只挂 window.CatanUI）
 * ------------------------------------------------------------------
 * 对接协议（与 app.js 对齐）：

  function renderSetupPlayers() {

      (function (idx) {

        });
        if (COLOR_ORDER.indexOf(setupColors[idx]) < 0) setupColors[idx] = COLOR_ORDER[idx];

  function readSetupConfig() {
    var rows = byId('uiSetupPlayers').querySelectorAll('.setup-row');
    var players = [], colors = {};
    for (var i = 0; i < rows.length; i++) {
      var sel = rows[i].querySelectorAll('select, input');
      var name = sel[0].value.trim() || ('玩家' + (i + 1));
      var color = sel[1].value;
      if (colors[color]) color = COLOR_ORDER.find(function (c) { return !colors[c]; }) || color;
      colors[color] = 1;
      players.push({
        name: name, color: color,
        isAI: sel[2].value === '1',
        difficulty: sel[3] ? sel[3].value : 'normal'
      });
      setupNames[i] = sel[0].value;
      setupColors[i] = color;
      setupKinds[i] = sel[2].value;
      setupDiffs[i] = sel[3] ? sel[3].value : 'normal';
    }
    var tvp = clamp(parseInt(byId('uiTargetVP').value, 10) || 10, 3, 20);
    // v1.24 房规开关（契约 A）：默认双 false，勾选后随 config 交给引擎 createGame
    return {
      players: players,
      targetVP: tvp,
      randomBoard: byId('uiRandomBoard').checked,
      houseRules: {
        balancedDice: !!(byId('uiBalancedDice') && byId('uiBalancedDice').checked),
